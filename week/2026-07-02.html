925", "title": "Nemotron-Labs-Diffusion: A Tri-Mode Language Model Unifying Autoregressive, Diffusion, and Self-Speculation Decoding", "abstract": "NVIDIA 的三模式语言模型，一个架构同时支持自回归、扩散和自投机解码，按部署并发切换模式维持高吞吐。", "effects": "8B 模型每 forward 解码 token 数是 Qwen3-8B 的 6 倍，SPEED-Bench 上 GB200 + SGLang 吞吐高 4 倍；自投机模式接受率超 MTP。", "mechanism": "联合 AR-扩散训练目标，扩散改善前瞻规划、AR 提供左到右语言先验；自投机模式下扩散起草、AR 验证；扩散最优采样器潜力达每 forward 多 76.5% token。", "paper_url": "https://arxiv.org/abs/2607.05722", "date": "2026-07-07", "score": 17, "score_relevance": 7, "score_contribution": 10, "score_reason": "三模式统一解码属推理加速技术栈，可迁移（relevance 7）。AR+扩散互补+自投机统一是范式级创新（contribution 10）。作者含 Song Han (MIT)、Pavlo Molchanov/Jan Kautz (NVIDIA)，NVIDIA 主导，证据：Nemotron 品牌+作者 NVIDIA 署名。", "source_tier": "公司项目", "open_source": false, "tags": ["方向:投机解码", "方向:高效推理", "方向:模型架构", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Yonggan Fu, Lexington Whalen, Abhinav Garg, Chengyue Wu, Maksim Khadkevich, Nicolai Oswald, Enze Xie, Daniel Egert, Sharath Turuvekere Sreenivas, Shizhe Diao, Chenhan Yu, Ye Yu, Weijia Chen, Sajad Norouzi, Jingyu Liu, Shiyi Lan, Ligeng Zhu, Jin Wang, Jindong Jiang, Morteza Mardani, Mehran Maghoumi, Song Han, Ante Jukić, Nima Tajbakhsh, Jan Kautz, Pavlo Molchanov", "vendors": "NVIDIA", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05147", "run_id": "run-20260709-165925", "title": "DSpark: Confidence-Scheduled Speculative Decoding with Semi-Autoregressive Generation", "abstract": "DeepSeek 的投机解码框架，用半自回归架构给并行草稿加块内依赖，再按置信度自适应裁剪验证长度，高并发下不浪费批容量。", "effects": "DeepSeek-V4 服务系统真实流量下，相比 MTP-1 基线每用户生成速度提升 60-85%，在严格交互约束下打开此前不可达的性能档。", "mechanism": "半自回归架构（并行骨干+轻量序列模块）建模块内依赖缓解后缀衰减；置信度调度验证按前缀存活概率和引擎吞吐画像动态裁剪验证长度。", "paper_url": "https://arxiv.org/abs/2607.05147", "date": "2026-07-06", "score": 17, "score_relevance": 7, "score_contribution": 10, "score_reason": "投机解码属推理加速技术栈，云端 serving 验证但技术可迁移端侧（relevance 7）。DeepSeek 生产级创新，半自回归+置信度调度显著推进 SOTA（contribution 10）。论文明确署 DeepSeek-V4 服务系统、作者为 DeepSeek 团队（Wenfeng Liang, Damai Dai 等），证据：arXiv 论文机构署名与 DeepSeek-V4 引用。", "source_tier": "公司项目", "open_source": false, "tags": ["方向:投机解码", "方向:云端serving", "方向:高效推理", "模型:DeepSeek"], "insight_person": "", "wiki_url": "", "authors": "Xin Cheng, Xingkai Yu, Chenze Shao, Jiashi Li, Yunfan Xiong, Yi Qian, Jiaqi Zhu, Shirong Ma, Xiaokang Zhang, Jiasheng Ye, Qinyu Chen, Chengqi Deng, Jiping Yu, Damai Dai, Zhengyan Zhang, Yixuan Wei, Yixuan Tan, Wenkai Yang, Runxin Xu, Yu Wu, Zhean Xu, Xuanyu Wang, Muyang Chen, Rui Tian, Xiao Bi, Zhewen Hao, Shaoyuan Chen, Huanqi Cao, Wentao Zhang, Anyi Xu, Huishuai Zhang, Dongyan Zhao, Wenfeng Liang", "vendors": "DeepSeek", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04371", "run_id": "run-20260709-165925", "title": "Nemotron-Labs-3-Puzzle-75B-A9B: Compressing Hybrid MoE LLMs", "abstract": "把 Nemotron-3-Super 混合 MoE 大模型压缩成 Puzzle-75B-A9B，优化交互式部署吞吐。", "effects": "单 8xB200 节点上交互式吞吐约为原模型 2 倍（同等用户吞吐约束）；单 H100 上 1M-token 并发从 1 提到 8；模型已在 Hugging Face 开源。", "mechanism": "多阶段管线结合 Iterative Puzzle 压缩、知识蒸馏、强化学习、量化与多 token 预测头，联合优化异质 MoE 剪枝、活跃参数预算与 Mamba 剪枝。", "paper_url": "https://arxiv.org/abs/2607.04371", "date": "2026-07-05", "score": 10, "score_relevance": 4, "score_contribution": 6, "score_reason": "云端交互式 serving 压缩部署（relevance 4，云端serving）。多阶段混合 MoE 压缩管线有创新（contribution 6）。Nemotron 为 NVIDIA 模型族、模型开源在 HF，证据：摘要明确 Nemotron-Labs 系列与 Hugging Face 发布，标 公司项目/NVIDIA。", "source_tier": "公司项目", "open_source": true, "tags": ["方向:云端serving", "方向:量化", "方向:MoE", "方向:蒸馏"], "insight_person": "", "wiki_url": "", "authors": "Akhiad Bercovich; Talor Abramovich; Daniel Afrimi; Shay Aharon; Nir Ailon; Vladimir Anisimov; Omer Ullman Argov; Maor Ashkenazi", "vendors": "NVIDIA", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07046", "run_id": "run-20260709-165925", "title": "Voltron: Enabling Elastic Multi-Device Execution of LLM Inference for Empowered Edge Intelligence", "abstract": "把 LLM 推理从单机扩展到多台用户端设备协同执行，让端侧能跑动更大的模型而不依赖云端数据中心。", "effects": "比单台端设备上的最强可跑 LLM 准确率高 16.5%，同时满足用户 QoS 延迟要求。", "mechanism": "提出 Voltron 框架，弹性调度多台边缘设备协同完成 LLM 推理，按真实边缘环境动态适配设备组合与负载分配。", "paper_url": "https://arxiv.org/abs/2607.07046", "date": "2026-07-08", "score": 17, "score_relevance": 9, "score_contribution": 8, "score_reason": "明确端侧多设备 LLM 推理框架，QoS 验证（relevance 9）。多设备弹性协同执行 LLM 是新范式，区别于单机量化路线（contribution 8）。作者机构 arXiv 元数据未明确标注，vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:推理框架", "方向:端云协同", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Chanwoo Cho, Wooseok Kim, Yonglak Son, Young Seo Lee, Young Geun Kim", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05475", "run_id": "run-20260709-165925", "title": "Is Your NPU Ready for LLMs? Dissecting the Hidden Efficiency Bottlenecks in Mobile LLM Inference", "abstract": "首个跨层测量移动端 LLM 推理的研究，覆盖 5 大框架和 CPU/GPU/NPU 三种后端，开发 PowerBench 做后端级能耗归因。", "effects": "NPU 上框架间性能差达 10 倍；发现 NPU 擅长计算密集 prefill、CPU 更擅长内存密集 decode；调度不当导致 40% 能耗浪费，最佳配置可降 NPU 能耗 54.8%。", "mechanism": "PowerBench 细粒度剖析工具做后端级能耗归因，发现框架 offload/量化策略差异、NPU 小核动态解码短板、线程/NPU 睡眠/CPU 轮询调度头部空间。", "paper_url": "https://arxiv.org/abs/2607.05475", "date": "2026-07-06", "score": 17, "score_relevance": 10, "score_contribution": 7, "score_reason": "移动端 NPU LLM 推理实测，明确端侧（relevance 10）。首个跨框架跨后端移动 LLM 能耗归因+PowerBench 工具有创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:推理框架", "方向:能耗功耗", "硬件:NPU", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Guanyu Cai, Ruiming Tian, Lang Yang, Zhouhong Ren, Jinliang Yuan, Lingkun Li, Jiliang Wang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03652", "run_id": "run-20260709-165925", "title": "ELiTeFormer: An Efficient Transformer for FPGAs", "abstract": "首个为 FPGA 部署联合设计混合线性注意力+三值超低精度线性投影的 Transformer 架构。", "effects": "比 LLaMA 3 权重压缩 10 倍、KV 缓存压缩 12.8 倍，MMLU 31.9%（BitNet b1.58 3% 以内）；FFN 9.6 倍加速、注意力 4.4 倍；端到端比 A100 GPU 延迟低 3.9 倍、能效高 3.2 倍。", "mechanism": "混合线性注意力+三值线性投影；处理单元微架构用 bitmask 消除三值投影所有乘法，完全不用 DSP 块；Xilinx VCK5000 Versal HLS 流程部署。", "paper_url": "https://arxiv.org/abs/2607.03652", "date": "2026-07-04", "score": 17, "score_relevance": 9, "score_contribution": 8, "score_reason": "FPGA Transformer 联合架构-硬件设计，明确端侧硬件（relevance 9）。线性注意力+三值量化+无乘法 PE 微架构是范式级创新（contribution 8）。作者 Sunketa/Agostini (PNNL)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:模型架构", "方向:量化", "方向:高效注意力", "方向:编译部署"], "insight_person": "", "wiki_url": "", "authors": "Victor Agostinelli, Nicolas Bohm Agostini, Antonino Tumeo", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07707", "run_id": "run-20260709-165925", "title": "Co-LMLM: Continuous-Query Limited Memory Language Models", "abstract": "让小模型不把事实知识塞进权重，而是外置到一个连续向量知识库，生成时按需查询，360M 参数即可逼近大模型事实精度。", "effects": "360M 规模下困惑度低于预训练数据多 40 倍的模型；SimpleQA 验证事实精度与 gpt-4o-mini 相当、高于 Claude Sonnet 4.5。", "mechanism": "知识库用连续键配文本值，模型生成时产出廉价向量查询检索人类可读知识并归因，配合标注管线标注自由文本事实 span。", "paper_url": "https://arxiv.org/abs/2607.07707", "date": "2026-07-08", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "360M 小模型+外置记忆逼近大模型事实能力，端侧可迁移（relevance 8）。连续查询 LMLM 范式新，打破权重记忆范式（contribution 8）。作者含 Yoav Artzi (NYU)、Kilian Weinberger (Cornell)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:模型架构", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yair Feldman, Linxi Zhao, Nathan Godey, Dongyoung Go, Yilun Hua, Kilian Q. Weinberger, Jennifer J. Sun, Yoav Artzi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07403", "run_id": "run-20260709-165925", "title": "Multi-Agent Robotic Control with Onboard Vision-Language Models", "abstract": "在机载硬件上部署多个专用 VLM agent 协同控制自主移动机械臂，彻底摆脱云端依赖。", "effects": "在 AMD Ryzen AI mini PC 上硬件在环仿真验证全机载多 agent 架构可行，成本低于云依赖方案，具备真实迁移潜力。", "mechanism": "多 agent 系统把 3-20B 紧凑 VLM 部署在机载，配 Megamind 编排 agent 缓解小模型长程规划上下文丢失，微调提升检测精度。", "paper_url": "https://arxiv.org/abs/2607.07403", "date": "2026-07-08", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确机载 VLM 多 agent 端侧部署，AMD Ryzen AI mini PC 真机验证（relevance 9）。机载多 agent 编排缓解小模型记忆是工程创新（contribution 7）。作者来自 Warsaw U of Tech / MIT，学校项目，开源仿真环境。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent", "方向:多模态", "方向:编译部署", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Kajetan Rachwał, Maciej Majek, Bartłomiej Boczek, Jakub Matejczyk, Dominik Matejkowski, Adam Dąbrowski, Tim Seyde, Alexander Amini, Maria Ganzha", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06651", "run_id": "run-20260709-165925", "title": "Entropy-Guided Tensor Compression for Multimodal Federated Learning on Edge Devices", "abstract": "在多模态联邦学习里按每层更新的谱熵自适应分配压缩秩，让算力各异的边缘设备也能高效参与训练。", "effects": "15 节点 Raspberry Pi 4/5 异构集群上压缩比达 56.8 倍，准确率还比未压缩 FedAvg 高 2.01%，收敛总传输量降到 1/66。", "mechanism": "MESH-FL 用截断 SVD 估计每层更新的谱熵，证明高熵需高重构秩，据此在模态/层/设备间按 payload 预算自适应分配矩阵乘积态压缩秩。", "paper_url": "https://arxiv.org/abs/2607.06651", "date": "2026-07-07", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "Raspberry Pi 集群多模态联邦学习，明确端侧（relevance 9）。熵引导张量压缩+收敛证明有理论与系统创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:剪枝稀疏", "方向:多模态", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Quoc Bao Phan, Tuy Tan Nguyen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04668", "run_id": "run-20260709-165925", "title": "Elastic Gang: Per-Token Membership Change for a Hard-Barriered LLM Inference Gang Co-Scheduled with OS Processes", "abstract": "端侧 LLM 解码是硬屏障 CPU-SIMD 计算要占满所有核，OS 其他进程也要这些核；提出弹性 gang 让核成员在每 token 间动态变化。", "effects": "AMD Zen 5 上 135M 和 7B 模型推理输出位级精确；比静态核划分 Pareto 优：中等推理占空比下通用吞吐 1.28-1.75 倍，推理空闲时恢复全部 8 核。", "mechanism": "ACK 锁定 epoch 协议不等待具名核：seqlock 式 generation-tagged 锁+RCU/epoch 式成员同意，每 token 参与集为请求核与 ack 核的交集；借核 0.22us，不抢占运行租户。", "paper_url": "https://arxiv.org/abs/2607.04668", "date": "2026-07-06", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确端侧 LLM 解码 OS 调度，真机验证（relevance 9）。弹性 gang+epoch 协议是 OS-级系统创新（contribution 7）。作者 Anima OS 单人，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent", "方向:推理框架", "方向:调度服务", "硬件:CPU"], "insight_person": "", "wiki_url": "", "authors": "Daeyeon Son", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04224", "run_id": "run-20260709-165925", "title": "AI-RAN on NPUs: Baseband Processing Without Baseband Chips", "abstract": "首次证明 NPU 可承担无线基带处理，在 Ascend 310B1 边缘 NPU 上实现完整 OFDM 收发。", "effects": "在 Ascend 310B1 边缘 NPU 上跑通完整 OFDM 收发，经 USRP X300 在 3.0GHz 实现端到端 over-the-air 传输。", "mechanism": "发现矩阵/向量引擎与物理层操作的计算同构；重构通信算法到 AI 计算原语，优先引擎利用率而非算术运算数，弥合基带与 NPU 架构失配。", "paper_url": "https://arxiv.org/abs/2607.04224", "date": "2026-07-05", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确边缘 NPU 承担基带处理，AI-RAN 新范式（relevance 9）。计算同构+利用率优先重构有高创新（contribution 7）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "硬件:NPU"], "insight_person": "", "wiki_url": "", "authors": "Shilong Zhang; Luping Xiang; Jienan Chen; Kun Yang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04302", "run_id": "run-20260709-165925", "title": "HiFA4: Training-Free 4-bit FlashAttention on Ascend HIF4 NPUs for LLM Inference", "abstract": "在华为昇腾 HIF4 NPU 上把 FlashAttention 的 QK^T 和 PV 都跑成 4 位 Cube GEMM，softmax 状态保 FP16，免训练。", "effects": "Qwen3-8B 上恢复 37.5% 直接量化精度损失，MMLU 准确率损失从 1.12pp 降到 0.70pp，不一致预测从 16.3% 降到 8.2%；预计关键路径延迟降 35.4%。", "mechanism": "Smooth-QK 做 RoPE 后等价重标定把量化难度从 K 转 Q；P-Reordering 让 softmax 归一化与 PV GEMM 共用量化权重，融合进 Cube GEMM。", "paper_url": "https://arxiv.org/abs/2607.04302", "date": "2026-07-05", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "昇腾 NPU 4 位注意力算子级设计，明确端侧硬件（relevance 9）。Smooth-QK+P-Reordering 算子级创新（contribution 7）。作者含华为相关，但 arXiv 元数据未明确机构，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效注意力", "方向:KV cache", "硬件:NPU", "硬件:Ascend", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Hui Dong, Yanzhao Li, Jie Gao, Chunlu Li, Zhiyuan Zhang, Yupeng Sun, Zhenyuan Chen, Zhiqiang Zou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03803", "run_id": "run-20260709-165925", "title": "CineMobile: On-Device Image-to-Video Diffusion for Cinematic Camera Motion Generation", "abstract": "在手机上做图像到视频扩散生成的框架，通过蒸馏引导剪枝+扩散蒸馏+混合量化把模型压到 1GB 内。", "effects": "相对 Wan 2.1 教师模型加速 40 倍；在 MediaTek Dimensity 8400 上 49 帧 480p 视频每步去噪 20s，峰值内存 1.8GB。", "mechanism": "三步：蒸馏引导剪枝得紧凑模型；扩散蒸馏+RL 优化成 4 步生成器；混合后训练量化把模型压到 1GB 内。", "paper_url": "https://arxiv.org/abs/2607.03803", "date": "2026-07-04", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确手机端图像到视频扩散部署（relevance 9）。剪枝+蒸馏+量化三合一移动端管线有高创新（contribution 7）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "方向:蒸馏", "方向:剪枝稀疏", "方向:量化", "方向:多模态", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Xuyao Huang; Zelai Deng; Xu Wang; Xizhong Xiao; Zhijie Deng", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03333", "run_id": "run-20260709-165925", "title": "SPORK: Self-Speculative Forking to Accelerate Agentic LLM Inference", "abstract": "LLM agent 的思考-行动-观察循环中 GPU 等工具返回常占 16-37% 墙钟时间；SPORK 让模型当自己的预测器，提前 fork 出工具名预测并行执行。", "effects": "Qwen3-32B 上工具名预测准确率 74.6-99.6%；GAIA P95 降 18%（131.9→108.1s）；覆盖 4B-32B dense 和 MoE 模型；准确率 1pp 内。", "mechanism": "生成起始 fork 探针预测工具名，prefix-cache fork 降成本，置信度门控过滤误测，部分 token 接受把拒测变投机解码草稿；拒绝则回退串行无正确性损失。", "paper_url": "https://arxiv.org/abs/2607.03333", "date": "2026-07-03", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "agent 推理加速，工具调用并行隐藏等待，可迁移端侧 agent（relevance 8）。模型自预测+prefix-cache fork+部分 token 接受免训练创新（contribution 8）。作者清华，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:投机解码", "方向:工具调用", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Huajun Bai, Weiwei Lv, Huichuan Zheng, Youyou Lu, Jiwu Shu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07386", "run_id": "run-20260709-165925", "title": "Sparse Delta Memory: Scaling the State of Linear RNNs through Sparsity", "abstract": "用稀疏寻址方案把门控线性 RNN 的隐状态扩展到高容量，稀疏读写大显式记忆，提升长上下文召回。", "effects": "isoFLOP 约束下同等参数量，更高状态容量显著提升上下文学习和长上下文检索；学初始状态做参数记忆进一步提升常识/推理。", "mechanism": "扩展 Gated DeltaNet，把密集 KV 外积换成对大显式记忆的稀疏读写；学初始状态做参数记忆。", "paper_url": "https://arxiv.org/abs/2607.07386", "date": "2026-07-08", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "线性 RNN 稀疏记忆扩展属高效推理技术栈（relevance 7）。稀疏寻址扩状态+参数化初始记忆有架构创新（contribution 8）。作者含 Gabriel Synnaeve/Hervé Jégou (Meta FAIR)，但标学校预印本（Meta arxiv 论文非官方博客）。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:稀疏注意力", "方向:模型架构", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Loïc Cabannes, Pierre-Emmanuel Mazaré, Gergely Szilvasy, Matthijs Douze, Maria Lomeli, Ilze Amanda Auzina, Justin Carpentier, Gabriel Synnaeve, Hervé Jégou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07388", "run_id": "run-20260709-165925", "title": "TF-Engram: A Train-Free Engram with SSD-Backed Memory for Large Language Models", "abstract": "给小模型外挂一个免训练的短语级语义记忆，存在 GPU-DRAM-SSD 三级存储里，让 0.6B 模型也能用到大规模外部知识。", "effects": "Qwen3-0.6B 下游平均分从 57.6 升到 59.4，超过参数量匹配的 LoRA 基线；SSD 存储大幅降低 GPU 显存占用，预测预取找回大部分吞吐。", "mechanism": "离线从语料构造短语级语义记忆表，跨 GPU-DRAM-SSD 层级存储，用 Early-Exit 引导的预测预取在自回归解码时隐藏外部访存延迟。", "paper_url": "https://arxiv.org/abs/2607.07388", "date": "2026-07-08", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "Qwen3-0.6B 小模型+SSD 三级记忆，端侧小模型可迁移（relevance 8）。免训练 engram+预测预取系统设计有创新（contribution 7）。作者 Zili Shao (CUHK-Shenzhen)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:高效推理", "方向:编译部署", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Yutang Ma, Kecheng Huang, Xikun Jiang, Zili Shao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05933", "run_id": "run-20260709-165925", "title": "Energy-Efficient GPU DVFS for Fine-Tuning of SLMs on Resource-constrained Embedded Devices", "abstract": "针对资源受限嵌入式 GPU 上的小语言模型微调，用动态电压频率调度省电，让本地个性化训练更节能。", "effects": "NVIDIA Jetson AGX Orin 上平均节能 13.11%（最高 26.73%），对 BERT/Pythia 等 SLM 在 GLUE 上表征了微调行为。", "mechanism": "先刻画 encoder-only 与 decoder-only SLM 的微调能耗行为，再用简单 ML 模型按工况选择能耗最优的 GPU DVFS 设置。", "paper_url": "https://arxiv.org/abs/2607.05933", "date": "2026-07-07", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "Jetson AGX Orin 上 SLM 微调能耗优化，明确端侧训练（relevance 9）。DVFS 调度用于 SLM 微调是工程创新但方法较朴素（contribution 6）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧训练", "方向:能耗功耗", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Jurn-Gyu Park, Sanzhar Zholdybayev, Aidar Amangeldi, Ademi Zhanuzakova", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06724", "run_id": "run-20260709-165925", "title": "EvoPlan: Evolutionary Neuro-Symbolic Robot Planning with Spatio-Temporal Guarantees", "abstract": "神经符号机器人规划框架，全部 LLM 调用用本地开源模型，可在机器人上无云部署并给出时空安全保证。", "effects": "在 ALFWorld Text 上击败强基线，在 Bench2Drive 与 HA-VLN-CE 上用挖掘出的 STL 约束屏蔽策略。", "mechanism": "三部分：从演示数据挖掘全局 Signal Temporal Logic 约束（反事实扰动+进化搜索）；进化 PDDL 规划器（LLM 提议+修复+验证器筛选）；约束执行循环（航点编译+约束检查+违规重规划）。", "paper_url": "https://arxiv.org/abs/2607.06724", "date": "2026-07-07", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 on-robot 本地模型无云依赖（relevance 9）。神经符号+STL 挖掘+进化 PDDL 有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:机器人", "方向:规划推理", "方向:安全隐私"], "insight_person": "", "wiki_url": "", "authors": "Bhavya Sai Nukapotula; Samin Moosavi; Haoze Wang; Luke Duncan; Diya Shakkottai; Varun Murali; Srinivas Shakkottai", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05711", "run_id": "run-20260709-165925", "title": "FourTune: Towards Fully 4-Bit Efficient Post-Training for Diffusion Models", "abstract": "给扩散模型做端到端 W4A4G4 后训练框架，三支路混合管线在 LoRA 上加冻结数值稳定器隔离量化敏感异常值。", "effects": "FLUX.1-dev 12B 上内存开销降 2.25 倍，端到端训练吞吐升 2.27 倍；定制化/RL/蒸馏任务匹配全精度微调质量。", "mechanism": "三支路混合管线（LoRA+冻结数值稳定器）；硬件高效块级量化+定制融合内核支持量化反传播降内存带宽；原生 4 位计算。", "paper_url": "https://arxiv.org/abs/2607.05711", "date": "2026-07-07", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "4 位扩散模型后训练，端侧可迁移效率（relevance 7）。W4A4G4+三支路稳定器+融合内核有创新（contribution 8）。作者含 Song Han (MIT)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "方向:蒸馏", "方向:多模态"], "insight_person": "", "wiki_url": "", "authors": "Bowen Xue, Zihan Min, Xingyang Li, Zhekai Zhang, Haocheng Xi, Lvmin Zhang, Maneesh Agrawala, Jun-Yan Zhu, Song Han, Yujun Lin, Muyang Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06370", "run_id": "run-20260709-165925", "title": "Training-Free Acceleration for Vision-Language-Action Models with Action Caching and Refinement", "abstract": "给 VLA 模型的迭代去噪动作头加一个即插即用外部缓存，复用过去中间动作热启动生成，大幅降推理延迟。", "effects": "π_0.5 加速 11.75 倍、GR00T-N1.6 加速 34.43 倍，仿真和真机均保高成功率。", "mechanism": "ActionCache 用紧凑多模态键存中间动作，跨 episode/任务检索相似过去上下文热启动生成。", "paper_url": "https://arxiv.org/abs/2607.06370", "date": "2026-07-07", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "VLA 实时部署加速，可迁移端侧机器人（relevance 7）。动作缓存跨 episode 检索热启动免训练创新（contribution 8）。作者东京大学，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "方向:多模态", "方向:推理框架", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Ryuji Oi, Hikari Otsuka, Kosuke Matsushima, Yuki Ichikawa, Masato Motomura, Tatsuya Kaneko, Daichi Fujiki", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06601", "run_id": "run-20260709-165925", "title": "TriRoute: Unified Learned Routing for Joint Adaptive Attention, Experts, and KV-Cache Allocation", "abstract": "一个轻量控制器同时决定每个 token 每层的注意力模式（跳/局部/全）、MoE 专家选择和 KV 缓存位宽，联合优化。", "effects": "160M-1.3B 模型上 Pareto 优于独立 MoD+MoE+KV 量化组合，同等推理 FLOPs 和内存下更好保尾例鲁棒性；控制器给句首/罕见子词/命名实体分配全注意力和高精度缓存。", "mechanism": "单一控制器端到端训练，异构松弛（Gumbel-Softmax+STE 做分类决策，负载均衡 top-k 门控做专家），拉格朗日预算约束把平均计算和内存变可调旋钮；识别路由塌陷级联并用逐轴归一化+耦合感知平衡损失解决。", "paper_url": "https://arxiv.org/abs/2607.06601", "date": "2026-07-07", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "联合注意力+MoE+KV 缓存路由属推理效率技术栈（relevance 7）。三轴联合路由+塌陷级联分析有创新（contribution 8）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:KV cache", "方向:高效推理", "方向:稀疏注意力"], "insight_person": "", "wiki_url": "", "authors": "Andrii Balashov, Olena Ponomarova", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05590", "run_id": "run-20260709-165925", "title": "DBNN: Neural Spike Classification Using a Deep Binarized Neural Network", "abstract": "给植入式脑机接口做片上尖峰分类，用深度二值化 NN 实现无乘法推理。", "effects": "98.7% 分类准确率；FPGA 原型 0.01ms 延迟/828 ALM/0 DSP；ASIC 综合 0.014mm²/122nW@20kHz。", "mechanism": "两层二值化隐藏层（256 神经元）+定点输出层，推理由符号控制累加和位逻辑主导，16 样本紧凑波形输入。", "paper_url": "https://arxiv.org/abs/2607.05590", "date": "2026-07-06", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "植入式 BCI 片上二值化 NN，超低功耗端侧（relevance 9）。无乘法二值化+FPGA+ASIC 全流程有工程创新（contribution 6）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "硬件:MCU", "应用:fault-detection"], "insight_person": "", "wiki_url": "", "authors": "Binyi Ren, Luca M. Meyer, Majid Zamani", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05241", "run_id": "run-20260709-165925", "title": "GelNeuro: A Sensing-Computing Integrated Neuromorphic Tactile System for Texture Recognition", "abstract": "全集成感算一体的神经形态触觉系统，把光学触觉前端与 Speck2f 神经形态芯片直连做纹理识别。", "effects": "15 类纹理识别硬件在环 80ms 内达 96.3% 准确率，板级功耗仅 19.6mW，比常规 CPU/GPU 基线低三个数量级。", "mechanism": "GelSight Mini 光学触实用 DVS 事件驱动，经片上网络送 SCNN 分类；引入硬件感知权重钳制缓解 8bit 部署精度退化。", "paper_url": "https://arxiv.org/abs/2607.05241", "date": "2026-07-06", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确端侧神经形态 SoC 全集成，功耗三个数量级降低（relevance 9）。感算一体直连芯片+硬件感知权重钳制有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Luoyang Bian; Xinpan Meng; Zhenghua Ma; Houcheng Li; Long Cheng", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05061", "run_id": "run-20260709-165925", "title": "KVpop -- Key-Value Cache Compression with Predictive Online Pruning", "abstract": "学会一个 KV 缓存淘汰策略，直接用未来注意力信号监督保留/丢弃决策，大幅压缩 KV 缓存且不掉精度。", "effects": "Qwen3-4B 在 75% 压缩下保留 98% 全注意力性能，88% 压缩下 97%；Qwen3-8B 接近满分教师性能。", "mechanism": "训练一个打分器，用高效计算的未实体化注意力目标直接监督 keep-or-drop，并引入延迟记忆打分利用近未来上下文。", "paper_url": "https://arxiv.org/abs/2607.05061", "date": "2026-07-06", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "KV 缓存压缩属端侧推理技术栈，可迁移（relevance 7）。未来注意力监督+延迟记忆打分有创新（contribution 8）。作者含 Sepp Hochreiter (JKU Linz)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Lukas Hauzenberger, Niklas Schmidinger, Anamaria-Roberta Hartl, David Stap, Thomas Schmied, Sebastian Böck, Günter Klambauer, Sepp Hochreiter", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05511", "run_id": "run-20260709-165925", "title": "Light-Omni: Reflex over Reasoning in Agentic Video Understanding with Long-Term Memory", "abstract": "把视频 agent 的迭代式侦探推理换成单次前向的反射式响应，用全局多模态脚本和参数化隐状态直接驱动动作与检索。", "effects": "比 M3-Agent 平均准确率高 2.4%，速度快 12.1 倍，GPU 显存效率提升 2.6 倍；可作记忆系统增强现有 MLLM。", "mechanism": "双上下文状态：全局状态为有限多模态脚本持续合并情节记忆保近略远；条件生成参数化隐状态直接驱动动作产出检索嵌入，避免迭代推理。", "paper_url": "https://arxiv.org/abs/2607.05511", "date": "2026-07-06", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "高效视频 agent，12.1 倍加速+显存优化可迁移端侧（relevance 7）。反射式替代迭代推理+双上下文状态有创新（contribution 8）。作者机构未明确标注，vendors 空，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:多模态", "方向:高效推理", "方向:规划推理"], "insight_person": "", "wiki_url": "", "authors": "Chang Nie, Jiaju Wei, Junlan Feng, Chaoyou Fu, Caifeng Shan", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03876", "run_id": "run-20260709-165925", "title": "AdaptiveSD A Stability-Aware, Runtime-Adaptive Speculative Decoding Framework with Multi-Policy Orchestration for CPU-Constrained LLM Inference", "abstract": "面向纯 CPU 约束的 on-device 量化 GGUF 模型推理的运行时自适应投机解码框架。", "effects": "未报告量化结果（以浪费算力、token 间延迟离散等指标评估，未给单一加速比）。", "mechanism": "四组件反馈环：运行时监控引擎、十一规则优先级自适应草稿控制器、动态策略引擎（启发式+RL）、带 INT8 影子缓冲与位置感知驱逐的 KV cache 协调层。", "paper_url": "https://arxiv.org/abs/2607.03876", "date": "2026-07-04", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 on-device CPU 量化 GGUF 推理（relevance 9）。运行时多策略自适应+资源优先于草稿量有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码", "方向:高效推理", "方向:KV cache", "硬件:CPU"], "insight_person": "", "wiki_url": "", "authors": "Sadra Saremi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05445", "run_id": "run-20260709-165925", "title": "BitFair: A 12nm Bit-Serial CNN Accelerator with Learnable Early Termination and Adaptive Bit Ordering for Ultra-Low-Power XR Vision", "abstract": "给 XR 可穿戴设备做超低功耗位串行 CNN 加速器，学到的阈值在部分和可靠预测 ReLU 输出为零时提前终止。", "effects": "12nm 实现 0.34mm² 核/104KB 片上内存/0.55-0.70V，亚毫秒延迟，117.0 BTOPS/W，比先前 XR 加速器能效高 4-22.1 倍。", "mechanism": "可学比特级提前终止+自适应位序优先信息位；位串行计算利用 ReLU 动态稀疏，最大早终止不损精度。", "paper_url": "https://arxiv.org/abs/2607.05445", "date": "2026-07-04", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "XR 可穿戴超低功耗 CNN 加速器，明确端侧（relevance 9）。可学比特级早终止+自适应位序有架构创新（contribution 6）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:剪枝稀疏", "方向:高效推理", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Ang Li, Chang Gao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.02980", "run_id": "run-20260709-165925", "title": "Hierarchical Sparse Attention Done Right: Toward Infinite Context Modeling", "abstract": "提出 HiLS 分层稀疏注意力，让 chunk 选择在 LM 损失下端到端学习，性能追平全注意力且能外推到训练上下文 64 倍以上。", "effects": "域内上下文长度上性能可比甚至优于全注意力；外推超训练长度 64 倍时检索准确率 90%；全注意力模型可轻量继续预训练转换。", "mechanism": "每个 query 独立与每个检索到的 chunk 做注意力提取 chunk 信息，再按检索分数融合输出，把检索分数纳入前向计算使其在 LM 损失下端到端优化。", "paper_url": "https://arxiv.org/abs/2607.02980", "date": "2026-07-03", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "稀疏注意力+长上下文外推属端侧推理技术栈（relevance 7）。端到端学习 chunk 选择+原生稀疏训练有创新（contribution 8）。作者含 Yushi Bai/Kewei Tu (SUSTech)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:稀疏注意力", "方向:高效注意力", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xiang Hu, Xinyu Wei, Hao Gu, Minshen Zhang, Tian Liang, Huayang Li, Lei Zhu, Yan Wang, Sirui Han, Yushi Bai, Kewei Tu, Haitao Mi, Leo Liang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03213", "run_id": "run-20260709-165925", "title": "OpenGlass: A Sensing-Computing Split Architecture for Local MLLM-Driven Real-Time Visual Assistance", "abstract": "开源、隐私优先、local-first 的低延迟多模态视觉辅助系统，用感算分离架构在本地跑 MLLM。", "effects": "真实 ESP32 Wi-Fi 下中位 user-to-audio 延迟 993ms（resize 负载）/1625ms（原始 1280x720）；97.5%/93.3% 试验低于 2s。", "mechanism": "ESP32 眼镜端采集视觉上下文，附近消费级设备做本地 MLLM 推理与本地语音输出，默认把原始第一视角视觉留在用户设备。", "paper_url": "https://arxiv.org/abs/2607.03213", "date": "2026-07-03", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 local MLLM + ESP32 感算分离（relevance 9）。开源感算分离架构有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent", "方向:多模态", "方向:端云协同", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Mengzhang Li; Yuan Yao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03089", "run_id": "run-20260709-165925", "title": "STELLA: Efficient Sensor-to-LLM Translation for On-Device Human Activity Recognition", "abstract": "面向 on-device HAR 的 sensor-to-LLM 高效翻译框架，把传感器窗口压成紧凑潜 token 喂给冻结 LLM。", "effects": "七个 HAR 数据集八种设置上达新 SOTA，F1 最多提升 11.83；on-device 个性化再提升最多 21.91% F1，并在移动/边缘预算下实时推理。", "mechanism": "轻量层级 tokenizer 把多通道惯性窗口压成固定潜 token，投影到冻结预训练 LLM 嵌入空间配自然语言 prompt 评分；支持只微调 tokenizer 的端侧个性化与本地检索。", "paper_url": "https://arxiv.org/abs/2607.03089", "date": "2026-07-03", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 on-device HAR + LLM（relevance 9）。sensor tokenizer 把负担从 LLM 适配转到传感器 token 化有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:高效推理", "应用:IoT命令"], "insight_person": "", "wiki_url": "", "authors": "Nirhoshan Sivaroopan; Albert Zomaya; Kanchana Thilakarathna", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07033", "run_id": "run-20260709-165925", "title": "AnchorPrune: Relevance-Anchored Contextual Expansion for Visual Token Pruning", "abstract": "一种免训练的视觉 token 剪枝框架，在 VLM 推理中按查询相关性保留关键 token 再扩展补充上下文。", "effects": "在 LLaVA-NeXT-7B 上仅用 2880 个视觉 token 中的 160 个即可保留 97.6% 全 token 性能。", "mechanism": "先构造受保护的相关锚点，按新颖度剖面自适应确定锚点大小，剩余预算用重要性加权新颖度扩展非冗余上下文，避免关键查询证据被覆盖。", "paper_url": "https://arxiv.org/abs/2607.07033", "date": "2026-07-08", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "视觉 token 剪枝用于 VLM 高效推理，训练-free 即插即用（relevance 8）。相关锚点+上下文扩展有新意（contribution 6）。作者机构未明确，vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:多模态", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Kyuan Oh; Bumsoo Kim", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07026", "run_id": "run-20260709-165925", "title": "Constrained Decoding for Diffusion Language Models via Efficient Inference over Finite Automata", "abstract": "给扩散语言模型的约束解码做精确高效算法，任意有限自动机表达的约束都能在均值场后验下采样。", "effects": "Dream-7B/LLaDA-8B 上函数调用/规划/SQL/数学大幅提升（BFCL 63.9→71.5%），墙钟开销<5%。", "mechanism": "把有限自动机当图模型获约束分布的可处理表示，深度约简从线性降到对数级，兼容并行/块解码。", "paper_url": "https://arxiv.org/abs/2607.07026", "date": "2026-07-08", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "扩散 LLM 约束解码效率，可迁移端侧工具调用（relevance 6）。有限自动机均值场后验+对数深度约简有创新（contribution 8）。作者含 Stefano Ermon (Stanford)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:高效推理", "方向:规划推理"], "insight_person": "", "wiki_url": "", "authors": "Meihua Dang, Stefano Ermon", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07409", "run_id": "run-20260709-165925", "title": "DeLS-Spec: Decoupled Long-Short Contexts for Parallel Speculative Drafting", "abstract": "给块并行投机解码的 DFlash 加一个轻量短上下文头，引入块内因果依赖，无需从头训练草稿模型。", "effects": "Qwen3 上在数学/代码/对话基准上一致提升加速比与平均接受长度，超越 DFlash，训练成本极低。", "mechanism": "把固定 DFlash 当长上下文专家，引入可独立训练的局部短上下文头，推理时融合长短上下文 logits，局部头不绑定特定 DFlash 检查点。", "paper_url": "https://arxiv.org/abs/2607.07409", "date": "2026-07-08", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "投机解码属端侧推理加速技术栈（relevance 7）。解耦长短上下文+免联合训练的模块化设计有创新（contribution 7）。作者 Hong-Kai Li (PKU)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Hong-Kai Zheng, Piji Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07373", "run_id": "run-20260709-165925", "title": "Dynamic neural manifolds for flexible closed-loop control on neuromorphic hardware", "abstract": "在 SpiNNaker 2 神经形态芯片上实现动态神经流形，用于实时闭环控制。", "effects": "在机器人迷宫导航仿真中验证动态流形可随感官反馈重构以切换行为并细粒度控制轨迹。", "mechanism": "让感官输入调节异质抑制、增益与瞬态电流，驱动子空间旋转切换行为，并在流形内做细粒度轨迹控制。", "paper_url": "https://arxiv.org/abs/2607.07373", "date": "2026-07-08", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "神经形态芯片 SpiNNaker2 实时闭环控制，明确端侧硬件（relevance 8）。动态流形参数化用于神经形态工程有新意（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Oskar von Seeler; Christian Tetzlaff; Andrew Lehr", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07144", "run_id": "run-20260709-165925", "title": "Fractal KV-Cache Archives: Lossless Symbolic Storage with In-Place Retrieval for Long-Context LLM Inference", "abstract": "把量化后的 KV 缓存符号流用收缩迭代映射码序列化成低维实向量，既无损存储又自带检索索引。", "effects": "GPT-2 1024 上下文下，残差向量量化让归档缓存压缩 36-54 倍，困惑度代价 11-15%；存储层可直接做近似子串查询，O(1) 随机访问与摊还追加。", "mechanism": "重新审视收缩迭代映射码作为量化 KV 缓存归档格式，线性时间序列化，配合每头残差向量量化与 key/value 不对称位分配。", "paper_url": "https://arxiv.org/abs/2607.07144", "date": "2026-07-08", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "KV 缓存压缩+存储层创新，端侧长上下文可迁移（relevance 7）。分形归档格式兼具无损存储与检索索引是新视角（contribution 7）。单作者学校项目，笔记本 CPU 可复现。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:KV cache", "方向:高效推理", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Vladimir Gusev", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06924", "run_id": "run-20260709-165925", "title": "Intrinsic-Noise Consolidation: A Doob-Barrier-Conditioned Diffusion Turns Analog Device Noise into a Continual-Learning Resource", "abstract": "在模拟神经形态硬件上把器件固有噪声变成持续学习资源，用 Doob 屏障条件化扩散让噪声帮助记忆巩固。", "effects": "Split-MNIST 上保留率提升 10.9 分（p=0.004）；BrainScaleS-2 硅片上保留前任务高 15.6 分；噪声与保留呈倒 U 型。", "mechanism": "把每突触巩固建模为 Doob h-变换：条件化权重随机动力学使其不穿越记忆关键屏障，条件化扩散获额外恢复漂移。", "paper_url": "https://arxiv.org/abs/2607.06924", "date": "2026-07-08", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "模拟神经形态硬件持续学习，端侧硬件（relevance 8）。Doob 屏障条件化做突触规则有理论创新（contribution 6）。作者单人，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧训练", "方向:记忆", "方向:测试时自适应"], "insight_person": "", "wiki_url": "", "authors": "Gunner Levi Howe", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06456", "run_id": "run-20260709-165925", "title": "A Hardware-Aware Open-Source Framework for Design Space Exploration of Mixed-Signal Spiking Neural Networks", "abstract": "开源硬件感知仿真框架，把混合信号 SNN 硬件的器件级非线性直接纳入 PyTorch 训练推理。", "effects": "N-MNIST/DVS Gesture/SHD 上报告分类精度+硅面积/功耗/量化敏感度，支撑跨层设计空间探索。", "mechanism": "支持 LIF/HH/AH 神经元模型+浮栅晶体管/ReRAM 模拟突触；器件非线性纳入训练推理，优化物理突触参数而非理想权重。", "paper_url": "https://arxiv.org/abs/2607.06456", "date": "2026-07-07", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "边缘神经形态计算硬件感知框架，明确端侧（relevance 8）。器件非线性纳入训练+跨层探索开源工具有创新（contribution 6）。作者学校项目，开源。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:编译部署", "方向:量化", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Sayma Nowshin Chowdhury, Vineeta Nair, Taseen Forhad, Aishwarya Natarajan, Corey Hart, Sahil Shah", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05756", "run_id": "run-20260709-165925", "title": "Boosting FPGA Performance with Direct BRAM-DSP Paths", "abstract": "在 FPGA 架构中加 BRAM 到 DSP 的专用直连通道，数据不经全局互连，降线长和关键路径延迟。", "effects": "Agilex-10-like FPGA 上 DL 层设计 Fmax +25%、线长 -49%，面积/延迟开销可忽略，非 DL 基准无影响。", "mechanism": "轻量架构增强引入 BRAM-DSP 直连；增强布局算法识别 BRAM-DSP 宏块；与基线架构 CAD 兼容。", "paper_url": "https://arxiv.org/abs/2607.05756", "date": "2026-07-07", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "FPGA DL 加速器架构增强，明确端侧硬件（relevance 8）。BRAM-DSP 直连+宏块布局有架构创新（contribution 6）。作者 Notre Dame，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Jiajun Hu, Ruthwik Reddy Sunketa, Andrew Boutros, Aman Arora", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06631", "run_id": "run-20260709-165925", "title": "Dynamic-in-Few-Step: Unifying Dynamic Computation and Few-Step Distillation for Efficient Video Generation", "abstract": "把动态结构稀疏化直接集成进少步蒸馏，把视频扩散模型变成步级混合模型（MoM），按噪声级别动态裁结构。", "effects": "Wan-14B 上在 4 步蒸馏基础上再去 24% 每 step FLOPs，墙钟再快 1.2 倍，比 50 步教师共 30 倍加速。", "mechanism": "联合优化去噪步和结构稀疏性，渐进训练+输出去滚保证跨步结构决策一致性；专用推理引擎部署 MoM。", "paper_url": "https://arxiv.org/abs/2607.06631", "date": "2026-07-07", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "视频扩散加速，非显式端侧但效率技术可参考（relevance 6）。动态稀疏+少步蒸馏联合优化有创新（contribution 8）。作者含 Fajie Yuan，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:剪枝稀疏", "方向:高效推理", "应用:视频"], "insight_person": "", "wiki_url": "", "authors": "Yu Cheng, Siyue Yao, Zhongang Qi, Shanyan Guan, Wei Li, Fajie Yuan", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06600", "run_id": "run-20260709-165925", "title": "MiLSD: A Micro Line-Segment Detector for Resource-Constrained Devices", "abstract": "给 MCU 级资源约束做亚兆字节线段检测器，系统比较三种输出表示，找到最优的 F-Clip 中心+长度+角度表示。", "effects": "1MB 激活预算下 sAP10 从 10.6（25k 参数/0.25MB）提升到 24.1；8 位量化保全精度性能，4 位显著退化。", "mechanism": "紧凑全卷积骨干+F-Clip 表示；8/4 位量化分析；亚像素解码/测试时增强/轻量验证器后处理。", "paper_url": "https://arxiv.org/abs/2607.06600", "date": "2026-07-07", "score": 14, "score_relevance": 9, "score_contribution": 5, "score_reason": "MCU 级亚兆字节视觉检测器，明确端侧（relevance 9）。MCU 预算下表示/位宽/容量系统权衡有工程价值（contribution 5）。作者 Sharif UT，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "硬件:MCU", "应用:OCR"], "insight_person": "", "wiki_url": "", "authors": "Parsa Hassani Shariat Panahi, Amir Hossein Jalilvand, M. Hassan Najafi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05804", "run_id": "run-20260709-165925", "title": "TurnOPD: Making On-Policy Distillation Turn-Aware for Efficient Long-Horizon Agent Training", "abstract": "给长程 agent 的在策略蒸馏做 turn 级预算控制，避免尾部 turn 浪费算力和浅 token 主导损失的两大低效。", "effects": "ALFWorld/WebShop/多跳搜索上等_wall-clock 预算下验证准确率优于 vanilla OPD，推进精度-时间前沿。", "mechanism": "两个预算控制器：自适应 rollout 深度预算用探针 turn 统计定长；渐进 turn 归一化损失预算把 KL 权重从 token 级逐步转到 turn 均衡监督。", "paper_url": "https://arxiv.org/abs/2607.05804", "date": "2026-07-07", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "agent 蒸馏训练效率，可迁移端侧小 agent 训练（relevance 6）。turn 级预算控制针对长程 agent OPD 痛点有创新（contribution 8）。作者机构未明确标注，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:工具调用", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yuhang Zhou, Kai Zheng, Haoling Li, Dengyun Peng, Can Xu, Jingjing Chen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06114", "run_id": "run-20260709-165925", "title": "x-Prediction Is All You Need: Training-Free Accelerated Generation via Endpoint Decodability", "abstract": "发现扩散/流匹配采样中途的中间状态和路径速度可直接估计干净样本，据此提前截断 ODE 返回解码的 x_0。", "effects": "SDXL/SD3.5M/Z-Image-Turbo 上 NFE 降 20-70%，质量近持平；免重训/蒸馏/改架构。", "mechanism": "形式化为端点可解码性，证明解码器是 L2 目标下最小 MSE 估计；截断跳跃采样（TJS）在早退时间停止 ODE 返回解码 x_0。", "paper_url": "https://arxiv.org/abs/2607.06114", "date": "2026-07-07", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "免训练扩散加速，端侧可迁移效率（relevance 6）。端点可解码性理论+TJS 免训加速有创新（contribution 8）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "方向:多模态"], "insight_person": "", "wiki_url": "", "authors": "Xin Peng, Ang Gao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05116", "run_id": "run-20260709-165925", "title": "Communication-Aware Placement and Pruning for Efficient Mixture-of-Experts Inference", "abstract": "MoE 推理的专家放置和剪枝应同时考虑计算、通信和精度，CAP 框架把三者联合优化。", "effects": "单节点和多节点实验中比 DeepSeek EPLB 和 vLLM 顺序放置吞吐提升 1.23-1.86 倍，同等目标加速下精度更好。", "mechanism": "共激活驱动专家放置减少跨设备/节点通信；计算-通信权衡调整生成不同放置；通信感知专家剪枝选择移除路由目标降通信。", "paper_url": "https://arxiv.org/abs/2607.05116", "date": "2026-07-06", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "MoE 分布式推理效率，云端为主但技术可参考（relevance 6）。通信-计算-精度联合优化放置+剪枝有创新（contribution 8）。作者中山大学，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:剪枝稀疏", "方向:云端serving", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Xiao Shi, Yingying Sun, Jiangsu Du, Zhiguang Chen, Yutong Lu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04605", "run_id": "run-20260709-165925", "title": "Do All Visual Tokens Matter Equally? Object-Evidence Preserving Token Merging for Vision-Language Retrieval", "abstract": "把多向量视觉检索的图像侧 token 压成 K 个代表质心，同时保留物体级证据供未来查询选中。", "effects": "K=64 时去掉 93% 以上图像 token，ColPali 存储降 16.09 倍，Flickr30K/MSCOCO R@1 反升；短语级定位更强。", "mechanism": "训练时用物体标注做合并先验阻止跨实例混合，推理无需检测器；仅调共享投影层，视觉/语言骨干冻结。", "paper_url": "https://arxiv.org/abs/2607.04605", "date": "2026-07-06", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "视觉 token 压缩+存储降低可迁移端侧 VLM 检索（relevance 7）。物体感知合并非剪枝/特征池化有创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "方向:多模态", "方向:稀疏注意力"], "insight_person": "", "wiki_url": "", "authors": "Suhyeong Park, Junha Jung, Jungwoo Park, Jaewoo Kang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05240", "run_id": "run-20260709-165925", "title": "Optimizing ML Workload Partitioning between CPUs and CIM Accelerators for Heterogeneous Computing", "abstract": "在 CPU 和存内计算（CIM）加速器间用 ILP 做工作负载划分，考虑 RRAM 约束和并行性，最小化端到端推理延迟。", "effects": "异构 CPU-CIM 执行比仅 CPU（边缘 CPU）快 30.9 倍，比高性能 CPU 快 7.3 倍。", "mechanism": "ILP 划分框架最小化推理延迟，纳入 RRAM 有限内存/高写延迟/有限寿命约束，结合经验剖析与解析模型，捕捉并行性和低层架构效应。", "paper_url": "https://arxiv.org/abs/2607.05240", "date": "2026-07-06", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "边缘 CPU+CIM 异构加速，明确端侧硬件（relevance 8）。ILP 划分纳入 RRAM 约束有工程创新（contribution 6）。作者 RWTH Aachen，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:高效推理", "硬件:CPU"], "insight_person": "", "wiki_url": "", "authors": "Joel Klein, Rebecca Pelke, Roberto Laudani, Jan Moritz Joseph, Rainer Leupers", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04475", "run_id": "run-20260709-165925", "title": "A Reconfigurable and Representation-Adaptive ISA-Based Architecture for Efficient DNN Acceleration", "abstract": "提出面向 ML 的指令集架构+可重构硬件平台，兼顾高效与灵活，支持 3-8 位动态精度。", "effects": "22nm 实现 5.12-10.47 TOPS/W，比定点方案能效高 1.2 倍，精度不损；超越 SOTA 和混合精度加速器。", "mechanism": "ISA 细粒度控制数据移动/动态精度/解耦执行；轻量可编程核+SIMD 维持高 PE 利用率低控制开销；用残数系统（RNS）实例化支持 3-8 位动态精度。", "paper_url": "https://arxiv.org/abs/2607.04475", "date": "2026-07-05", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "可重构 DNN 加速器 ISA，明确端侧硬件（relevance 8）。ML 导向 ISA+RNS 动态精度有架构创新（contribution 6）。作者 Kuwait Univ，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:量化", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Vasilis Sakellariou, Vassilis Paliouras, Ioannis Kouretas, Hani Saleh, Thanos Stouraitis", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03191", "run_id": "run-20260709-165925", "title": "AIGOR: A Modular, Event-Driven Neuromorphic Architecture for Configurable SNN Inference", "abstract": "模块化事件驱动神经形态架构，用参数化 IP 块组装 SNN 推理核，神经元模型/精度/折叠/核划分可配置。", "effects": "AMD Versal VPK180 上前馈图像分类器复现 snnTorch 精度，循环网络跨双 FPGA 多核匹配 NEST 脉冲级精度；千核 3D torus 仿真验证。", "mechanism": "时间步同步处理核间用包交换通信层交换脉冲；单一声明式规格生成核/神经元内核/突触内存镜像。", "paper_url": "https://arxiv.org/abs/2607.03191", "date": "2026-07-03", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "神经形态 SNN 推理架构，端侧硬件（relevance 8）。模块化可配置 IP 块+多核包交换有架构创新（contribution 6）。作者 INFN，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:推理框架", "方向:编译部署", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Pierpaolo Perticaroli, Roberto Ammendola, Andrea Biagioni, et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.02893", "run_id": "run-20260709-165925", "title": "Variable Bit-width Quantization: Learning Per-Group Precision for \"Bigger-but-Smaller\" Language Models", "abstract": "训练时每 64 权重组自学 {1,2,4,8} 位精度的可变位宽量化方法，发现强异质分配。", "effects": "131M 模型 1.82 均位达 PPL 4.2（TinyStories）超 55M FP16；1.46B 在 FineWeb-Edu 用 3.7x 更少存储匹配 593M FP16；每字节质量比 FP16 高 3.9-8.4x；Apple silicon 上 9B 解码加速 4.7x。", "mechanism": "用 Gumbel-Softmax 松弛让每组自学精度，交替优化给精度 logits 干净任务对齐信号；学到的异质分配可冻结成固定 recipe 直接映射到打包低比特存储与 fused dequant-mul kernel。", "paper_url": "https://arxiv.org/abs/2607.02893", "date": "2026-07-03", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "量化属端侧技术栈且 Apple silicon 真机加速（relevance 7）。每组自学精度+异质 recipe 有高创新（contribution 7）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "硬件:Apple-Silicon"], "insight_person": "", "wiki_url": "", "authors": "Hamish Ogilvy", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.07643", "run_id": "run-20260709-165925", "title": "ATLAS: Automated HLS for DL-Optimized FPGAs", "abstract": "从高层 DL 模型描述到带定制硬块 FPGA 的全自动流程，无需手写 RTL，用 GEMM 作通用抽象层。", "effects": "11 个 DL 设计验证（FC/卷积/注意力层+完整 CNN/MLP/Transformer），覆盖 Catapult HLS+VTR 实现。", "mechanism": "hls4ml-GEMM 编译前端把 DL 层转架构无关 GEMM 调用的 HLS C；GEMM IP 生成器后端产带 tiling/控制 FSM/调度元数据的硬块 RTL wrapper。", "paper_url": "https://arxiv.org/abs/2607.07643", "date": "2026-07-08", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "FPGA DL 自动化编译流程含 Transformer，端侧硬件可迁移（relevance 7）。高层模型到硬块 RTL 全自动流程有工具链创新（contribution 6）。作者 Sunketa/Arora，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Ruthwik Reddy Sunketa, Aman Arora", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06982", "run_id": "run-20260709-165925", "title": "EdgeCompress: Coupling Multidimensional Model Compression and Dynamic Inference for EdgeAI", "abstract": "给边缘 CNN 做多维压缩：动态裁前景+协同缩深度宽度分辨率+级联多复杂度模型按难度动态选路。", "effects": "ImageNet-1K 上 ResNet-50 计算量降 48.8% 同时 top-1 准确率高 0.8%；同等计算下比 HRank 准确率高 4.1%。", "mechanism": "轻量前景预测器裁 informative 区域避冗余；复合缩放按对准确率/计算贡献协同压三维；动态推理级联多复杂度模型按输入难度选路。", "paper_url": "https://arxiv.org/abs/2607.06982", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "明确边缘部署 CNN 压缩，Jetson 等嵌入式（relevance 8）。多维压缩+动态推理是工程整合但 CNN 路线创新度中等（contribution 5）。作者 NTU，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:编译部署", "方向:高效推理", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Hao Kong, Di Liu, Shuo Huai, Xiangzhong Luo, Ravi Subramaniam, Christian Makaya, Qian Lin, Weichen Liu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06922", "run_id": "run-20260709-165925", "title": "Latency-Constrained DNN Architecture Learning for Edge Systems using Zerorized Batch Normalization", "abstract": "让神经网络在设计时就满足硬延迟约束，一次训练过程就学到符合边缘设备时延上限的模型。", "effects": "Jetson Nano 上 GoogLeNet 从 40.32ms 降到 34ms 仅掉 0.14%；TX2 上 VGG-19 从 119.98ms 压到 34ms 还高 0.5% 准确率。", "mechanism": "提出零化 BN 的延迟导向学习方法，配通用硬件定制延迟预测器，一次 shot 训练就学到满足时延约束的模型，配量化可进一步提升。", "paper_url": "https://arxiv.org/abs/2607.06922", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "Jetson Nano/TX2 硬延迟约束 DNN 设计，明确端侧（relevance 8）。硬件定制延迟预测器+一次训练有工程价值但创新度中等（contribution 5）。作者 NTU，开源 ZeroBN，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:编译部署", "方向:高效推理", "方向:量化", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Shuo Huai, Di Liu, Hao Kong, Weichen Liu, Ravi Subramaniam, Christian Makaya, Qian Lin", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06915", "run_id": "run-20260709-165925", "title": "Smart Scissor: Coupling Spatial Redundancy Reduction and CNN Compression for Embedded Hardware", "abstract": "给嵌入式硬件做 CNN 压缩：动态裁前景去空间冗余+协同缩深度宽度分辨率，统一框架。", "effects": "ImageNet-1K 上 ResNet50 计算量降 41.5% 同时 top-1 准确率高 0.3%；同等计算下比 HRank 高 4.1%。", "mechanism": "轻量前景预测器精细裁前景，小幅即可正确识别；复合缩放协同压三维；无缝结合成统一压缩框架。", "paper_url": "https://arxiv.org/abs/2607.06915", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "嵌入式硬件 CNN 压缩，明确端侧（relevance 8）。空间冗余+架构压缩联合是工程整合但 CNN 路线创新度中等（contribution 5）。作者 NTU，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:编译部署", "方向:高效推理", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Hao Kong, Di Liu, Shuo Huai, Xiangzhong Luo, Weichen Liu, Ravi Subramaniam, Christian Makaya, Qian Lin", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06519", "run_id": "run-20260709-165925", "title": "FreqDepthKV: Frequency-Guided Depth Sharing for Robust KV Cache Compression in Long-Context LLM Inference", "abstract": "长上下文 LLM 推理时的 KV cache 压缩方法，按频率分解相邻层 KV 状态为共享深度分量与稀疏残差。", "effects": "32k prefill 下达 58.3 EM/63.0 F1/32.5 ROUGE-L/48.1 pass@1，逼近全 KV；解码吞吐 70.4 tok/s，TTFT 2.06s，峰值 KV 内存 6.2GB，3.9 倍压缩。", "mechanism": "将相邻层 KV 分解为共享低频深度分量与稀疏高频残差；轻量在线探针按对重建敏感注意力 logits 的贡献把头分为共享深度/残差深度/精确三种模式，无需重训练。", "paper_url": "https://arxiv.org/abs/2607.06519", "date": "2026-07-07", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "KV cache 压缩属端侧技术栈（relevance 7）。频率引导深度共享+在线探针有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Anna Córdoba; Adam Puente Tercero; Nerea Angulo Hijo; Mar Linares Tercero; Julia Barrientos; Ainhoa Miranda; Jesús Olivera", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06839", "run_id": "run-20260709-165925", "title": "LEMUR 2: Unlocking Neural Network Diversity for AI", "abstract": "大规模 NAS 基准，14000+ 架构/75 万训练记录，含 NN-Lite 在移动和 VR 平台自动部署和延迟基准。", "effects": "覆盖多模态/文生图/语言建模；NN-VR/NN-Lite 管线在异构移动和 VR 平台提供真机性能元数据，支撑跨域架构迁移分析。", "mechanism": "AST 代码变异+遗传/RL 进化+分形架构生成+LLM 引导合成（NN-RAG 从 900+ PyTorch 模块检索架构 motif）；NN-VR/NN-Lite 自动部署基准。", "paper_url": "https://arxiv.org/abs/2607.06839", "date": "2026-07-07", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "NAS 基准含移动/VR 真机部署延迟，端侧可迁移（relevance 7）。14000 架构+LLM 驱动 AutoML+跨平台部署基准有数据集创新（contribution 6）。作者含 Radu Timofte (Würzburg)，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:编译部署", "方向:模型架构", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Tolgay Atinc Uzun, Waleed Khalid, et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06036", "run_id": "run-20260709-165925", "title": "Learn to Pool: Lightweight Fine-Tuning for Flexible Multi-Vector Compression", "abstract": "给多向量检索模型做轻量微调，k-means 池化感知训练在压缩率 83% 时不损检索精度甚至反超。", "effects": "BEIR SciFact 上 pool 因子 1-6 全超未池化基线，向量压缩 83% 无精度损失。", "mechanism": "轻量池化感知微调+k-means；多因子训练产单一模型适用多压缩级；跨池化方法和数据集有迁移证据。", "paper_url": "https://arxiv.org/abs/2607.06036", "date": "2026-07-07", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "多向量检索压缩，端侧 RAG 可迁移（relevance 6）。轻量池化感知微调+多因子训练有创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "应用:RAG", "方向:量化"], "insight_person": "", "wiki_url": "", "authors": "Stefan Josef", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05272", "run_id": "run-20260709-165925", "title": "Adaptive Inference Batching using Policy Gradients", "abstract": "用 RL 学推理服务的自适应批处理和路由策略，在多 GPU 异构路由中发现工作负载隔离策略消除队头阻塞。", "effects": "多 GPU 异构路由下比 Round-Robin 提升 3.5 倍（348%），比最强启发式高 48%，吞吐高 60% 延迟低 25%。", "mechanism": "REINFORCE/PPO agent 在离散事件仿真器上训练，MDP 建模队列状态/请求类型/GPU 可用性；attention 增强策略网络收敛快 20%。", "paper_url": "https://arxiv.org/abs/2607.05272", "date": "2026-07-06", "score": 13, "score_relevance": 5, "score_contribution": 8, "score_reason": "推理服务批处理调度，云端为主（relevance 5）。RL 多 GPU 路由+工作负载隔离发现有创新（contribution 8）。作者单人，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:云端serving", "方向:调度服务", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Ruslan Sharifullin", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.05155", "run_id": "run-20260709-165925", "title": "EdgeBench: Unveiling Scaling Laws of Learning from Real-World Environments", "abstract": "分析约 38000 小时 agent 与真实环境交互、134 个真实任务，首次发现 agent 环境学习性能遵循 log-sigmoid 标度律，R²=0.998。", "effects": "agent 学习速度约每三个月翻倍；发布 51 个任务和评测框架。任务覆盖科研发现/软件工程/组合优化/数学/游戏，每任务至少 12 小时连续运行。", "mechanism": "构建 134 个超长程真实任务的多层反馈评测套件 EdgeBench，跨任务拟合性能-数据/计算标度律。", "paper_url": "https://arxiv.org/abs/2607.05155", "date": "2026-07-06", "score": 13, "score_relevance": 5, "score_contribution": 8, "score_reason": "agent 环境学习标度律，非端侧设备但 agent 研究基础（relevance 5）。首次实证 agent 学习标度律+134 任务套件有创新（contribution 8）。作者含 Deyao Zhu/Wangchunshu Zhou 等，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:端侧agent", "方向:规划推理"], "insight_person": "", "wiki_url": "", "authors": "Deyao Zhu, Xin Zhou, Shengling Qin, et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04921", "run_id": "run-20260709-165925", "title": "Efficient Perception in Automotive Detection and Tracking Using Neuromorphic Computing", "abstract": "首次系统评估脉冲神经网络用于真实汽车多目标检测与跟踪，面向端侧能效。", "effects": "KITTI 检测 mAP 0.937、BDD100K MOT2020 0.771；跟踪 HOTA 0.701（KITTI）/0.445（BDD100K），与常规深度学习方法相当。", "mechanism": "用 SpikeYOLO 架构做迁移学习，在 KITTI 与 BDD100K MOT2020 上评估检测与跟踪，证明 SNN 在能效上具竞争力。", "paper_url": "https://arxiv.org/abs/2607.04921", "date": "2026-07-06", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "神经形态 SNN 用于汽车感知，明确端侧能效（relevance 8）。首次 SNN 汽车检测跟踪综合评估（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Manish Kolachalam; Rani Malhotra", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04290", "run_id": "run-20260709-165925", "title": "Agentic-V2X: Small Language Model Agents for Deadline-Aware V2X Scheduling in 5G/6G Networks", "abstract": "用本地部署的小语言模型生成 V2X 调度策略、轻量控制器执行的 5G/6G 网络架构。", "effects": "126 次运行显示自适应 LLM-rApp/xApp 能生成可执行策略，在高密度下关键可靠性均值优于 PF，但整体未超最强静态策略。", "mechanism": "小模型根据场景摘要生成含服务优先级/权重界/安全约束的结构化策略，验证器检查修复后控制器在 ns-3 中改调度权重执行。", "paper_url": "https://arxiv.org/abs/2607.04290", "date": "2026-07-05", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "明确本地部署小模型做策略生成（relevance 8）。架构整合+安全可执行策略生成（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:调度服务"], "insight_person": "", "wiki_url": "", "authors": "Gerasimos Papanikolaou-Ntais; Alexandros Kaloxylos; Athanasios Kanavos", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04164", "run_id": "run-20260709-165925", "title": "BrownoutMoE: Structure-Aware Expert Grouping for Efficient and Accurate LLM Web-based Services", "abstract": "把 MoE 专家重组成组提升利用率，用 RL 发现最小精度下降的分组策略，再蒸馏产出可部署模型。", "effects": "精度下降最多减 71.4%，吞吐最多升 2.24 倍。", "mechanism": "层内专家分组学习问题用 RL 求解；分组一致蒸馏产出兼容标准推理管线的可部署模型。", "paper_url": "https://arxiv.org/abs/2607.04164", "date": "2026-07-05", "score": 13, "score_relevance": 5, "score_contribution": 8, "score_reason": "MoE 服务效率，云端 serving 为主（relevance 5）。结构感知专家分组+RL+分组一致蒸馏有创新（contribution 8）。作者澳门大学，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:云端serving", "方向:蒸馏", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yi Ding, Minxian Xu, Zhengxin Fang, Kejiang Ye, Chengzhong Xu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03801", "run_id": "run-20260709-165925", "title": "Punching Above Their Weight: Classification-Head Fine-Tuning of Tiny Language Models (TLMs) for Verifiable Multiple-Choice Tasks", "abstract": "研究 <3B 的微型语言模型（TLMs）在消费设备上做可验证多选题任务的微调范式。", "effects": "判别式分类头微调在 0.6B/1.7B 上比标签生成高 2-3%；Qwen3-0.6B/1.7B 微调后在 HellaSwag/WinoGrande/PIQA 上达 SOTA，可与 GPT-3/PaLM/GPT-4 竞争。", "mechanism": "比较标签生成、gold-only、判别式分类头三种 LoRA 微调范式，在 Qwen3 0.6B-8B 与五个基准上统一评测。", "paper_url": "https://arxiv.org/abs/2607.03801", "date": "2026-07-04", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "明确微型语言模型在消费设备上部署（relevance 8）。判别式分类头微调属工程研究（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "模型:Qwen", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Bhavesh Sood; Jaromir Savelka", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03784", "run_id": "run-20260709-165925", "title": "Rethinking Depth Pruning for Vision Transformers: A Heterogeneity-Aware Perspective", "abstract": "从层间异质性视角重思 Vision Transformer 的深度剪枝，避免维度失配。", "effects": "DeiT-B 1.58 倍加速保精度，DeiT-S 1.39 倍加速近无损；与宽度剪枝结合把极端 ViT 剪枝加速比从 4.24x 提到 5.19x。", "mechanism": "揭示既有深度剪枝失败源于忽视层间异质性；HetDPT 做异质感知深度剪枝避免维度失配，与宽度剪枝联合。", "paper_url": "https://arxiv.org/abs/2607.03784", "date": "2026-07-04", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "ViT 深度剪枝属端侧技术栈（relevance 7）。异质感知深度剪枝有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Zhenfeng Su; Kang Zhao; Han Bao; Tao Yuan; Zhongzhe Hu; Xianzhi Yu; Wenxuan Wang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06979", "run_id": "run-20260709-165925", "title": "Robust Federated Learning Under Real-World Client Churn", "abstract": "面向真实客户端流失场景的联邦学习编排框架，让 on-device 数据训练能快速跟上分布变化。", "effects": "在 CIFAR-10/Google Speech 与低可用性 trace 上，到达目标准确率的墙钟时间最多缩短 2.37 倍，通信带宽减少 1.30 倍。", "mechanism": "FeLiX 引入流式感知可用性分层、新鲜效用选择、信息感知且延迟鲁棒的聚合三个原语，在真实客户端可用性下逼近先知级表现。", "paper_url": "https://arxiv.org/abs/2607.06979", "date": "2026-07-08", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "联邦学习 on-device 数据训练，明确端侧场景（relevance 6）。流式可用性分层+延迟鲁棒聚合有系统创新（contribution 6）。作者机构 arXiv 元数据未明确标注，vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:调度服务"], "insight_person": "", "wiki_url": "", "authors": "Dhruv Garg; Neha Lakhani; Debopam Sanyal; Myungjin Lee; Alexey Tumanov; Ada Gavrilovska", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06678", "run_id": "run-20260709-165925", "title": "NativeMEM: Native Memory Compression for Long-Horizon Robotic Manipulation", "abstract": "为 VLA 模型设计的高效长程记忆压缩方案，让每帧历史压缩成单 token 并保留实时更新。", "effects": "仿真成功率从 32.4% 升到 84.0%，真机达 98.7%，且用 20% 训练数据即达竞争结果，推理延迟与 GPU 内存低。", "mechanism": "Native Memory Compression 复用 VLA 自身视觉编码器把每相机每帧历史压成单 token，拼到输入序列；先在冻结 VLA 监督下训练记忆 tokenizer，再解冻 VLA 做任务微调。", "paper_url": "https://arxiv.org/abs/2607.06678", "date": "2026-07-07", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "VLA 记忆压缩属端侧技术栈但偏机器人（relevance 6）。复用视觉编码器做单 token 记忆有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:多模态", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Ziye Wang; Modi Shi; Chaojun Ni; Jiazhi Yang; Mengdi Li; Zhizhong Su; Tianwei Lin; Hongyang Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06763", "run_id": "run-20260709-165925", "title": "Trees from Marginals: Autoregressive drafting with factorized priors", "abstract": "为分解式 drafter 构造提议树的轻量自回归适配器，恢复条件依赖以提升投机解码接受率。", "effects": "相对自回归解码加速 4.37 倍，优于高度优化的 DFlash 基线 24.7%。", "mechanism": "Weaver 从分解 drafter 的 top-K 边际构造提议树，恢复 token 间条件依赖而避免全词表投影；为 Gated Delta Net 层推导无回滚树验证算法并在 SGLang 实现 CUDA kernel。", "paper_url": "https://arxiv.org/abs/2607.06763", "date": "2026-07-07", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "投机解码属端侧技术栈但非显式端侧（relevance 6）。提议树+无回滚验证有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码"], "insight_person": "", "wiki_url": "", "authors": "Yuma Oda; Ryan Mathieu; Roman Knyazhitskiy; Artur Chakhvadze", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04698", "run_id": "run-20260709-165925", "title": "F-ACVAE: A Federated Adaptive Conditional Variational Auto-Encoder for Privacy-Preserving Intrusion Detection in IoT Networks", "abstract": "面向 IoT 入侵检测的联邦自适应条件变分自编码器，在异质边缘设备上保护隐私地协同训练。", "effects": "N-BaIoT 上平均准确率与宏 F1 达 99%，超基线；选择性聚合把通信开销降约 62%。", "mechanism": "本地编码器私有、全局共享组件同步以保留判别潜结构；提出受约束动量高斯聚合（CMGA）结合更新钳制与动量平滑抑制客户端漂移。", "paper_url": "https://arxiv.org/abs/2607.04698", "date": "2026-07-06", "score": 12, "score_relevance": 7, "score_contribution": 5, "score_reason": "联邦 IoT 入侵检测，明确边缘设备（relevance 7）。CMGA 抑制极端 non-IID 漂移有工程创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "应用:IoT命令", "方向:安全隐私", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Mohammad Ansarimehr; Somayeh Changiz; Ehsan Baghishani; Ali Mousavi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04951", "run_id": "run-20260709-165925", "title": "When Words Predict Workload", "abstract": "一个 CPU 侧语言资源预测网关，提前预测请求是否会撑爆消费级边缘 GPU 显存并安全路由。", "effects": "6000 请求实测中误路由比例降至 0.087-0.095（token 计数基线为 0.849），峰值边缘 VRAM 稳定在 4.82GB（8GB 上限内），AUROC 0.84。", "mechanism": "提取 16 维文本结构向量，用 XGBoost 预测陷阱带归属，得到升级概率与动态闭式路由阈值比较，在分配边缘显存前决定路由到本地 Qwen2.5-7B 边缘 worker 或远端 H100 集群。", "paper_url": "https://arxiv.org/abs/2607.04951", "date": "2026-07-06", "score": 12, "score_relevance": 7, "score_contribution": 5, "score_reason": "明确消费级边缘 GPU VRAM 与 KV cache 调度（relevance 7）。CPU 侧语言预测网关有工程创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:调度服务", "方向:KV cache", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Anubhab Banerjee", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04254", "run_id": "run-20260709-165925", "title": "Air-Plan: Query-Optimized Topology Selection for Over-the-Air Decentralized Federated Learning", "abstract": "为 over-the-air 去中心化联邦学习做查询优化的拓扑选择框架。", "effects": "在 91.4% 工作负载上匹配 oracle 最优拓扑，开销低于 1.8%；并证明连通拓扑更能容忍激进稀疏化。", "mechanism": "AIRPLAN 建立 OTA-DFL 与分布式查询处理的形式等价，把拓扑选择建模为代价查询优化；用隐私 Count-Min Sketch 统计估计负载，按图感知代价模型选最小训练代价且满足精度 SLA 的通信图。", "paper_url": "https://arxiv.org/abs/2607.04254", "date": "2026-07-05", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "OTA 去中心化联邦学习属端侧技术栈偏通信（relevance 6）。DFL-查询优化形式等价有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Kaushal Attaluri; Rebeca P. Diaz-Redondo; Manuel Fernandez Veiga", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04179", "run_id": "run-20260709-165925", "title": "CritiqueDriveVLM: From Verifier-Guided Reinforcement Learning to Latent Thought Distillation for Autonomous Driving", "abstract": "把推理内化进 VLM 的三阶段框架，用潜思想蒸馏解决自动驾驶实时部署的延迟问题。", "effects": "Teacher 把 MCQ 从 55.54% 提到 76.54%；蒸馏 Student 平均只生 28 token，推理延迟从 3482ms 降到 416ms（降 88%）。", "mechanism": "先做多维验证器引导的多轮 RL 培养 System-2 Teacher；再用 Latent Thought Distillation 对齐 Student 潜表示与 Teacher 收敛推理态，把深度逻辑压进无 CoT 的 System-1 Student。", "paper_url": "https://arxiv.org/abs/2607.04179", "date": "2026-07-05", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "面向实时自动驾驶 VLM 部署的延迟优化（relevance 6）。潜思想蒸馏内化推理有创新（contribution 6）。vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:多模态", "方向:蒸馏", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Zhaohong Liu; Hao Ye; Xianlin Zhang; Mengshi Qi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04244", "run_id": "run-20260709-165925", "title": "Quantize the Target, Quantize the Drafter: Efficient Inference with Qwen3.5-4B", "abstract": "在受限 NVIDIA A10G GPU 上为 Qwen3.5-4B 做量化+投机解码的低延迟 serving。", "effects": "相对基线平均加速 6.978 倍并满足质量阈值，在 Efficient Qwen 竞赛排名第 3。", "mechanism": "目标模型量化+量化感知蒸馏恢复精度；训练 block-diffusion drafter（先学高精度目标再适配低精度目标）并对其量化+滑窗注意力降开销。", "paper_url": "https://arxiv.org/abs/2607.04244", "date": "2026-07-05", "score": 12, "score_relevance": 7, "score_contribution": 5, "score_reason": "明确受限 GPU 上的量化+投机解码部署（relevance 7）。竞赛工程整合，方法为常见组合（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:量化", "方向:投机解码", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Jaeyeon Kim; Jewon Lee; Bo-Kyeong Kim", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.02963", "run_id": "run-20260709-165925", "title": "Parallelized Autoregressive Decoding for Omni-Modal Dense Video Captioning", "abstract": "给全模态密集视频字幕生成做并行自回归解码，利用时间上不同事件间的弱依赖让 token 跨事件并行生成。", "effects": "多基准上事件定位与字幕的效率与性能双优，无损并行生成。", "mechanism": "潜在全局规划学事件结构产紧凑 token 编码跨事件因果；事件因子化并行解码让弱依赖 token 并行、紧耦合 token 保序。", "paper_url": "https://arxiv.org/abs/2607.02963", "date": "2026-07-03", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "并行解码提效，视频生成非显式端侧但技术可参考（relevance 5）。弱依赖跨事件并行解码无损加速有创新（contribution 7）。作者 NUS，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:高效推理", "方向:多模态", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Wenzheng Zeng, Siyi Jiao, Chen Gao, Hwee Tou Ng, Mike Zheng Shou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03451", "run_id": "run-20260709-165925", "title": "SkillOpt-Lite: Better and Faster Agent Self-evolution via One Line of Vibe", "abstract": "把 agent 技能优化形式化为零阶优化，砍掉冗余组件，三原则下用一行 vibe 让 agent 自我进化技能。", "effects": "LiveMath 上 GPT-5.5 +8.8 分、GPT-5.4-nano +25.4 分让 nano 超标准 GPT-5.4；集成 VSCode Copilot；SpreadsheetBench 上 nano 0.7758 超 GPT-5.5。", "mechanism": "零阶优化映射经典对应，三原则：文件系统轨迹探索、共识属性挖掘、独立验证门控；砍冗余得最小管线并推广到 harness 优化。", "paper_url": "https://arxiv.org/abs/2607.03451", "date": "2026-07-03", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "agent 自进化技能，可迁移端侧小 agent 但非显式端侧（relevance 5）。零阶优化最小管线+三原则有方法学创新（contribution 7）。作者学校项目，开源。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:工具调用", "方向:规划推理", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yifei Shen, Bo Li, Xinjie Zhang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06768", "run_id": "run-20260709-165925", "title": "AirPASS: Over-the-Air Federated Learning via Pinching Antenna Systems", "abstract": "研究在配备 pinch antenna 系统的无线系统中进行 over-the-air 联邦学习的优化框架。", "effects": "AirPASS 一致优于共址 MIMO 基线，接近理想 FedAvg，并在性能-复杂度上优于 SDR-DC 与匹配追踪方案。", "mechanism": "提出交替优化框架：固定 PASS 配置下用同伦-Riemannian 方法做设备选择与波束成形，固定设备下用同伦辅助几何优化更新 pinch 天线位置。", "paper_url": "https://arxiv.org/abs/2607.06768", "date": "2026-07-07", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "OTA 联邦学习属于端侧技术栈但偏通信侧（relevance 6）。pinching antenna 优化框架有工程新意（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Seyed Mohammad Azimi-Abarghouyi; Christopher G. Brinton", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04593", "run_id": "run-20260709-165925", "title": "TORINO: Token Reduction via Interpretable Concept Overlap in Vision-Language Models", "abstract": "用稀疏自编码器把 VLM 视觉 token 投到可解释潜空间，按概念重叠做自适应 token 缩减。", "effects": "在多个视觉语言基准上以最小性能损失减少视觉 token 数量，实现良好的效率-精度折衷。", "mechanism": "TORINO 用 SAE 把视觉 token 投到可解释潜空间，定义概念重叠为活跃 SAE 潜变量的一致度，按共享语义内容分组，组内做剪枝或合并；按输入复杂度动态调整缩减率。", "paper_url": "https://arxiv.org/abs/2607.04593", "date": "2026-07-06", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "VLM token 缩减属端侧技术栈但非显式端侧（relevance 6）。SAE 概念重叠分组有创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:多模态", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Riccardo Renzulli; Gabriele Spadaro; Shruthi Gowda; Alaa Eddine Mazouz; Van-Tam Nguyen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04219", "run_id": "run-20260709-165925", "title": "Agentic IoT: Architectures, Applications, and Challenges Toward the Internet of Agents", "abstract": "把 Agentic IoT 作为下一代认知 IoT 范式，综述其架构、应用与挑战。", "effects": "未报告", "mechanism": "系统综述 Agentic IoT 从数据中心感知到分布式认知 agent 生态的范式转变，给出整体架构框架、领域应用与关键技术挑战。", "paper_url": "https://arxiv.org/abs/2607.04219", "date": "2026-07-05", "score": 11, "score_relevance": 7, "score_contribution": 4, "score_reason": "Agentic IoT 综述属端侧 agent 范式（relevance 7）。综述类无明显技术创新（contribution 4）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:IoT命令"], "insight_person": "", "wiki_url": "", "authors": "Rümeysa Hilal Sevinç; Bahaeddin Türkoğlu; İbrahim Kök", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04218", "run_id": "run-20260709-165925", "title": "Channel-Adaptive Robust Aggregation for Over-the-Air Federated Learning in Heterogeneous Networks", "abstract": "面向异质网络中 OTA 联邦学习的信道自适应鲁棒聚合框架。", "effects": "在真实无线条件下准确率、稳定性与收敛性均优于现有 OTA-FL 方法，在掉队者与噪声场景尤甚。", "mechanism": "按信道动态与应用就绪度自适应调度聚合，结合定制优化策略与双用途预编码机制，缓解信道失真与部分更新偏差。", "paper_url": "https://arxiv.org/abs/2607.04218", "date": "2026-07-05", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "OTA 联邦学习属端侧技术栈偏通信（relevance 6）。信道自适应调度+双预编码有工程创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Zubaida Fatima; Zubair Shaban; Yusuf Jamal; Nazreen Shah; Ranjitha Prasad; B. N. Bharath", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04206", "run_id": "run-20260709-165925", "title": "Sangam: Efficiently Serving Diffusion LLMs with the AR Stack", "abstract": "为扩散语言模型（dLLM）设计的缓存推理 serving 系统，把 AR serving 机制适配到 dLLM。", "effects": "decode-heavy 负载下 colocated 比 hybrid 在 LLaDA-8B ShareGPT 上平均延迟降 9-20%；prefill-heavy 负载下 hybrid 比 colocated 在 Dream-7B arXiv 上降 8-20%。", "mechanism": "引入亏空 token 预算调度器（先放入在飞 decode、只在预算允许时放入不可分 prefill、结转余额）；hybrid 策略把 prefill 溢出到 decode worker 并用同调度器保护其 decode。", "paper_url": "https://arxiv.org/abs/2607.04206", "date": "2026-07-05", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "云端 dLLM serving 系统（relevance 4，云端serving）。亏空预算调度+hybrid 溢出有系统创新（contribution 7）。vendors 空。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:云端serving", "方向:调度服务", "方向:KV cache"], "insight_person": "", "wiki_url": "", "authors": "Nitin Kedia; Saurabh Agarwal; Myungjin Lee; Aditya Akella", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.04079", "run_id": "run-20260709-165925", "title": "Seeing Once is Enough? Online Geometry-Aware Token Pruning for 3D Question Answering", "abstract": "首个在线 token 剪枝方法，用于 3D 问答，无需额外训练且内存更低。", "effects": "减少最多 50% token 用量；在 Qwen2.5-VL-7B/Qwen3-VL-8B 上于 ScanQA/SQA3D/OpenEQA-HM3D 提升性能。", "mechanism": "把每帧投到共享 voxel 空间，用深度与相机位姿识别跨帧空间重叠区域，在进入语言模型前剪除冗余图像 token。", "paper_url": "https://arxiv.org/abs/2607.04079", "date": "2026-07-05", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "3D 问答 token 剪枝属端侧技术栈但非显式端侧（relevance 6）。首个在线 voxel 投影剪枝有创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:多模态", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Ruei-Chi Lai; Bolivar Solarte; Chin-Hsuan Wu; Yi-Hsuan Tsai; Min Sun", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03171", "run_id": "run-20260709-165925", "title": "Decentralised Federated Learning over Temporal Networks: The Role of Heterogeneities", "abstract": "研究去中心化联邦网络中结构与时间异质性对训练的影响。", "effects": "证明现有常用实验场景因忽略通信网络的时间-结构异质性而收敛过快；真实时序网络上异质性通常大幅拖慢扩散与收敛。", "mechanism": "把去中心化 FL 的局部平均聚合映射为时序网络上的惰性随机游走扩散过程，据此分析早期与稳态极限的收敛动力学。", "paper_url": "https://arxiv.org/abs/2607.03171", "date": "2026-07-03", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "去中心化 on-device FL 属端侧技术栈（relevance 6）。时序网络扩散映射分析有创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Arash Badie-Modiri; Chiara Boldrini; Lorenzo Valerio; János Kertész; Márton Karsai", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03334", "run_id": "run-20260709-165925", "title": "FedAvg for HAR: Exploring the Tradeoff Between Personalized and Generalization Accuracy", "abstract": "在人体活动识别领域实验 FedAvg，比较个性化与泛化能力的折衷。", "effects": "FedAvg 在一般条件下兼顾个性化与泛化优于集中式学习，但在类分布随客户端变化等压力条件下优势不明显。", "mechanism": "设计多个测试场景比较集中式、本地与联邦范式，并模拟客户端数据变化，在 HAR 上实验 FedAvg 的个性化-泛化折衷。", "paper_url": "https://arxiv.org/abs/2607.03334", "date": "2026-07-03", "score": 11, "score_relevance": 7, "score_contribution": 4, "score_reason": "联邦 HAR 面向普及设备（relevance 7）。FedAvg 常规研究无明显创新（contribution 4）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Andrea De Luna; Susanna Peretti; Chiara Contoli; Alessandro Bogliolo", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.03050", "run_id": "run-20260709-165925", "title": "OmniFocus: Query-Guided Modality-Balanced Token Compression for Omni-Modal Large Language Models", "abstract": "面向 Omni-LLM 的免训练、查询引导的音视频 token 压缩方法，按模态对称压缩。", "effects": "在 Qwen2.5-Omni 上 25% token 保留时保持强性能；DailyOmni 上 59.40 准确率且 prefill 提速最多 1.38 倍。", "mechanism": "对视频与音频各自独立估计重要性，做模态对称压缩，保留模态特定显著证据并维持音视频对齐，缓解单模态引导压缩的模态偏置。", "paper_url": "https://arxiv.org/abs/2607.03050", "date": "2026-07-03", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "Omni-LLM token 压缩属端侧技术栈但非显式端侧（relevance 6）。模态对称独立重要性估计有创新（contribution 5）。vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:多模态", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Shijie Cao; Qingyu Zhang; Boxi Yu; Yuzhong Zhang; Boxi Cao; Yaojie Lu; Hongyu Lin; Xianpei Han", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-10T03:48:36.291600+00:00"}, {"id": "arxiv-2607.06796", "run_id": "run-20260709-165925", "title": "Enhancing deep learning models for time series classification via knowledge distillation", "abstract": "研究知识蒸馏在时间序列分类上的有效性，面向资源受限环境部署。", "effects": "蒸馏 FCN 学生参数减少 38 倍，蒸馏 Inceptio
