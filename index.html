<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>端侧 AI Agent 论文雷达</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; background: #f7f3ea; color: #202621; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 4px; font-size: 26px; color: #202621; }
    .muted { color: #627066; margin: 0 0 16px; font-size: 14px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid #cfc6b4; margin-bottom: 16px; }
    .tab { padding: 8px 18px; border: none; background: transparent; color: #627066; font-size: 15px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; display: inline-flex; align-items: center; gap: 6px; }
    .tab:hover { color: #8d3d30; }
    .tab.active { color: #8d3d30; border-bottom-color: #8d3d30; }
    .tab .count { display: inline-block; min-width: 18px; padding: 0 6px; background: #eee7da; color: #596258; border-radius: 9px; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
    .tab.active .count { background: #8d3d30; color: #fffaf0; }
    .cat-panel { display: none; }
    .cat-panel.active { display: block; }
    .card { background: #fffdf7; border: 1px solid #cfc6b4; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
    .card-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .score { font-weight: 700; color: #8d3d30; font-size: 20px; min-width: 30px; }
    .vendor-badge { display: inline-block; padding: 2px 7px; border: 1px solid #8d3d30; color: #8d3d30; font-size: 11px; font-weight: 700; border-radius: 3px; }
    .open-badge { display: inline-block; padding: 2px 7px; border: 1px solid #2e7d32; color: #2e7d32; font-size: 11px; font-weight: 700; border-radius: 3px; }
    .vendor-tag { display: inline-block; padding: 3px 10px 3px 8px; background: #fffdf7; border-left: 3px solid #8d3d30; border-radius: 0 4px 4px 0; font-size: 12px; font-weight: 600; color: #8d3d30; }
    .date { color: #627066; font-size: 13px; }
    .title { font-weight: 700; font-size: 15px; color: #202621; text-decoration: none; }
    .title:hover { color: #8d3d30; }
    .keywords { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
    .kw { display: inline-block; padding: 2px 9px; background: #eee7da; border-radius: 11px; font-size: 12px; color: #596258; line-height: 1.6; }
    .field { display: flex; margin-top: 8px; gap: 10px; }
    .label { flex-shrink: 0; width: 84px; color: #627066; font-size: 13px; font-weight: 600; }
    .text { color: #3f463f; font-size: 14px; line-height: 1.55; }
    .score-reason { margin-top: 8px; color: #4c554e; font-size: 12px; line-height: 1.4; }
    .score-dims { margin-top: 3px; color: #7a837a; font-size: 11px; }
    .card-foot { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    input { padding: 5px 8px; border: 1px solid #cfc6b4; background: #fffaf0; border-radius: 4px; font-size: 13px; color: #202621; }
    input[name="insight_person"] { width: 130px; }
    input[name="wiki_url"] { width: 200px; }
    button { padding: 5px 14px; border: 1px solid #8d3d30; color: #8d3d30; background: #fffaf0; cursor: pointer; border-radius: 4px; font-size: 13px; }
    button:hover { background: #8d3d30; color: #fffaf0; }
    .empty { color: #627066; font-style: italic; padding: 20px; text-align: center; }
    @media (max-width: 640px) {
      .field { flex-direction: column; gap: 2px; }
      .label { width: auto; }
      input[name="insight_person"], input[name="wiki_url"] { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>端侧 AI Agent 论文雷达</h1>
    <p class="muted" id="summary">正在读取服务器最新调研结果...</p>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" data-tab="academic" role="tab">学术论文<span class="count" id="count-academic">0</span></button>
      <button class="tab" data-tab="official" role="tab">官方动态<span class="count" id="count-official">0</span></button>
    </div>
    <div id="papers"></div>
  </main>
  <script>window.__PAPERS__ = {"papers": [{"id": "mediatek-dgx-spark-agents-2026", "run_id": "run-20260626-v4", "title": "Running AI Agents Locally on DGX Spark", "abstract": "介绍 MediaTek 与 NVIDIA 联合设计的 GB10 Grace Blackwell 芯片如何让用户在桌面级设备 DGX Spark 上本地跑 AI agent，不用上云就能获得更快响应和更好隐私。", "effects": "未报告", "mechanism": "DGX Spark 基于 GB10 Grace Blackwell Superchip，结合 MediaTek 的 CPU 性能和功耗效率与 NVIDIA 的加速计算，支持 1 PFLOP FP4 算力，可本地运行 OpenClaw 和 Hermes Agent 等助手，重计算留在本地、按需连云。", "paper_url": "https://www.mediatek.com/tek-talk-blogs/running-ai-agents-locally-on-dgx-spark", "date": "2026-06-24", "score": 67, "score_relevance": 22, "score_vendor": 23, "score_contribution": 7, "score_quality": 10, "score_recency": 5, "score_open": 0, "score_reason": "MediaTek 官方技术博客，介绍端侧本地运行 AI agent 的硬件平台，大厂官方给 vendor 最高分；但属产品宣传非深度技术创新，contribution 和 quality 中等。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "应用", "keywords": ["端侧部署", "AI智能体", "NPU", "本地推理", "MediaTek"], "insight_person": "", "wiki_url": "", "authors": "PD Rajput", "vendors": "MediaTek", "venue": "MediaTek Tek Talk Blog", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "vec-lut-tsinghua-mobisys2026", "run_id": "run-20260626-v4", "title": "Vec-LUT: Vector Table Lookup for Parallel Ultra-Low-Bit LLM Inference on Edge Devices", "abstract": "解决超低比特大模型在端侧纯 CPU 上查表推理太慢的问题。把逐 token 的标量查表改成跨 token 的向量查表，一次查表搞定多个 token，让 1.58 比特大模型在 CPU 上跑得比 NPU 方案还快。", "effects": "5 台端侧设备上 4.2 倍加速、2.1 倍节能；骁龙 8 Elite 上 2 核 CPU 超过 NPU 方案 1.1 倍；已集成进 llama.cpp。", "mechanism": "提出向量 LUT 范式：跨并行 token 构建统一查表、单次 1 到 N 查询；配合向量 LUT 专属张量布局和缓存感知流式查表，把随机查表变成连续向量加法。", "paper_url": "https://arxiv.org/abs/2512.06443", "date": "2026-06-22", "score": 78, "score_relevance": 29, "score_vendor": 8, "score_contribution": 14, "score_quality": 14, "score_recency": 5, "score_open": 8, "score_reason": "清华 AIR 学校项目，MobiSys 2026 顶会，直击端侧超低比特 LLM 推理的并行查表瓶颈，4.2 倍加速贡献突出；已集成 llama.cpp 开源，score_open 高分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["端侧推理", "超低比特量化", "查表加速", "LLM部署", "NPU"], "insight_person": "", "wiki_url": "", "authors": "Xiangyu Li; Chengyu Yin; Weijun Wang; Jianyu Wei; Ting Cao; Yunxin Liu", "vendors": "Tsinghua AIR", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "timelyllm-yale-mobisys2026", "run_id": "run-20260626-v4", "title": "TimelyLLM: Time-sensitive LLM Serving System for Physical-I/O Limited Agents", "abstract": "解决 LLM 给机器人和语音助手做 agent 时生成速度和物理执行速度不匹配的问题。不是一次生成完整计划，而是分段生成、执行一段再生成下一段，把空闲算力让给其他请求。", "effects": "时间效用提升约 1.5 倍，等待时间减少 84%，在多机器人场景验证有效。", "mechanism": "提出分段生成：把 LLM 输出切成可执行的小段，生成一段就暂停、让 agent 去执行；配合松弛感知调度器，按紧急程度决定何时恢复生成，把空闲算力分配给其他请求。", "paper_url": "https://arxiv.org/abs/2412.18695", "date": "2026-06-22", "score": 69, "score_relevance": 28, "score_vendor": 8, "score_contribution": 14, "score_quality": 14, "score_recency": 5, "score_open": 0, "score_reason": "耶鲁大学学校项目，MobiSys 2026 最佳论文亚军，解决端侧 agent 的 LLM 推理与物理执行速度不匹配问题，对机器人、语音助手等物理 I/O 受限 agent 高度相关；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["LLM推理", "端侧部署", "机器人agent", "调度系统", "延迟优化"], "insight_person": "", "wiki_url": "", "authors": "Neiwen Ling; Guojun Chen; Anurag Khandelwal; Lin Zhong", "vendors": "Yale University", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "agent-x-kaist-mobisys2026", "run_id": "run-20260626-v4", "title": "Agent-X: Full Pipeline Acceleration of On-device AI Agents", "abstract": "解决端侧 AI agent 推理延迟高的问题。系统分析 agent 工作流的 prefill 和 decode 两个瓶颈，分别用 prompt 重写利用前缀缓存、和无需额外 LLM 的轻量投机解码来加速，全流程不损失精度。", "effects": "prefill 加速 1.97 倍，decode 加速 1.73 倍，端到端任务延迟改善 1.61 倍，精度无损；集成 Apple MLX-LM 和 TinyAgent 实测。", "mechanism": "PromptWeaver 动态重组输入 prompt 利用前缀缓存加速 prefill；ExSpec 用轻量 prompt 感知 draft 模型做投机解码加速 decode，无需额外 LLM，适合端侧资源受限环境。", "paper_url": "https://arxiv.org/abs/2605.10380", "date": "2026-06-22", "score": 68, "score_relevance": 29, "score_vendor": 8, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "KAIST 学校项目，MobiSys 2026 顶会，直击端侧 AI agent 全流水线加速，prefill 和 decode 双阶段优化创新度高；但未明确开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["端侧部署", "推理加速", "前缀缓存", "投机解码", "AI智能体"], "insight_person": "", "wiki_url": "", "authors": "Jinha Chung; Byeongjun Shin; Jiin Kim; Minsoo Rhu", "vendors": "KAIST", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "swarmx-tencent-2026", "run_id": "run-20260626-v4", "title": "SwarmX: Agentic Scheduling for Low-Latency Agentic Systems", "abstract": "解决 agentic AI 应用在 GPU-CPU 集群上调度难的问题。agent 应用的推理时间和模型调用结构依赖 prompt 语义，传统调度不适用。用神经网络预测器捕获 prompt、设备、运行时和目标模型特征，给路由和扩缩容做尾延迟感知决策。", "effects": "尾延迟降低 61.5%，吞吐量达生产调度器的 2 倍，在生产环境（近千 GPU、百万 CPU 核）和 128-GPU 测试床验证。", "mechanism": "调度专用神经网络预测器捕获 prompt 和设备特征，暴露分布预测给路由和扩缩容做尾延迟感知决策；集成调度器-agent 框架，支持在线自适应和与现有调度基础设施对接。", "paper_url": "https://arxiv.org/abs/2606.21401", "date": "2026-06-20", "score": 66, "score_relevance": 18, "score_vendor": 17, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "腾讯公司项目（作者邮箱 deargong@tencent.com、sarlmolchen@tencent.com 确认 affiliation，arXiv PDF 通讯页），agentic AI 低延迟调度系统，生产环境千 GPU 部署验证；但属云端集群调度非端侧，relevance 中等，按公司项目给 vendor 高分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["调度系统", "agentic AI", "低延迟", "集群调度", "Tencent"], "insight_person": "", "wiki_url": "", "authors": "Yeqi Huang; Yanwei Ye; Guomin Chen; Wenhao Su; Bin Gong; Jialian Li; Zhan Lu; Yangshen Deng; Xuan Sun; Le Xu; Luo Mai", "vendors": "Tencent", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "scaling-mobile-agent-mobisys2026", "run_id": "run-20260626-v4", "title": "Scaling Mobile Agent Systems: From Capability Density to Collective Intelligence", "abstract": "提出手机 agent 系统的扩展路线图：一边提升单个 agent 的能力密度（更小更强），一边让多 agent 协作形成集体智能，两端一起发力才能规模化。", "effects": "未报告", "mechanism": "沿两个维度提出统一框架：一是用紧凑基础模型设计和压缩提升单个 agent 的能力密度；二是用通信丰富的多 agent 协作实现跨设备集体智能。两维度互补，高效单点部署加上协作解锁系统级智能。", "paper_url": "https://arxiv.org/abs/2605.08124", "date": "2026-06-22", "score": 64, "score_relevance": 26, "score_vendor": 7, "score_contribution": 14, "score_quality": 12, "score_recency": 5, "score_open": 0, "score_reason": "MobiSys 2026 顶会论文，直接讨论手机 agent 系统在端侧的规模化路线图，主题高度契合端侧 agent；但属愿景立场论文，无量化实验，贡献度中等；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["手机agent", "能力密度", "多智能体协作", "端侧部署", "规模化"], "insight_person": "", "wiki_url": "", "authors": "Bowei He", "vendors": "", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}, {"id": "kvswap-leeds-mobisys2026", "run_id": "run-20260626-v4", "title": "KVSwap: Disk-aware KV Cache Offloading for Long-Context On-device Inference", "abstract": "解决端侧跑长上下文大模型时内存不够的问题。把 KV 缓存放到磁盘上，用紧凑内存元数据预测哪些条目要预加载，计算和磁盘读取重叠执行，在不牺牲生成质量前提下突破内存墙。", "effects": "在紧内存预算下比现有 KV 缓存卸载方案吞吐更高且生成质量不降；在多种端侧设备和存储类型上验证有效。", "mechanism": "把完整 KV 缓存存磁盘，内存只留紧凑元数据预测未来访问；计算与硬件感知磁盘传输重叠；读模式匹配存储设备特性（NVMe、UFS、eMMC），减少读放大。", "paper_url": "https://arxiv.org/abs/2511.11907", "date": "2026-06-22", "score": 62, "score_relevance": 22, "score_vendor": 7, "score_contribution": 15, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "利兹大学学校项目，MobiSys 2026 顶会，直击端侧长上下文 LLM 推理的内存墙问题，磁盘卸载 KV 缓存是端侧 agent 长任务的基础设施能力；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["KV缓存", "端侧推理", "长上下文", "内存优化", "磁盘卸载"], "insight_person": "", "wiki_url": "", "authors": "Huawei Zhang; Chunwei Xia; Zheng Wang", "vendors": "University of Leeds", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T02:04:19.515599+00:00"}]};</script>
    <script>
    async function loadPapers() {
      const data = window.__PAPERS__;
      const all = data.papers || [];
      // 按 source_type 分两组；tab 内保持 API 返回顺序（storage 已按 is_major_vendor_official DESC, score DESC 排）
      const academic = all.filter((p) => p.source_type === "学术论文");
      const official = all.filter((p) => p.source_type === "官方技术博客" || p.source_type === "官方产品发布");
      const groups = [
        { id: "academic", papers: academic },
        { id: "official", papers: official }
      ];
      const defaultIdx = groups.findIndex((g) => g.papers.length > 0);
      const activeIdx = defaultIdx === -1 ? 0 : defaultIdx;

      document.querySelector("#count-academic").textContent = String(academic.length);
      document.querySelector("#count-official").textContent = String(official.length);
      document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === activeIdx));

      document.querySelector("#papers").innerHTML = groups.map((g, i) =>
        `<div class="cat-panel${i === activeIdx ? " active" : ""}" data-panel="${g.id}" role="tabpanel">${
          g.papers.map(renderCard).join("") || '<p class="empty">本周无此方向内容</p>'
        }</div>`
      ).join("");

      document.querySelector("#summary").textContent = `${all.length} 条内容 · 官方大厂优先 · 来自服务器最新调研结果`;
    }

    document.querySelector("#tabs").addEventListener("click", (event) => {
      const btn = event.target.closest(".tab");
      if (!btn) return;
      const id = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === id));
      document.querySelectorAll(".cat-panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === id));
    });

    function renderCard(p) {
      const kws = (p.keywords || []).map((k) => `<span class="kw">${escapeHtml(k)}</span>`).join("");
      const vendorsRaw = (p.vendors || '').trim();
      const official = vendorsRaw ? `<span class="vendor-tag">${escapeHtml(vendorsRaw)}</span>` : (p.is_major_vendor_official ? `<span class="vendor-badge">官方大厂</span>` : '');
      const openBadge = (p.score_open || 0) > 0 ? `<span class="open-badge">开源</span>` : '';
      return `
      <div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-head">
          <span class="score">${p.score}</span>
          ${official}
          ${openBadge}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        <div class="keywords">${kws}</div>
        <div class="field"><span class="label">论文摘要</span><span class="text">${escapeHtml(p.abstract)}</span></div>
        <div class="field"><span class="label">论文效果</span><span class="text">${escapeHtml(p.effects)}</span></div>
        <div class="field"><span class="label">工作原理</span><span class="text">${escapeHtml(p.mechanism)}</span></div>
        <div class="score-reason">评分依据：${escapeHtml(p.score_reason || "")}</div>
        <div class="score-dims">契合${p.score_relevance ?? ''}·厂商${p.score_vendor ?? ''}·贡献${p.score_contribution ?? ''}·质量${p.score_quality ?? ''}·时效${p.score_recency ?? ''}·开源${p.score_open ?? ''}</div>
        <div class="card-foot">
          <input name="insight_person" value="${escapeAttr(p.insight_person || "")}" placeholder="洞察人">
          <input name="wiki_url" value="${escapeAttr(p.wiki_url || "")}" placeholder="wiki 链接">
          <button type="button" data-action="save">保存</button>
        </div>
      </div>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      const card = button.closest(".card");
      await fetch("/api/insights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paper_id: card.dataset.id,
          insight_person: card.querySelector('[name="insight_person"]').value,
          wiki_url: card.querySelector('[name="wiki_url"]').value
        })
      });
      button.textContent = "已保存";
    });

    loadPapers().catch((error) => {
      document.querySelector("#summary").textContent = `读取失败：${error}`;
    });
  </script>
</body>
</html>
