    <script>
    let ALL = [];
    let ACTIVE = new Set();
    const TIER_ORDER = ["官方动态","开源大项目","公司项目","学校顶会","学校预印本"];

    async function loadPapers() {
      const data = window.__PAPERS__;
      ALL = data.papers || [];
      renderFilter();
      renderPapers();
      document.querySelector("#summary").textContent =
        `${ALL.length} 条 · 过去 7 天 · 按标签筛选 · source_tier 分组`;
    }

    function allTags() {
      const s = new Set();
      ALL.forEach((p) => (p.tags || []).forEach((t) => s.add(t)));
      return [...s];
    }
    function dimOf(t) { return t.split(":")[0]; }
    function valOf(t) { return t.split(":")[1] || t; }

    function renderFilter() {
      const byDim = {};
      allTags().forEach((t) => { const d = dimOf(t); (byDim[d] = byDim[d] || []).push(t); });
      document.querySelector("#filter").innerHTML = ["方向","应用","硬件","模型"].filter(d => byDim[d]).map((d) =>
        `<div class="dim-group"><span class="dim-label">${d}</span>` +
        byDim[d].map((t) => `<button class="ftag${ACTIVE.has(t)?" active":""}" data-tag="${escapeAttr(t)}" data-dim="${d}">${escapeHtml(valOf(t))}</button>`).join("") +
        `</div>`
      ).join("");
    }

    function visible() {
      if (ACTIVE.size === 0) return ALL;
      return ALL.filter((p) => (p.tags || []).some((t) => ACTIVE.has(t)));
    }

    function scoreClass(s) { return s >= 14 ? "hi" : s >= 10 ? "mid" : "lo"; }

    function renderCard(p) {
      const tags = (p.tags || []).map((t) => `<span class="tag" data-dim="${dimOf(t)}">${escapeHtml(valOf(t))}</span>`).join("");
      const open = p.open_source ? `<span class="open-badge">开源</span>` : "";
      return `<div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-row">
          <span class="score ${scoreClass(p.score)}">${p.score}</span>
          <span class="tier">${escapeHtml(p.source_tier || '')}</span>
          ${open}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        <div class="abs">${escapeHtml(p.abstract || "")}</div>
      </div>`;
    }

    function renderPapers() {
      const list = visible();
      const el = document.querySelector("#papers");
      if (!list.length) { el.innerHTML = '<p class="empty">无匹配内容</p>'; return; }
      // group by source_tier
      const groups = {};
      list.forEach((p) => { (groups[p.source_tier] = groups[p.source_tier] || []).push(p); });
      el.innerHTML = TIER_ORDER.filter((t) => groups[t]).map((t) =>
        `<section class="tier-section"><div class="tier-head"><span class="tier-title">${t}</span><span class="tier-count">${groups[t].length}</span></div>` +
        groups[t].map(renderCard).join("") + `</section>`
      ).join("");
    }

    document.querySelector("#filter").addEventListener("click", (e) => {
      const b = e.target.closest(".ftag"); if (!b) return;
      const t = b.dataset.tag;
      if (ACTIVE.has(t)) ACTIVE.delete(t); else ACTIVE.add(t);
      renderFilter(); renderPapers();
    });

    function escapeHtml(v) { return String(v||"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    function escapeAttr(v) { return escapeHtml(v).replace(/`/g,"&#96;"); }

    loadPapers().catch((e) => { document.querySelector("#summary").textContent = `读取失败：${e}`; });
  </script>
