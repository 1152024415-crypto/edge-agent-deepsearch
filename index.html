  <script>window.__PAPERS__ = {"papers": [{"id": "mediatek-dgx-spark-local-agents-2026", "run_id": "run-20260627-v5", "title": "Running AI Agents Locally on DGX Spark", "abstract": "联发科介绍如何在NVIDIA DGX Spark上本地运行AI代理，这款桌面级个人AI超算由联发科与NVIDIA联合设计的GB10 Grace Blackwell超级芯片驱动。", "effects": "DGX Spark支持最高1 PFLOP的FP4 AI性能，可流畅运行多个代理并发任务，开发者可从手机平板远程监控代理工作进度，重计算留在本地按需连接云端。", "mechanism": "GB10超级芯片结合联发科CPU性能与功耗效率与NVIDIA加速计算技术，20核CPU与Blackwell GPU共享128GB统一LPDDR5x内存，通过OpenClaw等平台管理代理，支持多节点并行推理。", "paper_url": "https://www.mediatek.com/tek-talk-blogs/running-ai-agents-locally-on-dgx-spark", "date": "2026-06-24", "score": 76, "score_relevance": 25, "score_vendor": 23, "score_contribution": 8, "score_quality": 12, "score_recency": 5, "score_open": 3, "score_reason": "联发科官方技术博客，直接讲述在边缘设备上本地运行AI代理的实践，与端侧agent主题高度契合。DGX Spark为商业产品但提及OpenClaw开源平台，score_open给3分。产品介绍类内容创新度中等。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "应用", "keywords": ["联发科", "本地代理", "DGX Spark", "边缘推理", "端侧部署"], "insight_person": "", "wiki_url": "", "authors": "PD Rajput (MediaTek)", "vendors": "MediaTek", "venue": "MediaTek Tek Talk Blog", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n现在 AI 正从「问一句答一句」的工具变成能主动干活的 agent，能盯收件箱、整理资讯、跑多步任务。但这些 agent 多数跑在云端，按 token 计费又慢又贵，还把隐私数据送上云。问题是能不能把 agent 跑在自己桌上，既要够快够强，又不能像机房那样吃电。这篇博客正是回答这个本地化痛点。\n\n## 贡献点\n\n两点。第一，把 NVIDIA DGX Spark 这个个人 AI 超算定位成跑本地 agent 的标准平台，配 GB10 Grace Blackwell Superchip，联发科和英伟达联合设计，单机 1 petaflop FP4 算力，插墙电即跑。第二，串起 OpenClaw、Hermes Agent、NemoClaw 一套本地 agent 生态，从搭助手、自适应学习到行为护栏打通，不止谈硬件，是把本地 agent 全链路铺出来。\n\n## 实现方法\n\n硬件上 GB10 把联发科的 CPU 性能与功耗控制和英伟达的加速计算合到一颗芯片，桌面机箱插电即用。软件侧 OpenClaw 用来搭和跑 agent，Hermes Agent 在本地长期记忆对话、按用户习惯自我调整，NemoClaw 给 agent 加行为护栏管数据怎么动、连哪些模型。多台 Spark 能并联做推理分摊，手机平板随时查看后台 agent 进度，重活留本地、要弹性再上云。\n\n## 实验与结果\n\n博客没报告具体 benchmark，只给了几个定性指标：单机最高 1 petaflop FP4 AI 性能，功耗低到能直接插家用墙电，可同时跑多个 agent，多机并联做推理共享。具体的时延、并发数、内存占用都没写。量化数据未报告。\n\n## 对端侧 agent 的意义\n\n直接面向端侧：DGX Spark 就是「桌面级端侧」，把云端 agent 那套搬回本地。对端侧工程师的用处一是验证「本地 agent 加本地模型」可行，证明插电压得住在桌面跑得动多 agent；二是 OpenClaw、Hermes、NemoClaw 这套框架思路可迁移，记忆、护栏、多机并联的设计给手机或边缘设备做本地 agent 都能借鉴；三是隐私和成本这条路径走通了，端侧落地同样要面对。\n\n## 局限与未来\n\n没给量化实验，怎么个快法、能并发多少 agent 全靠定性描述。GB10 是高端桌面超算，离真正的手机或 IoT 端侧还差很远，功耗和体积都不是消费级。OpenClaw、Hermes Agent、NemoClaw 是第三方生态，博客没讲联发科自己贡献了多少代码。作者点到了 always-on 智能计算融入日常，但没说怎么从桌面走到手机，隐私也只说本地更安全，没讲本地数据怎么管护。\n", "updated_at": "2026-06-27T03:23:32.334145+00:00"}, {"id": "qwen-code-weekly-voice-workflows-2026-06-25", "run_id": "run-20260627-v5", "title": "Qwen Code Weekly: Token Costs at a Glance, Voice Input, Save and Reuse Workflows", "abstract": "通义千问编程代理本周发布五个版本（v0.18.4至v0.19.2），新增语音输入、动态工作流保存复用、Token成本可视化等能力，超140个PR合并。", "effects": "语音输入支持按键和点击两种模式，转录可用qwen3-asr-flash批量或实时WebSocket流式；工作流可保存为斜杠命令跨项目复用；后台代理可在同会话内复活而无需重建上下文。", "mechanism": "语音通过原生麦克风N-API插件采集，批量模式用OpenAI兼容接口转录，实时模式用WebSocket流式PCM传输并显示部分文本；工作流保存为JS脚本到.qwen/workflows目录，支持项目级和用户级；旧转录按cleanupPeriodDays自动过期。", "paper_url": "https://qwenlm.github.io/qwen-code-docs/en/blog/weekly-update-2026-06-25/", "date": "2026-06-25", "score": 70, "score_relevance": 15, "score_vendor": 22, "score_contribution": 8, "score_quality": 12, "score_recency": 5, "score_open": 8, "score_reason": "Qwen官方技术博客（阿里云大厂）。Qwen Code为开源终端代理工具（GitHub开源），score_open给8分。相关度中等：编程代理工具非纯端侧部署，但Qwen模型广泛用于端侧场景且工具本身本地运行。增量更新创新度中等。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "框架", "keywords": ["Qwen Code", "语音输入", "工作流", "开源代理", "工具调用"], "insight_person": "", "wiki_url": "", "authors": "Qwen Team (Alibaba)", "vendors": "Qwen", "venue": "qwenlm.github.io", "recommendation": "纳入", "detail": "## 研究背景与问题\n\nQwen Code 这周的周报。痛点很实在：以前在终端里写 prompt 全靠打字，长命令、复杂参数、中英混排又慢又容易打错；好不容易跑通一个 workflow，跑完就没了，下次想复用得重写一遍，中途断了也接不上；终端 UI 一堆圆角边框堆成墙，思考块没有专门展开键，扩展和 MCP 还得手改配置。这周就是冲着这几个日常难受的点修。\n\n## 贡献点\n\n这周发了 v0.18.4 到 v0.19.2 五个版本、140 多个 PR，主推三块。一是 /voice 语音输入，按住或点一下说话，转写用 qwen3-asr-flash，快模型顺手清掉口头语和错字。二是 Dynamic Workflows，跑完按 s 存成 slash 命令，断的能在同会话里接着跑。三是 UI 全面瘦身，边框去掉、完成的工具调用折成一行、Alt+T 专管思考块、/extensions 变成交互管理器、MCP 资源能浏览和 @ 补全。另外加了 Artifact 工具把模型输出变成可交互网页、Vision Bridge 让纯文本模型也能看图、/stats 看 token 成本。\n\n## 实现方法\n\n语音这块分两路：批量模式走 OpenAI 兼容的 chat/completions 加 input_audio 接口，实时模式走 WebSocket 流式 PCM 边说边出字，麦克风采集靠 @qwen-code/audio-capture 这个 N-API addon，Linux 没 addon 自动回退 arecord 或 SoX。转写完快模型只删口头语不改原话，超时就直接用原始转写。Workflow 复用是跑完存到 .qwen/workflows 下成 js 脚本，恢复靠 resumeFromRunId 从 JSONL 日志重放，从最长未变前缀续跑到第一个分叉点。Artifact 全部写本地文件用 file:// 打开，内容必须自包含不许外链 CSS/JS，单页 16MB 上限。\n\n## 实验与结果\n\n周报没跑 benchmark，只给了工程指标：这周合并 140 多个 PR、跨五个版本号；语音转写支持批量加实时两条路径；workflow 历史跨重启持久化、旧条目自动清理；子 agent 卡死看门狗自动重试 3 次；Artifact 单页上限 16MB。具体延迟、识别准确率、token 节省量都没量化。未报告具体数据。\n\n## 对端侧 agent 的意义\n\n这周几个点都能往端侧搬。语音输入这条路径最直接：ASR 加快模型清洗的流水线，换上端侧 ASR 和端侧小模型就能在手机或边缘设备上做免打字 agent 交互。Workflow 存盘加断点续跑，端侧 agent 长任务中断恢复是刚需，resumeFromRunId 这套从日志重放、按未变前缀续跑的思路端侧照搬。Artifact 全本地、自包含、走 file://，正好契合端侧不连外网、数据不出端的约束。Vision Bridge 给纯文本模型补视觉，端侧模型多是文本-only，这个桥接思路有用。\n\n## 局限与未来\n\n全是工程功能堆叠，没有评测证明这些改动真提升了效率或准确率。语音依赖云 ASR，离线场景没说怎么降级。Workflow 复用只在本会话能恢复，跨会话或跨设备没提。Artifact 16MB 上限和自包含约束意味着复杂可视化做不了。Vision Bridge 具体怎么把图喂给文本模型、是不是套了个视觉模型转描述，没讲透。未来端侧落地要把 ASR、快模型、日志重放都换成端侧实现，这周没给这条路径的基准。\n", "updated_at": "2026-06-27T03:24:38.670114+00:00"}, {"id": "qwen-code-weekly-agent-team-durable-loop-2026-06-18", "run_id": "run-20260627-v5", "title": "Qwen Code Weekly: Agent Team Parallel Collaboration, Durable /loop Survives Restart, /cd Switch Directory", "abstract": "通义千问编程代理本周发布四个版本（v0.18.0至v0.18.3），新增代理团队并行协作、持久化定时任务、会话内目录切换等能力，超100个PR合并。", "effects": "Agent Team模式让模型创建命名团队并行工作并交换消息共享任务列表；持久化/loop任务可跨重启恢复；Thinking折叠面板和MCP审批门控提升交互体验。", "mechanism": "团队模式下模型生成多个持久化队友（非一次性子代理），队友完成任务后可等待下一个任务；持久化任务按项目保存到~/.qwen/tmp目录的JSON文件，重启时自动恢复并执行一次追赶周期；/cd命令验证目录并迁移会话文件到新工作空间。", "paper_url": "https://qwenlm.github.io/qwen-code-docs/en/blog/weekly-update-2026-06-18/", "date": "2026-06-18", "score": 70, "score_relevance": 15, "score_vendor": 22, "score_contribution": 9, "score_quality": 12, "score_recency": 4, "score_open": 8, "score_reason": "Qwen官方技术博客（阿里云大厂）。Agent Team多代理并行协作架构对端侧多代理系统有参考价值。Qwen Code开源，score_open给8分。相关度中等：编程代理工具非纯端侧，但多代理协作和持久化任务调度对agent架构有启发。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "框架", "keywords": ["多代理协作", "持久化任务", "Qwen Code", "开源代理", "代理调度"], "insight_person": "", "wiki_url": "", "authors": "Qwen Team (Alibaba)", "vendors": "Qwen", "venue": "qwenlm.github.io", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:18:53.796519+00:00"}, {"id": "curator-on-device-llm-agent-memory-2026", "run_id": "run-20260627-v5", "title": "Forget to Improve: On-Device LLM-Agent Continual Learning via Budget-Curated Memory", "abstract": "提出CURATOR系统，用一个净价值每字节分数来管理端侧语言模型代理的经验记忆生命周期，在RAM和能耗预算约束下同时实现记忆裁剪、共享门控和信任门控。", "effects": "在Jetson真实异构测试床（两个机械臂节点和一个枢纽）上，内存减少2.7倍、上行链路减少2.4倍、注入攻击成功率从0.75降到0，任务准确率从0.528提升到0.605。能耗节省36到40个百分点。", "mechanism": "核心思想是让预算充当策展人：每条记忆条目按价值减去危害的每字节净分评分。KEEP决策在RAM和能耗预算下驱逐低价值字节；SHARE决策仅当价值超过上行链路成本时发送洞察；TRUST决策按来源门控对端条目。在事件边界驱动的压缩下实现亚线性上下文增长。", "paper_url": "https://arxiv.org/abs/2606.25115", "date": "2026-06-23", "score": 67, "score_relevance": 28, "score_vendor": 5, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 3, "score_reason": "高度相关：直接针对端侧LLM代理的持续学习和记忆管理，在真实Jetson测试床上验证。创新度高：首次提出净价值每字节的记忆治理统一框架，同时解决内存能耗上行链路和注入安全。作者机构未在arXiv元数据中明确标注，score_vendor保守给5分。论文提及代码将在接受后发布，score_open给3分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["端侧代理", "记忆管理", "持续学习", "安全隐私", "能耗优化"], "insight_person": "", "wiki_url": "", "authors": "Beining Wu; Zihao Ding; Jun Huang; Yanxiao Zhao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:18:53.796519+00:00"}, {"id": "scenic-edge-iot-command-generation-2026", "run_id": "run-20260627-v5", "title": "SCENIC: Semantic-Conditioned Edge-Aware Neural Framework for Structured IoT Command Generation", "abstract": "提出SCENIC端到端框架，面向边缘IoT设备的结构化命令生成任务，覆盖模型架构选择、数据生成、三元组损失微调、剪枝量化到部署导出的完整流程，使用亚0.2B规模Transformer骨干。", "effects": "最强密集解码器在Smart Home Instruct-Bench上达到99.0%的EM@1；剪枝INT8编码器-解码器导出保留91.0%的EM@1和99.0%的EM@5，模型大小减少25.38%；TensorRT在NVIDIA 2:4稀疏编码器上实现1.8倍编码器加速。", "mechanism": "将边缘IoT命令生成建模为多对一结构化输出任务，多条自然语言指令映射到同一规范命令串。采用三元组对比监督微调，对亚0.2B骨干进行剪枝和INT8量化，部署时编码器-解码器架构在高稀疏下保留更强性能。代码和实验制品开源。", "paper_url": "https://arxiv.org/abs/2606.22296", "date": "2026-06-21", "score": 63, "score_relevance": 22, "score_vendor": 5, "score_contribution": 11, "score_quality": 12, "score_recency": 5, "score_open": 8, "score_reason": "相关度较高：直接面向边缘IoT设备的命令生成，使用亚0.2B超小模型，与端侧agent的轻量化部署方向契合。创新度中等偏上：完整端到端流程含剪枝量化和硬件加速评测。代码和实验制品已开源（CC BY 4.0），score_open给8分。作者机构未明确标注，score_vendor保守给5分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "应用", "keywords": ["边缘IoT", "命令生成", "模型压缩", "量化", "智能家居"], "insight_person": "", "wiki_url": "", "authors": "Luke Ztz Hu; Hongbing Lang; Songping Mai", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:18:53.796519+00:00"}, {"id": "swarmx-tencent-agentic-scheduling-2026", "run_id": "run-20260627-v5", "title": "SwarmX: Agentic Scheduling for Low-Latency Agentic Systems", "abstract": "腾讯提出SwarmX，面向低延迟代理式应用的调度系统，通过调度感知的神经预测器捕捉提示词和设备运行时特征，为路由器和缩放器提供尾延迟感知决策，已在近千块GPU和百万核CPU的生产环境部署。", "effects": "在多代理代码生成、深度研究和多模态代理工作流上，尾延迟相比最优调度器降低最高61.5%，在相同SLO下吞吐量达到2倍。128块GPU测试床和大规模生产环境双重验证。", "mechanism": "SwarmX使用调度感知神经预测器捕获提示词、设备、运行时和目标模型特征，将分布预测暴露给路由器和缩放器做尾感知决策，集成到调度器-代理框架中与现有调度和模型服务基础设施对接。", "paper_url": "https://arxiv.org/abs/2606.21401", "date": "2026-06-19", "score": 59, "score_relevance": 15, "score_vendor": 16, "score_contribution": 12, "score_quality": 12, "score_recency": 4, "score_open": 0, "score_reason": "腾讯公司项目，arXiv论文PDF中作者邮箱为tencent.com（elonsu和sarlmolchen），affiliation证据明确。相关度中等：代理调度系统为云端基础设施，非纯端侧部署，但代理式系统编排对端侧多代理架构有间接参考。生产级部署创新度和质量较高。未提及开源。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["代理调度", "低延迟", "腾讯", "多代理系统", "生产部署"], "insight_person": "", "wiki_url": "", "authors": "Yeqi Huang; Yanwei Ye; Guomin Chen; Wenhao Su; Bin Gong; Jialian Li; Zhan Lu; Yangshen Deng; Xuan Sun; Le Xu; Luo Mai", "vendors": "Tencent", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:18:53.796519+00:00"}]};</script>
    <script>
    async function loadPapers() {
      const data = window.__PAPERS__;
      const all = data.papers || [];
      // 按 source_type 分两组；tab 内保持 API 返回顺序（storage 已按 is_major_vendor_official DESC, score DESC 排）
      const academic = all.filter((p) => p.source_type === "学术论文");
      const official = all.filter((p) => p.source_type === "官方技术博客" || p.source_type === "官方产品发布");
      const groups = [
        { id: "academic", papers: academic },
        { id: "official", papers: official }
      ];
      const defaultIdx = groups.findIndex((g) => g.papers.length > 0);
      const activeIdx = defaultIdx === -1 ? 0 : defaultIdx;

      document.querySelector("#count-academic").textContent = String(academic.length);
      document.querySelector("#count-official").textContent = String(official.length);
      document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === activeIdx));

      document.querySelector("#papers").innerHTML = groups.map((g, i) =>
        `<div class="cat-panel${i === activeIdx ? " active" : ""}" data-panel="${g.id}" role="tabpanel">${
          g.papers.map(renderCard).join("") || '<p class="empty">本周无此方向内容</p>'
        }</div>`
      ).join("");

      document.querySelector("#summary").textContent = `${all.length} 条内容 · 官方大厂优先 · 来自服务器最新调研结果`;
    }

    document.querySelector("#tabs").addEventListener("click", (event) => {
      const btn = event.target.closest(".tab");
      if (!btn) return;
      const id = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === id));
      document.querySelectorAll(".cat-panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === id));
    });

    function renderCard(p) {
      const kws = (p.keywords || []).map((k) => `<span class="kw">${escapeHtml(k)}</span>`).join("");
      const vendorsRaw = (p.vendors || '').trim();
      const official = vendorsRaw ? `<span class="vendor-tag">${escapeHtml(vendorsRaw)}</span>` : (p.is_major_vendor_official ? `<span class="vendor-badge">官方大厂</span>` : '');
      const openBadge = (p.score_open || 0) > 0 ? `<span class="open-badge">开源</span>` : '';
      return `
      <div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-head">
          <span class="score">${p.score}</span>
          ${official}
          ${openBadge}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        <div class="keywords">${kws}</div>
        <div class="field"><span class="label">论文摘要</span><span class="text">${escapeHtml(p.abstract)}</span></div>
        <div class="field"><span class="label">论文效果</span><span class="text">${escapeHtml(p.effects)}</span></div>
        <div class="field"><span class="label">工作原理</span><span class="text">${escapeHtml(p.mechanism)}</span></div>
        <div class="score-reason">评分依据：${escapeHtml(p.score_reason || "")}</div>
        <div class="score-dims">契合${p.score_relevance ?? ''}·厂商${p.score_vendor ?? ''}·贡献${p.score_contribution ?? ''}·质量${p.score_quality ?? ''}·时效${p.score_recency ?? ''}·开源${p.score_open ?? ''}</div>
        <div class="card-foot">
          <input name="insight_person" value="${escapeAttr(p.insight_person || "")}" placeholder="洞察人">
          <input name="wiki_url" value="${escapeAttr(p.wiki_url || "")}" placeholder="wiki 链接">
          <button type="button" data-action="save">保存</button>
        </div>
      </div>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      const card = button.closest(".card");
      await fetch("/api/insights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paper_id: card.dataset.id,
          insight_person: card.querySelector('[name="insight_person"]').value,
          wiki_url: card.querySelector('[name="wiki_url"]').value
        })
      });
      button.textContent = "已保存";
    });

    loadPapers().catch((error) => {
      document.querySelector("#summary").textContent = `读取失败：${error}`;
    });
  </script>
</body>
