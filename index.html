  <script>window.__PAPERS__ = {"papers": [{"id": "mediatek-dgx-spark-agents-2026", "run_id": "run-20260626-v4", "title": "Running AI Agents Locally on DGX Spark", "abstract": "介绍 MediaTek 与 NVIDIA 联合设计的 GB10 Grace Blackwell 芯片如何让用户在桌面级设备 DGX Spark 上本地跑 AI agent，不用上云就能获得更快响应和更好隐私。", "effects": "未报告", "mechanism": "DGX Spark 基于 GB10 Grace Blackwell Superchip，结合 MediaTek 的 CPU 性能和功耗效率与 NVIDIA 的加速计算，支持 1 PFLOP FP4 算力，可本地运行 OpenClaw 和 Hermes Agent 等助手，重计算留在本地、按需连云。", "paper_url": "https://www.mediatek.com/tek-talk-blogs/running-ai-agents-locally-on-dgx-spark", "date": "2026-06-24", "score": 67, "score_relevance": 22, "score_vendor": 23, "score_contribution": 7, "score_quality": 10, "score_recency": 5, "score_open": 0, "score_reason": "MediaTek 官方技术博客，介绍端侧本地运行 AI agent 的硬件平台，大厂官方给 vendor 最高分；但属产品宣传非深度技术创新，contribution 和 quality 中等。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "应用", "keywords": ["端侧部署", "AI智能体", "NPU", "本地推理", "MediaTek"], "insight_person": "", "wiki_url": "", "authors": "PD Rajput", "vendors": "MediaTek", "venue": "MediaTek Tek Talk Blog", "recommendation": "纳入", "detail": "## 研究背景与问题\n\nAgentic AI 正在把 AI 从「人去用」变成「替你干活」。以前每次都得手动喊一声聊天机器人，现在用户想要的是能自己盯着流程、收件箱、抓新闻、整理资料、并主动提醒的自主 agent。问题在于这类 agent 通常要靠云端跑，一来隐私没保障，二来按 token 计费成本高，三来断网就停。联发科这篇博客就是回应这个缺口：怎么把这种 agent 放到桌上一台个人 AI 超级计算机里本地跑，让普通人也能用上。\n\n## 贡献点\n\n这篇是产品+生态层面的官方介绍，不是学术论文，所以贡献更偏工程落地。第一，明确把 DGX Spark 定位成「跑本地 agent 的个人 AI 超算」，把 agentic AI 这个概念和具体硬件绑死，给开发者一个能直接上手的平台。第二，点出三个配套工具：OpenClaw 用来搭和跑 agent，Hermes Agent 是会随用户使用自我改进的助手，NemoClaw 给 agent 加行为护栏、管数据、管本地/云端模型连接。第三，强调 GB10 Grace Blackwell 超级芯片是联发科和 NVIDIA 联合设计，把联发科的 CPU 能效和 NVIDIA 的加速计算揉到一起。\n\n## 实现方法\n\nDGX Spark 是一台桌面大小的盒子，插墙上电就能跑，核心是 GB10 Grace Blackwell 超级芯片，联发科负责 CPU 性能和能效部分，NVIDIA 负责加速计算。系统支持高并发，能同时跑多个 agent；多个 Spark 节点还能连起来并行做推理共享。软件侧，OpenClaw 这类开源框架负责 agent 编排，用户从手机、平板、笔记本远程监控，重活留在本地 Spark 上，需要更大规模或专有服务时再连云端。NemoClaw 在外层管护栏：agent 怎么行为、数据怎么处理、连本地还是云端模型。\n\n## 实验与结果\n\n博客是产品宣传稿，没有跑 benchmark 给具体数字。唯一给的硬指标是单机最高 1 petaflop 的 FP4 AI 性能，并强调能效高到能插普通墙上插座。没有给出 agent 并发数、延迟、内存占用这类实测数据。属于产品定位说明，不是性能评测。\n\n## 对端侧 agent 的意义\n\n这篇对端侧 agent 工程师的意义有两个层面。一是它把「端侧 agent」从手机/IoT 这种窄场景，扩展到「桌面个人超算」这一档，给本地跑高并发多 agent 提供了硬件载体。二是它把隐私、成本、可控性这三件事直接摆到台面：本地跑就不上传数据、不按 token 付费、断网也能用。这对端侧 agent 的产品化方向是个明确信号：能效和本地化是卖点，不是妥协。另外 OpenClaw/Hermes/NemoClaw 这套组合可以作为端侧 agent 工程师参考的编排+护栏范式。\n\n## 局限与未来\n\n第一，没有量化性能数据，1 petaflop 是峰值规格，实际 agent 跑起来吞吐、延迟、能效比都没给。第二，OpenClaw、Hermes Agent、NemoClaw 这些是产品名，博客没讲它们的具体架构、记忆机制、工具调用方式，工程参考价值有限。第三，一台 DGX Spark 是桌面设备，并没有真正解决手机/IoT 这类严格端侧设备上跑 agent 的问题，只是把云端算力搬到桌面。第四，作者没提本地 agent 的安全风险和护栏细节，NemoClaw 只提了名字没讲机制。未来值得看联发科怎么把这种能力下放到手机芯片（Dimensity 这条线）上。", "updated_at": "2026-06-27T02:28:23.662175+00:00"}, {"id": "vec-lut-tsinghua-mobisys2026", "run_id": "run-20260626-v4", "title": "Vec-LUT: Vector Table Lookup for Parallel Ultra-Low-Bit LLM Inference on Edge Devices", "abstract": "解决超低比特大模型在端侧纯 CPU 上查表推理太慢的问题。把逐 token 的标量查表改成跨 token 的向量查表，一次查表搞定多个 token，让 1.58 比特大模型在 CPU 上跑得比 NPU 方案还快。", "effects": "5 台端侧设备上 4.2 倍加速、2.1 倍节能；骁龙 8 Elite 上 2 核 CPU 超过 NPU 方案 1.1 倍；已集成进 llama.cpp。", "mechanism": "提出向量 LUT 范式：跨并行 token 构建统一查表、单次 1 到 N 查询；配合向量 LUT 专属张量布局和缓存感知流式查表，把随机查表变成连续向量加法。", "paper_url": "https://arxiv.org/abs/2512.06443", "date": "2026-06-22", "score": 78, "score_relevance": 29, "score_vendor": 8, "score_contribution": 14, "score_quality": 14, "score_recency": 5, "score_open": 8, "score_reason": "清华 AIR 学校项目，MobiSys 2026 顶会，直击端侧超低比特 LLM 推理的并行查表瓶颈，4.2 倍加速贡献突出；已集成 llama.cpp 开源，score_open 高分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["端侧推理", "超低比特量化", "查表加速", "LLM部署", "NPU"], "insight_person": "", "wiki_url": "", "authors": "Xiangyu Li; Chengyu Yin; Weijun Wang; Jianyu Wei; Ting Cao; Yunxin Liu", "vendors": "Tsinghua AIR", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n端侧跑大模型已经被量化推到 4 比特、2 比特甚至 1.58 比特这种超低比特档位。配合查表（LUT）推理，CPU 跑这些超低比特模型甚至比专用 NPU 还快，让本地大模型看起来很有希望。但有一个被忽略的瓶颈：当需要并行推理时（比如 prefill 阶段一次处理多个 token、test-time scaling 同时生成多条候选、多 token 场景），LUT 推理吃不满内存带宽，速度上不去。根因在于传统 LUT 是标量范式，每个 token 都要重复做非连续内存访问，token 一多就把内存总线堵死。\n\n## 贡献点\n\n核心贡献是提出 Vec-LUT，一种面向并行 token 的向量查表范式。第一，把原来「每个 token 各自查一次表」改成「跨并行 token 构建一张统一 LUT，每个索引只做一次 1 到 N 的查表」，从根上消除重复访问。第二，配套两项实现技术：Vector LUT-Centric Tensor Layout 重新排张量布局让查表对齐，Cache-Aware Streamed Lookup 让访问顺序贴着缓存走、减少 miss。这两点合起来让超低比特 LLM 在并行场景下也能吃满带宽。\n\n## 实现方法\n\n输入是一批要并行处理的 token，流程大致是：先把这批 token 的索引聚合起来，构建一张覆盖整批的统一 LUT，然后对每个索引位置只做一次 1 到 N 的批量查表，一次性把多个 token 的结果取出来。关键在于张量布局按查表顺序重排，让连续访问落在连续缓存行上；查表过程被组织成流式，按缓存粒度推进，避免反复扫同一块内存。这样把原来 N 次 scalar 查表压成 1 次 vector 查表，访存次数和带宽利用都变好。\n\n## 实验与结果\n\n在 5 种端侧设备上、跨 3 个 LLM 做评测，对比当下最强基线，Vec-LUT 最高取得 4.2 倍加速。摘要没给具体设备型号、模型名、绝对延迟或能耗数字，只突出相对加速比。代码已开源（摘要里指向两个 URL）。整体属于工程性强、有实测、可复现的工作。\n\n## 对端侧 agent 的意义\n\n端侧 agent 跑起来要预填长上下文、要做 test-time 推理扩展、要多候选并行生成，这些都是多 token 并行场景。而当前超低比特 LUT 推理在单 token 生成上很快，一上并行就掉链子，正好卡住 agent 的咽喉。Vec-LUT 直接修的就是这条链路：让 agent 的 prefill 和多路采样不再被 LUT 访存拖累。对端侧 agent 工程师来说，这是把本地小模型从「能聊天」推进到「能跑 agent 工作流」的关键一环，而且代码开源可以直接接。\n\n## 局限与未来\n\n第一，4.2 倍是相对基线的峰值，摘要没给绝对吞吐和延迟，也看不出在不同 batch 大小下的稳定性。第二，只测了 5 种设备和 3 个模型，泛化到更多硬件（尤其手机 NPU、DSP）还不确定。第三，Vec-LUT 优化的是并行 prefill/采样，对单 token 自回归生成这种 scalar 场景帮助有限，得和别的 kernel 一起用。第四，作者没提精度损失——1.58 比特本身质量已经掉，叠加并行查表会不会再掉，需要看正文。未来值得把它和 agent 框架端到端联测，看实际 agent 任务延迟降多少。", "updated_at": "2026-06-27T02:29:27.860383+00:00"}, {"id": "timelyllm-yale-mobisys2026", "run_id": "run-20260626-v4", "title": "TimelyLLM: Time-sensitive LLM Serving System for Physical-I/O Limited Agents", "abstract": "解决 LLM 给机器人和语音助手做 agent 时生成速度和物理执行速度不匹配的问题。不是一次生成完整计划，而是分段生成、执行一段再生成下一段，把空闲算力让给其他请求。", "effects": "时间效用提升约 1.5 倍，等待时间减少 84%，在多机器人场景验证有效。", "mechanism": "提出分段生成：把 LLM 输出切成可执行的小段，生成一段就暂停、让 agent 去执行；配合松弛感知调度器，按紧急程度决定何时恢复生成，把空闲算力分配给其他请求。", "paper_url": "https://arxiv.org/abs/2412.18695", "date": "2026-06-22", "score": 69, "score_relevance": 28, "score_vendor": 8, "score_contribution": 14, "score_quality": 14, "score_recency": 5, "score_open": 0, "score_reason": "耶鲁大学学校项目，MobiSys 2026 最佳论文亚军，解决端侧 agent 的 LLM 推理与物理执行速度不匹配问题，对机器人、语音助手等物理 I/O 受限 agent 高度相关；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["LLM推理", "端侧部署", "机器人agent", "调度系统", "延迟优化"], "insight_person": "", "wiki_url": "", "authors": "Neiwen Ling; Guojun Chen; Anurag Khandelwal; Lin Zhong", "vendors": "Yale University", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n像 GPT-4、Llama3 这种大模型已经能听懂复杂指令，越来越多被用来控制无人机和机器人干活。但问题来了：现在给大模型做推理服务的系统都是按先来先服务（FCFS）批量处理的，这种调度对聊天没问题，对机器人就致命——机器人任务是时间敏感的，晚了 0.5 秒可能就撞墙或错过窗口。FCFS 不会管你这个请求急不急，先排到就先服务，于是机器人的硬实时需求和大模型服务的批处理思维对不上。这篇就是要解决这个错配。\n\n## 贡献点\n\n核心贡献有两条。第一，提出 segmented generation（分段生成），把机器人任务的 LLM 输出按执行粒度切成段，让生成和执行可以交错，而不是等整段 plan 全吐完机器人才动。第二，设计了一套专门面向多机器人 agent 的调度机制，关键洞察是「plan 生成阶段和执行阶段之间有冗余时间」——机器人在执行前一段时，系统可以提前生成下一段，从而把等待藏进执行时间里。这两点合起来让 serving 系统第一次真正照顾到时间敏感性。\n\n## 实现方法\n\n实现上把 TimelyLLM 嫁接到一个主流 LLM serving 框架上（摘要没点名是哪个）。流程大致是：机器人请求进来后不是进 FCFS 队列，而是按时间紧迫度排序；生成阶段被切成段，每段生成完就交给执行端，同时调度器判断下一段该在什么时候开始生成才能赶上执行节奏，把生成时间和执行时间重叠起来。调度还要处理多 agent 之间的抢占和优先级，保证急任务不被慢任务堵住。\n\n## 实验与结果\n\n在一组机器人应用上评测。关键数字两个：time utility（时间效用，反映任务按时完成的程度）提升到 1.97 倍；整体等待时间下降 84%。这两个指标都直击时间敏感性痛点。摘要没给具体硬件、模型规模、机器人平台或绝对延迟数字，也没有和特定基线系统点名对比。\n\n## 对端侧 agent 的意义\n\n这篇虽然场景是机器人，但对端侧 agent 工程师很有借鉴价值。端侧 agent（手机、可穿戴、IoT 上的 agent）越来越多要管物理 I/O 和时间敏感任务——闹钟、提醒、传感器响应、交互式操作，这些都不是「慢慢排队」能搞定的。TimelyLLM 的分段生成+执行重叠思路可以直接迁移：本地 agent 一边生成计划一边执行上一步，把推理延迟藏进动作时间里。这对资源紧张、又要实时响应的端侧 agent 是一种很有用的调度范式，比单纯堆算力或砍模型更聪明。\n\n## 局限与未来\n\n第一，实验只给相对指标（1.97x、84%），没给绝对延迟和硬件配置，难以判断在真实机器人负载下能不能达标。第二，分段生成依赖任务可以被自然切成段，对那些必须一次性输出完整 plan 才能执行的任务可能不适用。第三，摘要没提多 agent 之间抢占会不会饿死低优先级任务，调度公平性存疑。第四，实现嫁接在「主流框架」上但没点名，复现门槛不清。未来值得看这套调度放到端侧芯片（手机 SoC）上、面对多 agent 抢同一个本地推理资源时表现如何。", "updated_at": "2026-06-27T02:30:06.847190+00:00"}, {"id": "agent-x-kaist-mobisys2026", "run_id": "run-20260626-v4", "title": "Agent-X: Full Pipeline Acceleration of On-device AI Agents", "abstract": "解决端侧 AI agent 推理延迟高的问题。系统分析 agent 工作流的 prefill 和 decode 两个瓶颈，分别用 prompt 重写利用前缀缓存、和无需额外 LLM 的轻量投机解码来加速，全流程不损失精度。", "effects": "prefill 加速 1.97 倍，decode 加速 1.73 倍，端到端任务延迟改善 1.61 倍，精度无损；集成 Apple MLX-LM 和 TinyAgent 实测。", "mechanism": "PromptWeaver 动态重组输入 prompt 利用前缀缓存加速 prefill；ExSpec 用轻量 prompt 感知 draft 模型做投机解码加速 decode，无需额外 LLM，适合端侧资源受限环境。", "paper_url": "https://arxiv.org/abs/2605.10380", "date": "2026-06-22", "score": 68, "score_relevance": 29, "score_vendor": 8, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "KAIST 学校项目，MobiSys 2026 顶会，直击端侧 AI agent 全流水线加速，prefill 和 decode 双阶段优化创新度高；但未明确开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["端侧部署", "推理加速", "前缀缓存", "投机解码", "AI智能体"], "insight_person": "", "wiki_url": "", "authors": "Jinha Chung; Byeongjun Shin; Jiin Kim; Minsoo Rhu", "vendors": "KAIST", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n基于大模型的 agent 在各种任务上表现最好，但一到端侧设备上跑，端到端延迟就高得难受。问题不是单个环节慢，而是 prefill（预填）和 decode（逐 token 生成）两个阶段叠加起来慢。再加上 agent 工作流的输入 token 有自己的特殊模式——长上下文、重复模板、工具调用前缀——这些模式如果被忽视，缓存和生成都吃不到红利。作者指出，之前没有人系统地把端侧 agent 的延迟瓶颈拆开看、再一个个消掉，这是这篇要填的坑。\n\n## 贡献点\n\n两个核心组件，都是纯软件、不碰硬件、不丢精度。第一，针对 agent 输入 token 模式重写 prompt，让前缀缓存（prefix caching）真正吃得上 agent 那些重复出现的结构化前缀，把 prefill 阶段的重复计算压掉。第二，提出 LLM-free 投机解码：用一个不用大模型本身的轻量途径生成候选 token，再由大模型验证，用最小开销换取 decode 阶段的加速。两者合起来覆盖 prefill 和 decode 全流程，并且能无缝塞进现有端侧 agent 框架。作者自称是第一个系统刻画并消除端侧 agent 延迟瓶颈的工作。\n\n## 实现方法\n\n实现走纯软件路径。Prompt 重写那部分分析 agent 工作流里反复出现的输入模式（比如系统提示、工具描述、固定指令段），把这些段提前排进前缀缓存，新请求进来时尽量复用缓存而不是重新 prefill。LLM-free 投机解码那部分用一个不依赖主大模型的轻量生成器产出候选 token 流，主模型只负责验证接受或拒绝，避免每一步都让大模型从头生成。两个组件衔接上现有 on-device agent 框架，不需要改硬件或量化模型。\n\n## 实验与结果\n\n在一组代表性 agent 工作负载上测，端到端 1.61 倍加速，精度无损失。摘要明确强调「real systems」（真实系统而非模拟）和「no accuracy loss」，并能无缝集成进现有端侧 agent。没给具体硬件型号、模型规模、prefill 和 decode 各自的分解加速比，只给总加速。\n\n## 对端侧 agent 的意义\n\n这篇直接冲着端侧 agent 工程师的痛点来。端侧 agent 跑得慢，瓶颈不在模型本身，而在 prefill 和 decode 的全流程叠加；Agent-X 给的是一套不改硬件、不缩模型、不丢精度的纯软件加速方案，而且针对 agent 特有的输入模式定制。对落地来说，这意味着现有端侧 agent 框架可以低改动接入获得 1.61x 提速。特别是「LLM-free 投机解码」这点对端侧很友好——端侧算力本来就紧，用轻量途径生成候选、主模型只做验证，是端侧少有的能负担得起的投机解码形式。\n\n## 局限与未来\n\n第一，1.61x 是平均加速，没拆开 prefill 和 decode 各贡献多少，也看不出在长上下文、多工具调用等重场景下是否还稳。第二，LLM-free 投机解码的「轻量生成器」具体是什么、命中率多少、拒绝率多高，摘要没说，这决定了实际收益。第三，prompt 重写依赖 agent 输入有稳定前缀模式，对那些 prompt 高度动态、每次都变的 agent 任务帮助有限。第四，纯软件方案的天花板受硬件带宽限制，叠不叠得上 Vec-LUT 这类访存优化没探讨。未来值得看它和端侧超低比特量化、并行 LUT 推理叠起来的复合效果。", "updated_at": "2026-06-27T02:30:53.182260+00:00"}, {"id": "swarmx-tencent-2026", "run_id": "run-20260626-v4", "title": "SwarmX: Agentic Scheduling for Low-Latency Agentic Systems", "abstract": "解决 agentic AI 应用在 GPU-CPU 集群上调度难的问题。agent 应用的推理时间和模型调用结构依赖 prompt 语义，传统调度不适用。用神经网络预测器捕获 prompt、设备、运行时和目标模型特征，给路由和扩缩容做尾延迟感知决策。", "effects": "尾延迟降低 61.5%，吞吐量达生产调度器的 2 倍，在生产环境（近千 GPU、百万 CPU 核）和 128-GPU 测试床验证。", "mechanism": "调度专用神经网络预测器捕获 prompt 和设备特征，暴露分布预测给路由和扩缩容做尾延迟感知决策；集成调度器-agent 框架，支持在线自适应和与现有调度基础设施对接。", "paper_url": "https://arxiv.org/abs/2606.21401", "date": "2026-06-20", "score": 66, "score_relevance": 18, "score_vendor": 17, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "腾讯公司项目（作者邮箱 deargong@tencent.com、sarlmolchen@tencent.com 确认 affiliation，arXiv PDF 通讯页），agentic AI 低延迟调度系统，生产环境千 GPU 部署验证；但属云端集群调度非端侧，relevance 中等，按公司项目给 vendor 高分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["调度系统", "agentic AI", "低延迟", "集群调度", "Tencent"], "insight_person": "", "wiki_url": "", "authors": "Yeqi Huang; Yanwei Ye; Guomin Chen; Wenhao Su; Bin Gong; Jialian Li; Zhan Lu; Yangshen Deng; Xuan Sun; Le Xu; Luo Mai", "vendors": "Tencent", "venue": "arXiv", "recommendation": "纳入", "detail": "## 研究背景与问题\n\nAgentic AI 应用把多次模型调用和工具执行串起来跑，给 GPU-CPU 集群的调度出了新难题。难点在于：agent 的推理时长和调用结构往往取决于 prompt 的语义内容——同样一个请求，不同 prompt 拆出来的模型调用次数、工具链路、耗时都不一样。传统调度器是按固定资源画像或先来先服务排的，根本预测不了这种语义驱动的动态调用图，结果就是尾延迟高、SLO 守不住。这篇要解决的就是「怎么给语义驱动的 agentic 负载做低延迟调度」。\n\n## 贡献点\n\n贡献有三层。第一，引入调度专用的神经网络预测器，输入特征覆盖 prompt、设备、runtime、目标模型四个维度，能预测 agentic 调用的耗时分布，而不是只给一个点估计。第二，把分布式预测暴露给 router 和 scaler，让它们做 tail-aware（尾延迟感知）的决策，而不是只看均值。第三，提供预测器的训练和在线自适应机制，并把这些组件塞进一个 scheduler-agent 框架，作为和现有调度/模型服务基础设施集成公共底座。整体是把「语义感知」第一次系统化塞进集群调度。\n\n## 实现方法\n\n实现上，预测器是一个神经网络，吃 prompt 特征、设备特征、runtime 特征、目标模型特征，吐出该 agentic 调用耗时的分布预测。这个分布被传给 router（决定请求路由到哪个模型/设备）和 scaler（决定扩缩容），两者都用分布的尾部分位做决策，从而显式压尾延迟。预测器有离线训练流程，也有在线自适应机制应对分布漂移。整套东西包在 scheduler-agent 框架里，对外提供统一接口，能挂在现有调度器和服务框架旁边跑，不需要推倒重来。\n\n## 实验与结果\n\n评测分两块。一是真实生产部署，规模近 1000 块 GPU 和 100 万 CPU 核；二是受控实验，128 GPU 测试床。负载覆盖三类 agent 工作流：多 agent 代码生成、深度研究、多模态 agentic 流程。结果：相对最强基线调度器，尾延迟最高降 61.5%；在相同 SLO 下，吞吐达到生产调度器的 2 倍。数字很硬，而且是在真实生产规模上测的，不是玩具。\n\n## 对端侧 agent 的意义\n\n这篇严格说是集群/cloud 侧调度工作，不是手机/IoT 端侧，但对端侧 agent 仍有借鉴价值。端侧 agent 越来越多走「本地小模型 + 云端大模型」混合架构，本地和云之间的请求调度同样面临语义驱动的动态调用图——同一个 agent 任务，不同 prompt 拆出来的本地/云调用比例和顺序都不一样。SwarmX 的「prompt 特征驱动的耗时分布预测」+「尾延迟感知路由」这套思路，可以缩到端云协同调度上：端侧决定哪些步本地跑、哪些甩云端时，用类似预测器估耗时和尾延迟，避免某一步卡死整个 agent 流程。对做端云混合 agent 框架的工程师是直接可借鉴的范式。\n\n## 局限与未来\n\n第一，方案重，神经网络预测器+在线自适应+scheduler-agent 框架，端侧这种资源紧张的环境直接搬不动，需要轻量化。第二，生产部署规模虽大，但摘要没说是哪家公司的生产环境、什么负载比例，复现和公平对比难度高。第三，尾延迟降 61.5% 是相对 SOTA 调度器，但绝对尾延迟数字没给，看不出实际 SLO 守得怎么样。第四，预测器依赖 prompt 特征，对全新类型 agent 工作流的冷启动表现没讨论。未来值得看这套预测器能不能蒸馏成轻量版、放到端侧做本地/云路由决策。", "updated_at": "2026-06-27T02:31:40.071187+00:00"}, {"id": "scaling-mobile-agent-mobisys2026", "run_id": "run-20260626-v4", "title": "Scaling Mobile Agent Systems: From Capability Density to Collective Intelligence", "abstract": "提出手机 agent 系统的扩展路线图：一边提升单个 agent 的能力密度（更小更强），一边让多 agent 协作形成集体智能，两端一起发力才能规模化。", "effects": "未报告", "mechanism": "沿两个维度提出统一框架：一是用紧凑基础模型设计和压缩提升单个 agent 的能力密度；二是用通信丰富的多 agent 协作实现跨设备集体智能。两维度互补，高效单点部署加上协作解锁系统级智能。", "paper_url": "https://arxiv.org/abs/2605.08124", "date": "2026-06-22", "score": 64, "score_relevance": 26, "score_vendor": 7, "score_contribution": 14, "score_quality": 12, "score_recency": 5, "score_open": 0, "score_reason": "MobiSys 2026 顶会论文，直接讨论手机 agent 系统在端侧的规模化路线图，主题高度契合端侧 agent；但属愿景立场论文，无量化实验，贡献度中等；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["手机agent", "能力密度", "多智能体协作", "端侧部署", "规模化"], "insight_person": "", "wiki_url": "", "authors": "Bowei He", "vendors": "", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n移动 agent 系统正成为端侧和 AIoT 生态里跑智能应用的关键范式。但它的可扩展性被两件事卡死：一是单设备算力本来就有限，二是不同设备上的智能是碎片化的——每个设备各跑各的 agent，彼此不通信、不协作，算力和知识都用不起来。结果是移动 agent 既做不大（单机能力上不去），也做不强（多机凑不成合力）。这篇要回应的就是「怎么把孤立移动 agent 扩展成一个真正分布式、高效、可扩展的智能系统」。\n\n## 贡献点\n\n这是一篇研究议程（agenda）论文，贡献在于提出统一的两维度扩展框架。第一维度是单 agent 的能力密度（capability density）：通过紧凑基础模型设计和模型压缩，让单个 agent 在固定算力下能干更多事，把「每比特算力的智能」往上推。第二维度是集体智能（collective intelligence）：通过通信密集的多 agent 协作，让多个设备上的 agent 凑成分布式智能体，把碎片化智能拼成整体。作者把这两条线统一在一个研究愿景下，给移动 agent 的扩展指了路线。\n\n## 实现方法\n\n作为议程论文，没有给出具体系统实现，但勾勒了技术路线。单 agent 这条线依赖紧凑基础模型设计（更小参数量更高效率的底座）和压缩（量化、剪枝、蒸馏这类手段），把模型塞进端侧受限算力。多 agent 这条线依赖通信密集的协作机制——设备之间通过高效通信协议共享状态、分工任务、聚合结果。两条线在「分布式智能系统」这个目标上汇合：单个 agent 能力密度够高才有余力做通信和协作，集体智能反过来让单个弱 agent 凑成强系统。\n\n## 实验与结果\n\n未报告具体数据。这篇是愿景/议程论文，没有跑实验、没有 benchmark、没有量化对比。作者基于近期模型和基础设施的进展来论证这两条路线的可行性，但本身不提供实测数据。\n\n## 对端侧 agent 的意义\n\n这篇对端侧 agent 工程师是路线图层面的参考。它把端侧 agent 的扩展问题拆成「单机能力密度」和「多机集体智能」两条线，比泛泛说「端侧 agent 要扩展」清楚得多。实际工程中，端侧 agent 团队常常纠结是堆单机算力还是做设备协同，这篇给出的框架就是用来理清这个决策的：紧凑模型+压缩是单机侧的硬功夫，多 agent 通信协作是系统侧的软功夫，两边要一起推。对做 AIoT 多设备 agent 协同、边缘集群 agent 框架的团队尤其有方向价值。\n\n## 局限与未来\n\n第一，议程论文没有实测，两条路线的可行性和代价只能靠近期其他工作背书，本身不证。第二，「通信密集多 agent 协作」在端侧带宽和能耗受限下到底可不可行，作者没讨论通信成本这个硬约束。第三，单作者论文，视角单一，没有给出具体协作协议、压缩方案或评测基准的设计。第四，能力密度和集体智能之间怎么权衡（算力该投单机还是投通信）没量化。未来值得看作者或社区把这个议程落成具体系统，给出端侧多 agent 协同的实测基准。", "updated_at": "2026-06-27T02:32:22.408217+00:00"}, {"id": "kvswap-leeds-mobisys2026", "run_id": "run-20260626-v4", "title": "KVSwap: Disk-aware KV Cache Offloading for Long-Context On-device Inference", "abstract": "解决端侧跑长上下文大模型时内存不够的问题。把 KV 缓存放到磁盘上，用紧凑内存元数据预测哪些条目要预加载，计算和磁盘读取重叠执行，在不牺牲生成质量前提下突破内存墙。", "effects": "在紧内存预算下比现有 KV 缓存卸载方案吞吐更高且生成质量不降；在多种端侧设备和存储类型上验证有效。", "mechanism": "把完整 KV 缓存存磁盘，内存只留紧凑元数据预测未来访问；计算与硬件感知磁盘传输重叠；读模式匹配存储设备特性（NVMe、UFS、eMMC），减少读放大。", "paper_url": "https://arxiv.org/abs/2511.11907", "date": "2026-06-22", "score": 62, "score_relevance": 22, "score_vendor": 7, "score_contribution": 15, "score_quality": 13, "score_recency": 5, "score_open": 0, "score_reason": "利兹大学学校项目，MobiSys 2026 顶会，直击端侧长上下文 LLM 推理的内存墙问题，磁盘卸载 KV 缓存是端侧 agent 长任务的基础设施能力；未开源故 score_open 为 0。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["KV缓存", "端侧推理", "长上下文", "内存优化", "磁盘卸载"], "insight_person": "", "wiki_url": "", "authors": "Huawei Zhang; Chunwei Xia; Zheng Wang", "vendors": "University of Leeds", "venue": "MobiSys 2026", "recommendation": "纳入", "detail": "## 研究背景与问题\n\n端侧本地跑大模型有隐私、离线、低成本三大好处，但一旦任务变成长上下文——比如会议纪要、视频摘要、长文档分析，常常还要一次处理多条长输入——KV cache 会随上下文长度和 batch 大小线性膨胀，很快把端侧那点内存撑爆。现有的 KV cache offload 方案都是为 GPU→CPU 内存搬运设计的，但端侧的 CPU、GPU、NPU 往往共享同一块统一内存，根本没有独立 CPU 内存可以搬；而端侧的磁盘（闪存）I/O 带宽又很有限，直接套桌面机那套 offload 思路根本跑不动。这就是 KVSwap 要解决的硬约束。\n\n## 贡献点\n\n贡献是把 KV cache offload 重新设计成「磁盘感知」的端侧专属方案。第一，全 cache 落盘，内存里只留高压缩的元数据用来预测哪些条目接下来要用、该提前预取，把内存占用从「整个 cache」压到「少量元数据」。第二，计算和磁盘访问做硬件感知重叠，趁模型算的时候把下一批 cache 从盘读到内存。第三，读模式按存储设备特性编排，匹配闪存的随机/顺序读性能差异。整体把端侧原本没法用的磁盘，变成能撑长上下文的二级 KV 存储。\n\n## 实现方法\n\n流程大致是：KV cache 不再全部驻留内存，而是整体写到磁盘；内存里维护一份紧凑的元数据索引，记录每段 cache 何时被用、按预测模型判断哪些段在接下来的生成里会被访问，提前发起磁盘预取。预取和当前 token 的计算重叠——当前层在算的时候，下一层的 cache 已经在从盘往内存搬。读模式按存储设备特性重排，比如把随机小读合并成顺序大读，匹配闪存的顺序带宽优势。这样把磁盘的慢 I/O 藏进计算时间里，让端侧在内存预算极紧的情况下还能跑长上下文。\n\n## 实验与结果\n\n在一组代表性大模型和多种存储类型上评测。结果：在紧内存预算下，KVSwap 比现有 KV cache offload 方案吞吐更高，同时保持生成质量不退化。摘要没给具体吞吐数字、加速比、设备型号或上下文长度，只给相对定性结论。整体属于系统实测类工作，但定量数据在正文。\n\n## 对端侧 agent 的意义\n\n这篇对端侧 agent 工程师是直接可用的。端侧 agent 跑长程任务（多轮对话、长文档处理、多工具调用累积上下文）最怕的就是 KV cache 撑爆内存，而现在手机/IoT 的内存就那么大。KVSwap 给的是一条「用磁盘换内存」的路径，而且针对端侧统一内存+闪存带宽有限的现实做了适配，不是桌面方案的硬搬。对做端侧长上下文 agent 的团队来说，这意味着不必砍上下文长度、不必频繁重算前缀，可以把历史 KV 落盘、按需预取，端侧也能撑住长程 agent 工作流。这套机制和前缀缓存、投机解码这些技术是互补的，可以叠用。\n\n## 局限与未来\n\n第一，磁盘 I/O 再怎么重叠也有上限，当 cache 预取命中率低、或计算时间短于读盘时间时，吞吐会掉，摘要没给最坏场景。第二，预取依赖元数据预测模型，预测不准会触发大量无效读，反而拖累 I/O，预测器的鲁棒性没讨论。第三，闪存寿命有限，KV cache 频繁写盘会磨损，端侧设备这点摘要完全没提，工程上是个隐患。第四，没给绝对吞吐和延迟数字，难以横向对比其他长上下文方案（如滑动窗口、重计算）。未来值得看 KVSwap 在真实端侧 agent 多轮任务下的端到端延迟和闪存磨损实测。", "updated_at": "2026-06-27T02:33:19.382017+00:00"}]};</script>
    <script>
    async function loadPapers() {
      const data = window.__PAPERS__;
      const all = data.papers || [];
      // 按 source_type 分两组；tab 内保持 API 返回顺序（storage 已按 is_major_vendor_official DESC, score DESC 排）
      const academic = all.filter((p) => p.source_type === "学术论文");
      const official = all.filter((p) => p.source_type === "官方技术博客" || p.source_type === "官方产品发布");
      const groups = [
        { id: "academic", papers: academic },
        { id: "official", papers: official }
      ];
      const defaultIdx = groups.findIndex((g) => g.papers.length > 0);
      const activeIdx = defaultIdx === -1 ? 0 : defaultIdx;

      document.querySelector("#count-academic").textContent = String(academic.length);
      document.querySelector("#count-official").textContent = String(official.length);
      document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === activeIdx));

      document.querySelector("#papers").innerHTML = groups.map((g, i) =>
        `<div class="cat-panel${i === activeIdx ? " active" : ""}" data-panel="${g.id}" role="tabpanel">${
          g.papers.map(renderCard).join("") || '<p class="empty">本周无此方向内容</p>'
        }</div>`
      ).join("");

      document.querySelector("#summary").textContent = `${all.length} 条内容 · 官方大厂优先 · 来自服务器最新调研结果`;
    }

    document.querySelector("#tabs").addEventListener("click", (event) => {
      const btn = event.target.closest(".tab");
      if (!btn) return;
      const id = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === id));
      document.querySelectorAll(".cat-panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === id));
    });

    function renderCard(p) {
      const kws = (p.keywords || []).map((k) => `<span class="kw">${escapeHtml(k)}</span>`).join("");
      const vendorsRaw = (p.vendors || '').trim();
      const official = vendorsRaw ? `<span class="vendor-tag">${escapeHtml(vendorsRaw)}</span>` : (p.is_major_vendor_official ? `<span class="vendor-badge">官方大厂</span>` : '');
      const openBadge = (p.score_open || 0) > 0 ? `<span class="open-badge">开源</span>` : '';
      return `
      <div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-head">
          <span class="score">${p.score}</span>
          ${official}
          ${openBadge}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        <div class="keywords">${kws}</div>
        <div class="field"><span class="label">论文摘要</span><span class="text">${escapeHtml(p.abstract)}</span></div>
        <div class="field"><span class="label">论文效果</span><span class="text">${escapeHtml(p.effects)}</span></div>
        <div class="field"><span class="label">工作原理</span><span class="text">${escapeHtml(p.mechanism)}</span></div>
        <div class="score-reason">评分依据：${escapeHtml(p.score_reason || "")}</div>
        <div class="score-dims">契合${p.score_relevance ?? ''}·厂商${p.score_vendor ?? ''}·贡献${p.score_contribution ?? ''}·质量${p.score_quality ?? ''}·时效${p.score_recency ?? ''}·开源${p.score_open ?? ''}</div>
        <div class="card-foot">
          <input name="insight_person" value="${escapeAttr(p.insight_person || "")}" placeholder="洞察人">
          <input name="wiki_url" value="${escapeAttr(p.wiki_url || "")}" placeholder="wiki 链接">
          <button type="button" data-action="save">保存</button>
        </div>
      </div>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      const card = button.closest(".card");
      await fetch("/api/insights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paper_id: card.dataset.id,
          insight_person: card.querySelector('[name="insight_person"]').value,
          wiki_url: card.querySelector('[name="wiki_url"]').value
        })
      });
      button.textContent = "已保存";
    });

    loadPapers().catch((error) => {
      document.querySelector("#summary").textContent = `读取失败：${error}`;
    });
  </script>
</body>
</html>
