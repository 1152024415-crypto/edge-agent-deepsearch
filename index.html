<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>RADAR · 端侧 AI Agent 信号</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#eef1f3; --panel:#ffffff; --ink:#0b1a24; --muted:#5a6b78; --faint:#8a99a6;
      --rule:#d4dae0; --hair:#e3e8ec;
      --amber:#c2410c; --green:#15803d; --blue:#1d4ed8; --purple:#6d28d9; --slate:#64748b;
      --fx:#c2410c; --app:#15803d; --hw:#1d4ed8; --model:#6d28d9;
    }
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;font-size:14px;line-height:1.5}
    main{max-width:1100px;margin:0 auto;padding:20px 22px 80px}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

    /* scope header */
    .scope{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px 0;margin-bottom:14px;overflow:hidden}
    .scope-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;letter-spacing:2px;color:var(--ink)}
    h1 .sub{font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0;margin-left:8px}
    .scope-stats{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
    .scope-stats b{color:var(--ink);font-weight:600}
    .nav-link{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:3px 9px;text-decoration:none;white-space:nowrap}
    .nav-link:hover{background:var(--amber);color:#fff}
    .week-switch{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:3px 6px;background:#fbfcfd;cursor:pointer}
    .week-switch:hover{border-color:var(--ink)}
    .sweep{height:2px;margin:12px -16px 0;background:linear-gradient(90deg,transparent 0%,var(--hair) 20%,var(--hair) 80%,transparent 100%);position:relative;overflow:hidden}
    .sweep::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 3.2s linear infinite}
    @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    @media(prefers-reduced-motion:reduce){.sweep::after{animation:none;opacity:.5}}
    .controls{display:flex;gap:10px;align-items:center;padding:10px 0 12px;flex-wrap:wrap}
    .search{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--rule);border-radius:4px;background:#fbfcfd;font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--ink)}
    .search:focus{outline:none;border-color:var(--ink)}
    .sort{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);display:flex;gap:4px;align-items:center}
    .sort button{border:1px solid var(--rule);background:#fbfcfd;color:var(--muted);font-family:inherit;font-size:11px;padding:3px 8px;border-radius:3px;cursor:pointer}
    .sort button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

    /* weekly highlights */
    .weekly{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:6px;padding:14px 16px;margin-bottom:16px}
    .weekly-title{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600}
    .weekly-ov{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:8px}
    .weekly-hl{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--hair)}
    .weekly-hl:first-of-type{border-top:none}
    .weekly-num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);font-weight:600;min-width:16px}
    .weekly-topic{font-weight:600;font-size:13px;color:var(--ink);text-decoration:none}
    .weekly-topic:hover{color:var(--amber)}
    .weekly-why{color:var(--muted);font-size:12px;line-height:1.45}
    /* filter */
    .filter{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-bottom:16px}
    .dim-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:5px}
    .dim-group:last-child{margin-bottom:0}
    .dim-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);min-width:34px;text-transform:uppercase;letter-spacing:.5px}
    .ftag{padding:2px 8px;border:1px solid var(--rule);background:#fbfcfd;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;border-radius:3px;cursor:pointer;line-height:1.5}
    .ftag:hover{border-color:var(--ink);color:var(--ink)}
    .ftag.active[data-dim=方向]{background:var(--fx);color:#fff;border-color:var(--fx)}
    .ftag.active[data-dim=应用]{background:var(--app);color:#fff;border-color:var(--app)}
    .ftag.active[data-dim=硬件]{background:var(--hw);color:#fff;border-color:var(--hw)}
    .ftag.active[data-dim=模型]{background:var(--model);color:#fff;border-color:var(--model)}

    /* tier bands */
    section.band{margin-bottom:20px;scroll-margin-top:54px}
    /* sticky section tabs */
    .tabs{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 8px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
    .tab{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);color:var(--muted);cursor:pointer;line-height:1.5}
    .tab b{color:var(--ink);font-weight:600;margin-left:5px}
    .tab:hover{border-color:var(--ink);color:var(--ink)}
    .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tab.active b{color:#fff}
    .band-head{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 0 4px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
    .band-head:hover .band-title{color:var(--amber)}
    .fold{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);transition:transform .15s;display:inline-block;width:10px}
    .band.collapsed .fold{transform:rotate(-90deg)}
    .band.collapsed .band-body{display:none}
    .band-body{}
    .band-bar{width:3px;height:14px;border-radius:1px}
    .band-title{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
    .band-count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
    .band-meta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);margin-left:auto}

    /* signal row */
    .row{display:flex;align-items:baseline;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--hair);border-radius:5px;margin-bottom:6px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .06s}
    .row:hover{border-color:var(--rule);transform:translateX(2px)}
    .row.hi{border-left:3px solid var(--amber);padding-left:10px}
    .sig{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px;flex-shrink:0}
    .sig-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink)}
    .sig-n.hi{color:var(--amber)}
    .sig-bars{display:flex;gap:1.5px;align-items:flex-end;height:9px}
    .sig-bars i{width:3px;height:9px;background:var(--hair);border-radius:1px}
    .sig-bars i.on{background:var(--ink)}
    .sig-bars i.on.hi{background:var(--amber)}
    .tier{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);flex-shrink:0}
    .date{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);flex-shrink:0}
    .open{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--green);font-weight:600;flex-shrink:0}
    .ttl{font-weight:600;font-size:13.5px;flex:1;min-width:160px}
    .row:hover .ttl{color:var(--amber)}
    .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
    .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 6px;border-radius:2px;line-height:1.5}
    .tag[data-dim=方向]{color:var(--fx);background:#fbeae3}
    .tag[data-dim=应用]{color:var(--app);background:#e3f0e8}
    .tag[data-dim=硬件]{color:var(--hw);background:#e3ecf8}
    .tag[data-dim=模型]{color:var(--model);background:#eee6f7}
    .abs{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}
    .empty{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:13px;padding:30px;text-align:center}

    /* detail overlay (rendered from inlined data — no server fetch, so a stale
       cached index never 404s when clicking a paper) */
    .overlay{position:fixed;inset:0;background:rgba(11,26,36,.45);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
    .overlay.hidden{display:none}
    .card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;max-width:720px;width:100%;padding:20px 22px;box-shadow:0 8px 30px rgba(11,26,36,.18)}
    .card-close{float:right;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:2px 9px;background:#fbfcfd}
    .card-close:hover{color:var(--ink);border-color:var(--ink)}
    .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin:4px 0 10px}
    .card h2{margin:0 0 8px;font-size:17px;font-weight:700;line-height:1.35}
    .card .abs{margin:10px 0;color:var(--ink);font-size:13px}
    .card .field{margin:8px 0;font-size:12.5px;line-height:1.55}
    .card .field b{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
    .card .src{display:inline-block;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--amber);text-decoration:none;border:1px solid var(--amber);border-radius:4px;padding:5px 10px}
    .card .src:hover{background:var(--amber);color:#fff}
    @media(max-width:640px){.row{flex-wrap:wrap}.ttl{min-width:100%}}
  </style>
</head>

Khadkevich, Nicolai Oswald, Enze Xie, Daniel Egert, Sharath Turuvekere Sreenivas, Shizhe Diao, Chenhan Yu, Ye Yu, Weijia Chen, Sajad Norouzi, Jingyu Liu, Shiyi Lan, Ligeng Zhu, Jin Wang, Jindong Jiang, Morteza Mardani, Mehran Maghoumi, Song Han, Ante Jukić, Nima Tajbakhsh, Jan Kautz, Pavlo Molchanov", "vendors": "NVIDIA", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05147", "run_id": "run-20260709-165925", "title": "DSpark: Confidence-Scheduled Speculative Decoding with Semi-Autoregressive Generation", "abstract": "DeepSeek 的投机解码框架，用半自回归架构给并行草稿加块内依赖，再按置信度自适应裁剪验证长度，高并发下不浪费批容量。", "effects": "DeepSeek-V4 服务系统真实流量下，相比 MTP-1 基线每用户生成速度提升 60-85%，在严格交互约束下打开此前不可达的性能档。", "mechanism": "半自回归架构（并行骨干+轻量序列模块）建模块内依赖缓解后缀衰减；置信度调度验证按前缀存活概率和引擎吞吐画像动态裁剪验证长度。", "paper_url": "https://arxiv.org/abs/2607.05147", "date": "2026-07-06", "score": 17, "score_relevance": 7, "score_contribution": 10, "score_reason": "投机解码属推理加速技术栈，云端 serving 验证但技术可迁移端侧（relevance 7）。DeepSeek 生产级创新，半自回归+置信度调度显著推进 SOTA（contribution 10）。论文明确署 DeepSeek-V4 服务系统、作者为 DeepSeek 团队（Wenfeng Liang, Damai Dai 等），证据：arXiv 论文机构署名与 DeepSeek-V4 引用。", "source_tier": "公司项目", "open_source": false, "tags": ["方向:投机解码", "方向:云端serving", "方向:高效推理", "模型:DeepSeek"], "insight_person": "", "wiki_url": "", "authors": "Xin Cheng, Xingkai Yu, Chenze Shao, Jiashi Li, Yunfan Xiong, Yi Qian, Jiaqi Zhu, Shirong Ma, Xiaokang Zhang, Jiasheng Ye, Qinyu Chen, Chengqi Deng, Jiping Yu, Damai Dai, Zhengyan Zhang, Yixuan Wei, Yixuan Tan, Wenkai Yang, Runxin Xu, Yu Wu, Zhean Xu, Xuanyu Wang, Muyang Chen, Rui Tian, Xiao Bi, Zhewen Hao, Shaoyuan Chen, Huanqi Cao, Wentao Zhang, Anyi Xu, Huishuai Zhang, Dongyan Zhao, Wenfeng Liang", "vendors": "DeepSeek", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.02770", "run_id": "run-20260709-165925", "title": "Gemma 4 Technical Report", "abstract": "Google 发布 Gemma 4 开放权重多模态模型族，2.3B-31B 参数，含 dense 与 MoE 架构，12B 版采用统一无编码器架构直接吃原始音频和图像 patch。", "effects": "STEM/多模态/长上下文基准大幅提升，可匹敌更大的前沿开放模型；改进推理速度、内存与计算效率，集成思考模式。", "mechanism": "改进视觉/音频编码器、12B 无编码器统一架构、思考模式生成推理轨迹、关键设计选择提升长上下文能力与推理效率。", "paper_url": "https://arxiv.org/abs/2607.02770", "date": "2026-07-02", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "开放权重小模型（2.3B 起）+ 推理效率设计，端侧可部署（relevance 8）。无编码器统一架构+思考模式是模型族级创新（contribution 8）。Gemma Team 技术报告，Google 主导，证据：arXiv 技术报告署名 Gemma Team / Google。", "source_tier": "公司项目", "open_source": true, "tags": ["方向:模型架构", "方向:多模态", "方向:高效推理", "模型:Gemma"], "insight_person": "", "wiki_url": "", "authors": "Gemma Team (Google)", "vendors": "Google", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07046", "run_id": "run-20260709-165925", "title": "Voltron: Enabling Elastic Multi-Device Execution of LLM Inference for Empowered Edge Intelligence", "abstract": "把 LLM 推理从单机扩展到多台用户端设备协同执行，让端侧能跑动更大的模型而不依赖云端数据中心。", "effects": "比单台端设备上的最强可跑 LLM 准确率高 16.5%，同时满足用户 QoS 延迟要求。", "mechanism": "提出 Voltron 框架，弹性调度多台边缘设备协同完成 LLM 推理，按真实边缘环境动态适配设备组合与负载分配。", "paper_url": "https://arxiv.org/abs/2607.07046", "date": "2026-07-08", "score": 17, "score_relevance": 9, "score_contribution": 8, "score_reason": "明确端侧多设备 LLM 推理框架，QoS 验证（relevance 9）。多设备弹性协同执行 LLM 是新范式，区别于单机量化路线（contribution 8）。作者机构 arXiv 元数据未明确标注，vendors 空。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:推理框架", "方向:端云协同", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Chanwoo Cho, Wooseok Kim, Yonglak Son, Young Seo Lee, Young Geun Kim", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05475", "run_id": "run-20260709-165925", "title": "Is Your NPU Ready for LLMs? Dissecting the Hidden Efficiency Bottlenecks in Mobile LLM Inference", "abstract": "首个跨层测量移动端 LLM 推理的研究，覆盖 5 大框架和 CPU/GPU/NPU 三种后端，开发 PowerBench 做后端级能耗归因。", "effects": "NPU 上框架间性能差达 10 倍；发现 NPU 擅长计算密集 prefill、CPU 更擅长内存密集 decode；调度不当导致 40% 能耗浪费，最佳配置可降 NPU 能耗 54.8%。", "mechanism": "PowerBench 细粒度剖析工具做后端级能耗归因，发现框架 offload/量化策略差异、NPU 小核动态解码短板、线程/NPU 睡眠/CPU 轮询调度头部空间。", "paper_url": "https://arxiv.org/abs/2607.05475", "date": "2026-07-06", "score": 17, "score_relevance": 10, "score_contribution": 7, "score_reason": "移动端 NPU LLM 推理实测，明确端侧（relevance 10）。首个跨框架跨后端移动 LLM 能耗归因+PowerBench 工具有创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "方向:推理框架", "方向:能耗功耗", "硬件:NPU", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Guanyu Cai, Ruiming Tian, Lang Yang, Zhouhong Ren, Jinliang Yuan, Lingkun Li, Jiliang Wang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.03652", "run_id": "run-20260709-165925", "title": "ELiTeFormer: An Efficient Transformer for FPGAs", "abstract": "首个为 FPGA 部署联合设计混合线性注意力+三值超低精度线性投影的 Transformer 架构。", "effects": "比 LLaMA 3 权重压缩 10 倍、KV 缓存压缩 12.8 倍，MMLU 31.9%（BitNet b1.58 3% 以内）；FFN 9.6 倍加速、注意力 4.4 倍；端到端比 A100 GPU 延迟低 3.9 倍、能效高 3.2 倍。", "mechanism": "混合线性注意力+三值线性投影；处理单元微架构用 bitmask 消除三值投影所有乘法，完全不用 DSP 块；Xilinx VCK5000 Versal HLS 流程部署。", "paper_url": "https://arxiv.org/abs/2607.03652", "date": "2026-07-04", "score": 17, "score_relevance": 9, "score_contribution": 8, "score_reason": "FPGA Transformer 联合架构-硬件设计，明确端侧硬件（relevance 9）。线性注意力+三值量化+无乘法 PE 微架构是范式级创新（contribution 8）。作者 Sunketa/Agostini (PNNL)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:模型架构", "方向:量化", "方向:高效注意力", "方向:编译部署"], "insight_person": "", "wiki_url": "", "authors": "Victor Agostinelli, Nicolas Bohm Agostini, Antonino Tumeo", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07707", "run_id": "run-20260709-165925", "title": "Co-LMLM: Continuous-Query Limited Memory Language Models", "abstract": "让小模型不把事实知识塞进权重，而是外置到一个连续向量知识库，生成时按需查询，360M 参数即可逼近大模型事实精度。", "effects": "360M 规模下困惑度低于预训练数据多 40 倍的模型；SimpleQA 验证事实精度与 gpt-4o-mini 相当、高于 Claude Sonnet 4.5。", "mechanism": "知识库用连续键配文本值，模型生成时产出廉价向量查询检索人类可读知识并归因，配合标注管线标注自由文本事实 span。", "paper_url": "https://arxiv.org/abs/2607.07707", "date": "2026-07-08", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "360M 小模型+外置记忆逼近大模型事实能力，端侧可迁移（relevance 8）。连续查询 LMLM 范式新，打破权重记忆范式（contribution 8）。作者含 Yoav Artzi (NYU)、Kilian Weinberger (Cornell)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:模型架构", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yair Feldman, Linxi Zhao, Nathan Godey, Dongyoung Go, Yilun Hua, Kilian Q. Weinberger, Jennifer J. Sun, Yoav Artzi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07403", "run_id": "run-20260709-165925", "title": "Multi-Agent Robotic Control with Onboard Vision-Language Models", "abstract": "在机载硬件上部署多个专用 VLM agent 协同控制自主移动机械臂，彻底摆脱云端依赖。", "effects": "在 AMD Ryzen AI mini PC 上硬件在环仿真验证全机载多 agent 架构可行，成本低于云依赖方案，具备真实迁移潜力。", "mechanism": "多 agent 系统把 3-20B 紧凑 VLM 部署在机载，配 Megamind 编排 agent 缓解小模型长程规划上下文丢失，微调提升检测精度。", "paper_url": "https://arxiv.org/abs/2607.07403", "date": "2026-07-08", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确机载 VLM 多 agent 端侧部署，AMD Ryzen AI mini PC 真机验证（relevance 9）。机载多 agent 编排缓解小模型记忆是工程创新（contribution 7）。作者来自 Warsaw U of Tech / MIT，学校项目，开源仿真环境。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent", "方向:多模态", "方向:编译部署", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Kajetan Rachwał, Maciej Majek, Bartłomiej Boczek, Jakub Matejczyk, Dominik Matejkowski, Adam Dąbrowski, Tim Seyde, Alexander Amini, Maria Ganzha", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06651", "run_id": "run-20260709-165925", "title": "Entropy-Guided Tensor Compression for Multimodal Federated Learning on Edge Devices", "abstract": "在多模态联邦学习里按每层更新的谱熵自适应分配压缩秩，让算力各异的边缘设备也能高效参与训练。", "effects": "15 节点 Raspberry Pi 4/5 异构集群上压缩比达 56.8 倍，准确率还比未压缩 FedAvg 高 2.01%，收敛总传输量降到 1/66。", "mechanism": "MESH-FL 用截断 SVD 估计每层更新的谱熵，证明高熵需高重构秩，据此在模态/层/设备间按 payload 预算自适应分配矩阵乘积态压缩秩。", "paper_url": "https://arxiv.org/abs/2607.06651", "date": "2026-07-07", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "Raspberry Pi 集群多模态联邦学习，明确端侧（relevance 9）。熵引导张量压缩+收敛证明有理论与系统创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:剪枝稀疏", "方向:多模态", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Quoc Bao Phan, Tuy Tan Nguyen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.04668", "run_id": "run-20260709-165925", "title": "Elastic Gang: Per-Token Membership Change for a Hard-Barriered LLM Inference Gang Co-Scheduled with OS Processes", "abstract": "端侧 LLM 解码是硬屏障 CPU-SIMD 计算要占满所有核，OS 其他进程也要这些核；提出弹性 gang 让核成员在每 token 间动态变化。", "effects": "AMD Zen 5 上 135M 和 7B 模型推理输出位级精确；比静态核划分 Pareto 优：中等推理占空比下通用吞吐 1.28-1.75 倍，推理空闲时恢复全部 8 核。", "mechanism": "ACK 锁定 epoch 协议不等待具名核：seqlock 式 generation-tagged 锁+RCU/epoch 式成员同意，每 token 参与集为请求核与 ack 核的交集；借核 0.22us，不抢占运行租户。", "paper_url": "https://arxiv.org/abs/2607.04668", "date": "2026-07-06", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确端侧 LLM 解码 OS 调度，真机验证（relevance 9）。弹性 gang+epoch 协议是 OS-级系统创新（contribution 7）。作者 Anima OS 单人，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent", "方向:推理框架", "方向:调度服务", "硬件:CPU"], "insight_person": "", "wiki_url": "", "authors": "Daeyeon Son", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.04302", "run_id": "run-20260709-165925", "title": "HiFA4: Training-Free 4-bit FlashAttention on Ascend HIF4 NPUs for LLM Inference", "abstract": "在华为昇腾 HIF4 NPU 上把 FlashAttention 的 QK^T 和 PV 都跑成 4 位 Cube GEMM，softmax 状态保 FP16，免训练。", "effects": "Qwen3-8B 上恢复 37.5% 直接量化精度损失，MMLU 准确率损失从 1.12pp 降到 0.70pp，不一致预测从 16.3% 降到 8.2%；预计关键路径延迟降 35.4%。", "mechanism": "Smooth-QK 做 RoPE 后等价重标定把量化难度从 K 转 Q；P-Reordering 让 softmax 归一化与 PV GEMM 共用量化权重，融合进 Cube GEMM。", "paper_url": "https://arxiv.org/abs/2607.04302", "date": "2026-07-05", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "昇腾 NPU 4 位注意力算子级设计，明确端侧硬件（relevance 9）。Smooth-QK+P-Reordering 算子级创新（contribution 7）。作者含华为相关，但 arXiv 元数据未明确机构，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效注意力", "方向:KV cache", "硬件:NPU", "硬件:Ascend", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Hui Dong, Yanzhao Li, Jie Gao, Chunlu Li, Zhiyuan Zhang, Yupeng Sun, Zhenyuan Chen, Zhiqiang Zou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.03333", "run_id": "run-20260709-165925", "title": "SPORK: Self-Speculative Forking to Accelerate Agentic LLM Inference", "abstract": "LLM agent 的思考-行动-观察循环中 GPU 等工具返回常占 16-37% 墙钟时间；SPORK 让模型当自己的预测器，提前 fork 出工具名预测并行执行。", "effects": "Qwen3-32B 上工具名预测准确率 74.6-99.6%；GAIA P95 降 18%（131.9→108.1s）；覆盖 4B-32B dense 和 MoE 模型；准确率 1pp 内。", "mechanism": "生成起始 fork 探针预测工具名，prefix-cache fork 降成本，置信度门控过滤误测，部分 token 接受把拒测变投机解码草稿；拒绝则回退串行无正确性损失。", "paper_url": "https://arxiv.org/abs/2607.03333", "date": "2026-07-03", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "agent 推理加速，工具调用并行隐藏等待，可迁移端侧 agent（relevance 8）。模型自预测+prefix-cache fork+部分 token 接受免训练创新（contribution 8）。作者清华，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:投机解码", "方向:工具调用", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Huajun Bai, Weiwei Lv, Huichuan Zheng, Youyou Lu, Jiwu Shu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07388", "run_id": "run-20260709-165925", "title": "TF-Engram: A Train-Free Engram with SSD-Backed Memory for Large Language Models", "abstract": "给小模型外挂一个免训练的短语级语义记忆，存在 GPU-DRAM-SSD 三级存储里，让 0.6B 模型也能用到大规模外部知识。", "effects": "Qwen3-0.6B 下游平均分从 57.6 升到 59.4，超过参数量匹配的 LoRA 基线；SSD 存储大幅降低 GPU 显存占用，预测预取找回大部分吞吐。", "mechanism": "离线从语料构造短语级语义记忆表，跨 GPU-DRAM-SSD 层级存储，用 Early-Exit 引导的预测预取在自回归解码时隐藏外部访存延迟。", "paper_url": "https://arxiv.org/abs/2607.07388", "date": "2026-07-08", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "Qwen3-0.6B 小模型+SSD 三级记忆，端侧小模型可迁移（relevance 8）。免训练 engram+预测预取系统设计有创新（contribution 7）。作者 Zili Shao (CUHK-Shenzhen)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:高效推理", "方向:编译部署", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Yutang Ma, Kecheng Huang, Xikun Jiang, Zili Shao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05933", "run_id": "run-20260709-165925", "title": "Energy-Efficient GPU DVFS for Fine-Tuning of SLMs on Resource-constrained Embedded Devices", "abstract": "针对资源受限嵌入式 GPU 上的小语言模型微调，用动态电压频率调度省电，让本地个性化训练更节能。", "effects": "NVIDIA Jetson AGX Orin 上平均节能 13.11%（最高 26.73%），对 BERT/Pythia 等 SLM 在 GLUE 上表征了微调行为。", "mechanism": "先刻画 encoder-only 与 decoder-only SLM 的微调能耗行为，再用简单 ML 模型按工况选择能耗最优的 GPU DVFS 设置。", "paper_url": "https://arxiv.org/abs/2607.05933", "date": "2026-07-07", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "Jetson AGX Orin 上 SLM 微调能耗优化，明确端侧训练（relevance 9）。DVFS 调度用于 SLM 微调是工程创新但方法较朴素（contribution 6）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧训练", "方向:能耗功耗", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Jurn-Gyu Park, Sanzhar Zholdybayev, Aidar Amangeldi, Ademi Zhanuzakova", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05711", "run_id": "run-20260709-165925", "title": "FourTune: Towards Fully 4-Bit Efficient Post-Training for Diffusion Models", "abstract": "给扩散模型做端到端 W4A4G4 后训练框架，三支路混合管线在 LoRA 上加冻结数值稳定器隔离量化敏感异常值。", "effects": "FLUX.1-dev 12B 上内存开销降 2.25 倍，端到端训练吞吐升 2.27 倍；定制化/RL/蒸馏任务匹配全精度微调质量。", "mechanism": "三支路混合管线（LoRA+冻结数值稳定器）；硬件高效块级量化+定制融合内核支持量化反传播降内存带宽；原生 4 位计算。", "paper_url": "https://arxiv.org/abs/2607.05711", "date": "2026-07-07", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "4 位扩散模型后训练，端侧可迁移效率（relevance 7）。W4A4G4+三支路稳定器+融合内核有创新（contribution 8）。作者含 Song Han (MIT)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "方向:蒸馏", "方向:多模态"], "insight_person": "", "wiki_url": "", "authors": "Bowen Xue, Zihan Min, Xingyang Li, Zhekai Zhang, Haocheng Xi, Lvmin Zhang, Maneesh Agrawala, Jun-Yan Zhu, Song Han, Yujun Lin, Muyang Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06601", "run_id": "run-20260709-165925", "title": "TriRoute: Unified Learned Routing for Joint Adaptive Attention, Experts, and KV-Cache Allocation", "abstract": "一个轻量控制器同时决定每个 token 每层的注意力模式（跳/局部/全）、MoE 专家选择和 KV 缓存位宽，联合优化。", "effects": "160M-1.3B 模型上 Pareto 优于独立 MoD+MoE+KV 量化组合，同等推理 FLOPs 和内存下更好保尾例鲁棒性；控制器给句首/罕见子词/命名实体分配全注意力和高精度缓存。", "mechanism": "单一控制器端到端训练，异构松弛（Gumbel-Softmax+STE 做分类决策，负载均衡 top-k 门控做专家），拉格朗日预算约束把平均计算和内存变可调旋钮；识别路由塌陷级联并用逐轴归一化+耦合感知平衡损失解决。", "paper_url": "https://arxiv.org/abs/2607.06601", "date": "2026-07-07", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "联合注意力+MoE+KV 缓存路由属推理效率技术栈（relevance 7）。三轴联合路由+塌陷级联分析有创新（contribution 8）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:KV cache", "方向:高效推理", "方向:稀疏注意力"], "insight_person": "", "wiki_url": "", "authors": "Andrii Balashov, Olena Ponomarova", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05061", "run_id": "run-20260709-165925", "title": "KVpop -- Key-Value Cache Compression with Predictive Online Pruning", "abstract": "学会一个 KV 缓存淘汰策略，直接用未来注意力信号监督保留/丢弃决策，大幅压缩 KV 缓存且不掉精度。", "effects": "Qwen3-4B 在 75% 压缩下保留 98% 全注意力性能，88% 压缩下 97%；Qwen3-8B 接近满分教师性能。", "mechanism": "训练一个打分器，用高效计算的未实体化注意力目标直接监督 keep-or-drop，并引入延迟记忆打分利用近未来上下文。", "paper_url": "https://arxiv.org/abs/2607.05061", "date": "2026-07-06", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "KV 缓存压缩属端侧推理技术栈，可迁移（relevance 7）。未来注意力监督+延迟记忆打分有创新（contribution 8）。作者含 Sepp Hochreiter (JKU Linz)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Lukas Hauzenberger, Niklas Schmidinger, Anamaria-Roberta Hartl, David Stap, Thomas Schmied, Sebastian Böck, Günter Klambauer, Sepp Hochreiter", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05511", "run_id": "run-20260709-165925", "title": "Light-Omni: Reflex over Reasoning in Agentic Video Understanding with Long-Term Memory", "abstract": "把视频 agent 的迭代式侦探推理换成单次前向的反射式响应，用全局多模态脚本和参数化隐状态直接驱动动作与检索。", "effects": "比 M3-Agent 平均准确率高 2.4%，速度快 12.1 倍，GPU 显存效率提升 2.6 倍；可作记忆系统增强现有 MLLM。", "mechanism": "双上下文状态：全局状态为有限多模态脚本持续合并情节记忆保近略远；条件生成参数化隐状态直接驱动动作产出检索嵌入，避免迭代推理。", "paper_url": "https://arxiv.org/abs/2607.05511", "date": "2026-07-06", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "高效视频 agent，12.1 倍加速+显存优化可迁移端侧（relevance 7）。反射式替代迭代推理+双上下文状态有创新（contribution 8）。作者机构未明确标注，vendors 空，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:多模态", "方向:高效推理", "方向:规划推理"], "insight_person": "", "wiki_url": "", "authors": "Chang Nie, Jiaju Wei, Junlan Feng, Chaoyou Fu, Caifeng Shan", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.02980", "run_id": "run-20260709-165925", "title": "Hierarchical Sparse Attention Done Right: Toward Infinite Context Modeling", "abstract": "提出 HiLS 分层稀疏注意力，让 chunk 选择在 LM 损失下端到端学习，性能追平全注意力且能外推到训练上下文 64 倍以上。", "effects": "域内上下文长度上性能可比甚至优于全注意力；外推超训练长度 64 倍时检索准确率 90%；全注意力模型可轻量继续预训练转换。", "mechanism": "每个 query 独立与每个检索到的 chunk 做注意力提取 chunk 信息，再按检索分数融合输出，把检索分数纳入前向计算使其在 LM 损失下端到端优化。", "paper_url": "https://arxiv.org/abs/2607.02980", "date": "2026-07-03", "score": 15, "score_relevance": 7, "score_contribution": 8, "score_reason": "稀疏注意力+长上下文外推属端侧推理技术栈（relevance 7）。端到端学习 chunk 选择+原生稀疏训练有创新（contribution 8）。作者含 Yushi Bai/Kewei Tu (SUSTech)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:稀疏注意力", "方向:高效注意力", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xiang Hu, Xinyu Wei, Hao Gu, Minshen Zhang, Tian Liang, Huayang Li, Lei Zhu, Yan Wang, Sirui Han, Yushi Bai, Kewei Tu, Haitao Mi, Leo Liang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07409", "run_id": "run-20260709-165925", "title": "DeLS-Spec: Decoupled Long-Short Contexts for Parallel Speculative Drafting", "abstract": "给块并行投机解码的 DFlash 加一个轻量短上下文头，引入块内因果依赖，无需从头训练草稿模型。", "effects": "Qwen3 上在数学/代码/对话基准上一致提升加速比与平均接受长度，超越 DFlash，训练成本极低。", "mechanism": "把固定 DFlash 当长上下文专家，引入可独立训练的局部短上下文头，推理时融合长短上下文 logits，局部头不绑定特定 DFlash 检查点。", "paper_url": "https://arxiv.org/abs/2607.07409", "date": "2026-07-08", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "投机解码属端侧推理加速技术栈（relevance 7）。解耦长短上下文+免联合训练的模块化设计有创新（contribution 7）。作者 Hong-Kai Li (PKU)，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码", "方向:高效推理", "模型:Qwen"], "insight_person": "", "wiki_url": "", "authors": "Hong-Kai Zheng, Piji Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07144", "run_id": "run-20260709-165925", "title": "Fractal KV-Cache Archives: Lossless Symbolic Storage with In-Place Retrieval for Long-Context LLM Inference", "abstract": "把量化后的 KV 缓存符号流用收缩迭代映射码序列化成低维实向量，既无损存储又自带检索索引。", "effects": "GPT-2 1024 上下文下，残差向量量化让归档缓存压缩 36-54 倍，困惑度代价 11-15%；存储层可直接做近似子串查询，O(1) 随机访问与摊还追加。", "mechanism": "重新审视收缩迭代映射码作为量化 KV 缓存归档格式，线性时间序列化，配合每头残差向量量化与 key/value 不对称位分配。", "paper_url": "https://arxiv.org/abs/2607.07144", "date": "2026-07-08", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "KV 缓存压缩+存储层创新，端侧长上下文可迁移（relevance 7）。分形归档格式兼具无损存储与检索索引是新视角（contribution 7）。单作者学校项目，笔记本 CPU 可复现。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:KV cache", "方向:高效推理", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Vladimir Gusev", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05804", "run_id": "run-20260709-165925", "title": "TurnOPD: Making On-Policy Distillation Turn-Aware for Efficient Long-Horizon Agent Training", "abstract": "给长程 agent 的在策略蒸馏做 turn 级预算控制，避免尾部 turn 浪费算力和浅 token 主导损失的两大低效。", "effects": "ALFWorld/WebShop/多跳搜索上等_wall-clock 预算下验证准确率优于 vanilla OPD，推进精度-时间前沿。", "mechanism": "两个预算控制器：自适应 rollout 深度预算用探针 turn 统计定长；渐进 turn 归一化损失预算把 KL 权重从 token 级逐步转到 turn 均衡监督。", "paper_url": "https://arxiv.org/abs/2607.05804", "date": "2026-07-07", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "agent 蒸馏训练效率，可迁移端侧小 agent 训练（relevance 6）。turn 级预算控制针对长程 agent OPD 痛点有创新（contribution 8）。作者机构未明确标注，标学校预印本。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:工具调用", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yuhang Zhou, Kai Zheng, Haoling Li, Dengyun Peng, Can Xu, Jingjing Chen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05116", "run_id": "run-20260709-165925", "title": "Communication-Aware Placement and Pruning for Efficient Mixture-of-Experts Inference", "abstract": "MoE 推理的专家放置和剪枝应同时考虑计算、通信和精度，CAP 框架把三者联合优化。", "effects": "单节点和多节点实验中比 DeepSeek EPLB 和 vLLM 顺序放置吞吐提升 1.23-1.86 倍，同等目标加速下精度更好。", "mechanism": "共激活驱动专家放置减少跨设备/节点通信；计算-通信权衡调整生成不同放置；通信感知专家剪枝选择移除路由目标降通信。", "paper_url": "https://arxiv.org/abs/2607.05116", "date": "2026-07-06", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "MoE 分布式推理效率，云端为主但技术可参考（relevance 6）。通信-计算-精度联合优化放置+剪枝有创新（contribution 8）。作者中山大学，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:剪枝稀疏", "方向:云端serving", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Xiao Shi, Yingying Sun, Jiangsu Du, Zhiguang Chen, Yutong Lu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.04605", "run_id": "run-20260709-165925", "title": "Do All Visual Tokens Matter Equally? Object-Evidence Preserving Token Merging for Vision-Language Retrieval", "abstract": "把多向量视觉检索的图像侧 token 压成 K 个代表质心，同时保留物体级证据供未来查询选中。", "effects": "K=64 时去掉 93% 以上图像 token，ColPali 存储降 16.09 倍，Flickr30K/MSCOCO R@1 反升；短语级定位更强。", "mechanism": "训练时用物体标注做合并先验阻止跨实例混合，推理无需检测器；仅调共享投影层，视觉/语言骨干冻结。", "paper_url": "https://arxiv.org/abs/2607.04605", "date": "2026-07-06", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "视觉 token 压缩+存储降低可迁移端侧 VLM 检索（relevance 7）。物体感知合并非剪枝/特征池化有创新（contribution 7）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:高效推理", "方向:多模态", "方向:稀疏注意力"], "insight_person": "", "wiki_url": "", "authors": "Suhyeong Park, Junha Jung, Jungwoo Park, Jaewoo Kang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05240", "run_id": "run-20260709-165925", "title": "Optimizing ML Workload Partitioning between CPUs and CIM Accelerators for Heterogeneous Computing", "abstract": "在 CPU 和存内计算（CIM）加速器间用 ILP 做工作负载划分，考虑 RRAM 约束和并行性，最小化端到端推理延迟。", "effects": "异构 CPU-CIM 执行比仅 CPU（边缘 CPU）快 30.9 倍，比高性能 CPU 快 7.3 倍。", "mechanism": "ILP 划分框架最小化推理延迟，纳入 RRAM 有限内存/高写延迟/有限寿命约束，结合经验剖析与解析模型，捕捉并行性和低层架构效应。", "paper_url": "https://arxiv.org/abs/2607.05240", "date": "2026-07-06", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "边缘 CPU+CIM 异构加速，明确端侧硬件（relevance 8）。ILP 划分纳入 RRAM 约束有工程创新（contribution 6）。作者 RWTH Aachen，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:高效推理", "硬件:CPU"], "insight_person": "", "wiki_url": "", "authors": "Joel Klein, Rebecca Pelke, Roberto Laudani, Jan Moritz Joseph, Rainer Leupers", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.04475", "run_id": "run-20260709-165925", "title": "A Reconfigurable and Representation-Adaptive ISA-Based Architecture for Efficient DNN Acceleration", "abstract": "提出面向 ML 的指令集架构+可重构硬件平台，兼顾高效与灵活，支持 3-8 位动态精度。", "effects": "22nm 实现 5.12-10.47 TOPS/W，比定点方案能效高 1.2 倍，精度不损；超越 SOTA 和混合精度加速器。", "mechanism": "ISA 细粒度控制数据移动/动态精度/解耦执行；轻量可编程核+SIMD 维持高 PE 利用率低控制开销；用残数系统（RNS）实例化支持 3-8 位动态精度。", "paper_url": "https://arxiv.org/abs/2607.04475", "date": "2026-07-05", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "可重构 DNN 加速器 ISA，明确端侧硬件（relevance 8）。ML 导向 ISA+RNS 动态精度有架构创新（contribution 6）。作者 Kuwait Univ，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:量化", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Vasilis Sakellariou, Vassilis Paliouras, Ioannis Kouretas, Hani Saleh, Thanos Stouraitis", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.02461", "run_id": "run-20260709-165925", "title": "OrbitQuant: Data-Agnostic Quantization for Image and Video Diffusion Transformers", "abstract": "给扩散 Transformer 做数据无关的权重-激活量化，一个旋转基让同一码本跨时间步/提示/层/模态通用，无需逐检查点重标定。", "effects": "FLUX.1/Z-Image-Turbo/Wan2.1/CogVideoX 上多低比特设定 SOTA；把图像扩散 Transformer 量化推到 W2A4 仍可用。", "mechanism": "随机置换块 Hadamard 旋转把每坐标集中到一个固定已知边际，单一 Lloyd-Max 码本服务所有时间步/层；旋转吸收进权重，运行时仅剩激活前向旋转。", "paper_url": "https://arxiv.org/abs/2607.02461", "date": "2026-07-02", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "扩散模型量化属高效推理技术栈，端侧可迁移但非显式端侧（relevance 6）。数据无关旋转基量化跨模态通用有创新（contribution 8）。作者学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:高效推理", "方向:多模态"], "insight_person": "", "wiki_url": "", "authors": "Donghyun Lee, Jitesh Chavan, Duy Nguyen, Sam Huang, Liming Jiang, Priyadarshini Panda, Timo Mertens, Saurabh Shukla", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.07643", "run_id": "run-20260709-165925", "title": "ATLAS: Automated HLS for DL-Optimized FPGAs", "abstract": "从高层 DL 模型描述到带定制硬块 FPGA 的全自动流程，无需手写 RTL，用 GEMM 作通用抽象层。", "effects": "11 个 DL 设计验证（FC/卷积/注意力层+完整 CNN/MLP/Transformer），覆盖 Catapult HLS+VTR 实现。", "mechanism": "hls4ml-GEMM 编译前端把 DL 层转架构无关 GEMM 调用的 HLS C；GEMM IP 生成器后端产带 tiling/控制 FSM/调度元数据的硬块 RTL wrapper。", "paper_url": "https://arxiv.org/abs/2607.07643", "date": "2026-07-08", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "FPGA DL 自动化编译流程含 Transformer，端侧硬件可迁移（relevance 7）。高层模型到硬块 RTL 全自动流程有工具链创新（contribution 6）。作者 Sunketa/Arora，学校项目。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:编译部署", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Ruthwik Reddy Sunketa, Aman Arora", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06982", "run_id": "run-20260709-165925", "title": "EdgeCompress: Coupling Multidimensional Model Compression and Dynamic Inference for EdgeAI", "abstract": "给边缘 CNN 做多维压缩：动态裁前景+协同缩深度宽度分辨率+级联多复杂度模型按难度动态选路。", "effects": "ImageNet-1K 上 ResNet-50 计算量降 48.8% 同时 top-1 准确率高 0.8%；同等计算下比 HRank 准确率高 4.1%。", "mechanism": "轻量前景预测器裁 informative 区域避冗余；复合缩放按对准确率/计算贡献协同压三维；动态推理级联多复杂度模型按输入难度选路。", "paper_url": "https://arxiv.org/abs/2607.06982", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "明确边缘部署 CNN 压缩，Jetson 等嵌入式（relevance 8）。多维压缩+动态推理是工程整合但 CNN 路线创新度中等（contribution 5）。作者 NTU，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:编译部署", "方向:高效推理", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Hao Kong, Di Liu, Shuo Huai, Xiangzhong Luo, Ravi Subramaniam, Christian Makaya, Qian Lin, Weichen Liu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06922", "run_id": "run-20260709-165925", "title": "Latency-Constrained DNN Architecture Learning for Edge Systems using Zerorized Batch Normalization", "abstract": "让神经网络在设计时就满足硬延迟约束，一次训练过程就学到符合边缘设备时延上限的模型。", "effects": "Jetson Nano 上 GoogLeNet 从 40.32ms 降到 34ms 仅掉 0.14%；TX2 上 VGG-19 从 119.98ms 压到 34ms 还高 0.5% 准确率。", "mechanism": "提出零化 BN 的延迟导向学习方法，配通用硬件定制延迟预测器，一次 shot 训练就学到满足时延约束的模型，配量化可进一步提升。", "paper_url": "https://arxiv.org/abs/2607.06922", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "Jetson Nano/TX2 硬延迟约束 DNN 设计，明确端侧（relevance 8）。硬件定制延迟预测器+一次训练有工程价值但创新度中等（contribution 5）。作者 NTU，开源 ZeroBN，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:编译部署", "方向:高效推理", "方向:量化", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Shuo Huai, Di Liu, Hao Kong, Weichen Liu, Ravi Subramaniam, Christian Makaya, Qian Lin", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06915", "run_id": "run-20260709-165925", "title": "Smart Scissor: Coupling Spatial Redundancy Reduction and CNN Compression for Embedded Hardware", "abstract": "给嵌入式硬件做 CNN 压缩：动态裁前景去空间冗余+协同缩深度宽度分辨率，统一框架。", "effects": "ImageNet-1K 上 ResNet50 计算量降 41.5% 同时 top-1 准确率高 0.3%；同等计算下比 HRank 高 4.1%。", "mechanism": "轻量前景预测器精细裁前景，小幅即可正确识别；复合缩放协同压三维；无缝结合成统一压缩框架。", "paper_url": "https://arxiv.org/abs/2607.06915", "date": "2026-07-08", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "嵌入式硬件 CNN 压缩，明确端侧（relevance 8）。空间冗余+架构压缩联合是工程整合但 CNN 路线创新度中等（contribution 5）。作者 NTU，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:编译部署", "方向:高效推理", "硬件:MCU"], "insight_person": "", "wiki_url": "", "authors": "Hao Kong, Di Liu, Shuo Huai, Xiangzhong Luo, Weichen Liu, Ravi Subramaniam, Christian Makaya, Qian Lin", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.06839", "run_id": "run-20260709-165925", "title": "LEMUR 2: Unlocking Neural Network Diversity for AI", "abstract": "大规模 NAS 基准，14000+ 架构/75 万训练记录，含 NN-Lite 在移动和 VR 平台自动部署和延迟基准。", "effects": "覆盖多模态/文生图/语言建模；NN-VR/NN-Lite 管线在异构移动和 VR 平台提供真机性能元数据，支撑跨域架构迁移分析。", "mechanism": "AST 代码变异+遗传/RL 进化+分形架构生成+LLM 引导合成（NN-RAG 从 900+ PyTorch 模块检索架构 motif）；NN-VR/NN-Lite 自动部署基准。", "paper_url": "https://arxiv.org/abs/2607.06839", "date": "2026-07-07", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "NAS 基准含移动/VR 真机部署延迟，端侧可迁移（relevance 7）。14000 架构+LLM 驱动 AutoML+跨平台部署基准有数据集创新（contribution 6）。作者含 Radu Timofte (Würzburg)，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:编译部署", "方向:模型架构", "硬件:手机"], "insight_person": "", "wiki_url": "", "authors": "Tolgay Atinc Uzun, Waleed Khalid, et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.05155", "run_id": "run-20260709-165925", "title": "EdgeBench: Unveiling Scaling Laws of Learning from Real-World Environments", "abstract": "分析约 38000 小时 agent 与真实环境交互、134 个真实任务，首次发现 agent 环境学习性能遵循 log-sigmoid 标度律，R²=0.998。", "effects": "agent 学习速度约每三个月翻倍；发布 51 个任务和评测框架。任务覆盖科研发现/软件工程/组合优化/数学/游戏，每任务至少 12 小时连续运行。", "mechanism": "构建 134 个超长程真实任务的多层反馈评测套件 EdgeBench，跨任务拟合性能-数据/计算标度律。", "paper_url": "https://arxiv.org/abs/2607.05155", "date": "2026-07-06", "score": 13, "score_relevance": 5, "score_contribution": 8, "score_reason": "agent 环境学习标度律，非端侧设备但 agent 研究基础（relevance 5）。首次实证 agent 学习标度律+134 任务套件有创新（contribution 8）。作者含 Deyao Zhu/Wangchunshu Zhou 等，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:端侧agent", "方向:规划推理"], "insight_person": "", "wiki_url": "", "authors": "Deyao Zhu, Xin Zhou, Shengling Qin, et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.02255", "run_id": "run-20260709-165925", "title": "AgenticSTS: A Bounded-Memory Testbed for Long-Horizon LLM Agents", "abstract": "给长程 LLM agent 提出有界记忆契约：每次决策从新鲜用户消息按类型检索组装，不累积原始跨决策记录，prompt 长度恒定。", "effects": "Slay the Spire 2 上释放 298 条轨迹的有界记忆测试床；启用技能层后胜率从 3/10 升到 6/10（方向性，p≈0.37）。", "mechanism": "每次决策从新鲜消息按类型检索组装，无跨决策原始记录，prompt 跨任意长运行有界；可隔离消融任意记忆层。", "paper_url": "https://arxiv.org/abs/2607.02255", "date": "2026-07-02", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "有界记忆 agent，prompt 恒定可迁移端侧（relevance 7）。有界记忆契约+可复现测试床有方法学价值（contribution 6）。作者含 Kaipeng Zhang，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:记忆", "方向:端侧agent", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Xiangchen Cheng, Yunwei Jiang, Jianwen Sun, Zizhen Li, Chuanhao Li, Xiangcheng Cao, Yihao Liu, Fanrui Zhang, Li Jin, Kaipeng Zhang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.02963", "run_id": "run-20260709-165925", "title": "Parallelized Autoregressive Decoding for Omni-Modal Dense Video Captioning", "abstract": "给全模态密集视频字幕生成做并行自回归解码，利用时间上不同事件间的弱依赖让 token 跨事件并行生成。", "effects": "多基准上事件定位与字幕的效率与性能双优，无损并行生成。", "mechanism": "潜在全局规划学事件结构产紧凑 token 编码跨事件因果；事件因子化并行解码让弱依赖 token 并行、紧耦合 token 保序。", "paper_url": "https://arxiv.org/abs/2607.02963", "date": "2026-07-03", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "并行解码提效，视频生成非显式端侧但技术可参考（relevance 5）。弱依赖跨事件并行解码无损加速有创新（contribution 7）。作者 NUS，开源，学校项目。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:高效推理", "方向:多模态", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Wenzheng Zeng, Siyi Jiao, Chen Gao, Hwee Tou Ng, Mike Zheng Shou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:25.239467+00:00"}, {"id": "arxiv-2607.03451", "run_id": "run-20260709-165925", "title": "SkillOpt-Lite: Better and Faster Agent Self-evolution via One Line of Vibe", "abstract": "把 agent 技能优化形式化为零阶优化，砍掉冗余组件，三原则下用一行 vibe 让 agent 自我进化技能。", "effects": "LiveMath 上 GPT-5.5 +8.8 分、GPT-5.4-nano +25.4 分让 nano 超标准 GPT-5.4；集成 VSCode Copilot；SpreadsheetBench 上 nano 0.7758 超 GPT-5.5。", "mechanism": "零阶优化映射经典对应，三原则：文件系统轨迹探索、共识属性挖掘、独立验证门控；砍冗余得最小管线并推广到 harness 优化。", "paper_url": "https://arxiv.org/abs/2607.03451", "date": "2026-07-03", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "agent 自进化技能，可迁移端侧小 agent 但非显式端侧（relevance 5）。零阶优化最小管线+三原则有方法学创新（contribution 7）。作者学校项目，开源。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:工具调用", "方向:规划推理", "方向:高效推理"], "insight_person": "", "wiki_url": "", "authors": "Yifei Shen, Bo Li, Xinjie Zhang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-09T09:56:2     <script>
    let ALL=[], ACTIVE=new Set(), Q="", SORT="score";
    const TIER=[["官方动态","--amber"],["开源大项目","--green"],["公司项目","--blue"],["学校顶会","--purple"],["学校预印本","--slate"]];

    async function loadPapers(){
      const data = window.__PAPERS__;
      ALL=data.papers||[];
      renderFilter(); renderPapers();
      attachSpy();
      document.querySelector("#summary").innerHTML=`<b>${ALL.length}</b> signals · 7-day window · <b>${range()}</b>`;
    }
    async function loadWeekly(){
      const w = window.__WEEKLY__;
      const el=document.querySelector("#weekly");
      if(!w||!w.highlights||!w.highlights.length){el.innerHTML="";return;}
      el.innerHTML=`<div class="weekly-title">本周热点 · weekly signals</div>`+
        (w.overview?`<div class="weekly-ov">${escapeHtml(w.overview)}</div>`:"")+
        w.highlights.map((h,i)=>{const href=h.url?escapeAttr(h.url):`/paper/${escapeAttr(h.paper_id)}`;const tgt=h.url?` target="_blank" rel="noopener"`:"";return `<div class="weekly-hl"><span class="weekly-num">${i+1}</span><a class="weekly-topic" href="${href}"${tgt}>${escapeHtml(h.topic)}</a><span class="weekly-why">— ${escapeHtml(h.why)}</span></div>`;}).join("");
    }
    function range(){const d=ALL.map(p=>p.date).sort();return d.length?`${d[0]} → ${d[d.length-1]}`:'';}

    function allTags(){const s=new Set();ALL.forEach(p=>(p.tags||[]).forEach(t=>s.add(t)));return[...s];}
    const dim=t=>t.split(":")[0], val=t=>t.split(":")[1]||t;

    function renderFilter(){
      const bd={};allTags().forEach(t=>{const d=dim(t);(bd[d]=bd[d]||[]).push(t)});
      document.querySelector("#filter").innerHTML=["方向","应用","硬件","模型"].filter(d=>bd[d]).map(d=>
        `<div class="dim-group"><span class="dim-label">${d}</span>`+
        bd[d].map(t=>`<button class="ftag${ACTIVE.has(t)?" active":""}" data-tag="${escapeAttr(t)}" data-dim="${d}">${escapeHtml(val(t))}</button>`).join("")+
        `</div>`).join("");
    }

    function visible(){
      let l=ALL.filter(p=>ACTIVE.size===0||(p.tags||[]).some(t=>ACTIVE.has(t)));
      if(Q){const q=Q.toLowerCase();l=l.filter(p=>(p.title+p.abstract+(p.tags||[]).join()+p.vendors).toLowerCase().includes(q));}
      l.sort((a,b)=>SORT==="score"?b.score-a.score||b.date.localeCompare(a.date):b.date.localeCompare(a.date));
      return l;
    }
    function sigBars(s){const n=Math.min(5,Math.max(1,Math.ceil(s/4)));const hi=s>=14;let r="";for(let i=0;i<5;i++)r+=`<i class="${i<n?'on':''} ${hi?'hi':''}"></i>`;return r;}

    function renderRow(p){
      const hi=p.score>=14;
      const tags=(p.tags||[]).map(t=>`<span class="tag" data-dim="${dim(t)}">${escapeHtml(val(t))}</span>`).join("");
      return`<a class="row${hi?' hi':''}" href="paper/${escapeAttr(p.id)}.html" onclick="openDetail('${escapeAttr(p.id)}');return false;">
        <span class="sig"><span class="sig-n${hi?' hi':''}">${p.score}</span><span class="sig-bars">${sigBars(p.score)}</span></span>
        <span class="tier">${escapeHtml(p.source_tier||'')}</span>
        ${p.open_source?'<span class="open">OSS</span>':''}
        <span class="date">${p.date}</span>
        <span class="ttl">${escapeHtml(p.title)}</span>
        ${tags?`<span class="tags">${tags}</span>`:''}
        <span class="abs">${escapeHtml(p.abstract||'')}</span>
      </a>`;
    }

    function openDetail(id){
      const p=ALL.find(x=>x.id===id);
      const ov=document.querySelector("#overlay");
      if(!p){ov.classList.add("hidden");return;}
      const tags=(p.tags||[]).map(t=>`<span class="tag" data-dim="${dim(t)}">${escapeHtml(val(t))}</span>`).join("");
      const hi=p.score>=14;
      ov.innerHTML=`<div class="card">
        <span class="card-close" onclick="closeDetail()">esc ✕</span>
        <div class="card-meta"><span class="band-bar" style="display:inline-block;width:3px;height:12px;background:var(--ink)"></span><span class="tier">${escapeHtml(p.source_tier||'')}</span>${p.open_source?'<span class="open">OSS</span>':''}<span class="date">${p.date}</span><span>score ${p.score}</span><span>(${p.score_relevance||0}+${p.score_contribution||0})</span></div>
        <h2>${escapeHtml(p.title)}</h2>
        ${tags?`<div class="tags">${tags}</div>`:''}
        <div class="abs">${escapeHtml(p.abstract||'')}</div>
        ${p.effects?`<div class="field"><b>effects</b>${escapeHtml(p.effects)}</div>`:''}
        ${p.mechanism?`<div class="field"><b>mechanism</b>${escapeHtml(p.mechanism)}</div>`:''}
        ${p.score_reason?`<div class="field"><b>评分依据</b>${escapeHtml(p.score_reason)}</div>`:''}
        ${p.authors?`<div class="field"><b>authors</b>${escapeHtml(p.authors)}</div>`:''}
        ${p.vendors?`<div class="field"><b>vendors</b>${escapeHtml(p.vendors)}</div>`:''}
        ${p.venue?`<div class="field"><b>venue</b>${escapeHtml(p.venue)}</div>`:''}
        ${p.paper_url?`<a class="src" href="${escapeAttr(p.paper_url)}" target="_blank" rel="noopener">原文 ↗ ${escapeHtml(p.paper_url.replace(/^https?:\/\//,'').split('/')[0])}</a>`:''}
      </div>`;
      ov.classList.remove("hidden");
      document.body.style.overflow="hidden";
    }
    function closeDetail(){const ov=document.querySelector("#overlay");ov.classList.add("hidden");ov.innerHTML="";document.body.style.overflow="";}
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});

    function renderPapers(){
      const l=visible(),el=document.querySelector("#papers");
      if(!l.length){el.innerHTML='<div class="empty">no signal — 调整筛选或搜索</div>';renderTabs({});return;}
      const g={};l.forEach(p=>{(g[p.source_tier]=g[p.source_tier]||[]).push(p)});
      const COLLAPSE=25;  // sections with more rows than this start collapsed
      el.innerHTML=TIER.filter(([t])=>g[t]).map(([t,c])=>{
        const cl=g[t].length>COLLAPSE?' collapsed':'';
        return `<section class="band${cl}" id="band-${escapeAttr(t)}"><div class="band-head" onclick="this.parentElement.classList.toggle('collapsed')"><span class="fold">▾</span><span class="band-bar" style="background:${c}"></span><span class="band-title">${t}</span><span class="band-count">${g[t].length}</span>${g[t].length>COLLAPSE?'<span class="band-meta">点击展开</span>':''}</div>`+
        `<div class="band-body">`+g[t].map(renderRow).join("")+`</div></section>`;
      }).join("");
      renderTabs(g);
    }

    function renderTabs(g){
      g=g||{};
      const tabs=TIER.filter(([t])=>g[t]).map(([t,c])=>`<button class="tab" data-target="band-${escapeAttr(t)}">${t}<b>${g[t].length}</b></button>`);
      const tn=(window.__TRENDING__&&window.__TRENDING__.items)?window.__TRENDING__.items.length:(window.__TRENDING__||[]).length;
      if(tn) tabs.push(`<button class="tab" data-target="band-trending">GitHub 热榜<b>${tn}</b></button>`);
      document.querySelector("#tabs").innerHTML=tabs.join("");
    }

    function renderTrendingRow(r){
      return`<a class="row" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">
        <span class="sig"><span class="sig-n">${r.rank}</span><span class="sig-bars">${sigBars(parseInt((r.week||'0').replace(/,/g,''))/2000)}</span></span>
        <span class="tier">trending</span>
        <span class="date">+${escapeHtml(r.week||'')}/wk</span>
        <span class="ttl">${escapeHtml(r.repo)}</span>
        <span class="abs">${escapeHtml(r.desc||'')}</span>
        <span class="open">${escapeHtml(r.total||'')}★</span>
      </a>`;
    }
    function renderTrending(list){
      const el=document.querySelector("#trending");
      if(!list||!list.length){el.innerHTML="";return;}
      el.innerHTML=`<section class="band" id="band-trending"><div class="band-head" onclick="this.parentElement.classList.toggle('collapsed')"><span class="fold">▾</span><span class="band-bar" style="background:var(--slate)"></span><span class="band-title">GitHub 热榜 · 本周 Top ${list.length}</span><span class="band-count">${list.length}</span><span class="band-meta">未筛选 · github.com/trending</span></div>`+
        `<div class="band-body">`+list.map(renderTrendingRow).join("")+`</div></section>`;
    }
    async function loadTrending(){
      let data = window.__TRENDING__ || null;
      if(!data){try{const r=await fetch("/api/trending");data=await r.json();}catch(e){return;}}
      renderTrending(data.items||data||[]);
      attachSpy();
    }

    document.querySelector("#filter").addEventListener("click",e=>{const b=e.target.closest(".ftag");if(!b)return;const t=b.dataset.tag;ACTIVE.has(t)?ACTIVE.delete(t):ACTIVE.add(t);renderFilter();renderPapers();});
    document.querySelector("#search").addEventListener("input",e=>{Q=e.target.value.trim();renderPapers();});
    document.querySelector("#sort-score").addEventListener("click",()=>{SORT="score";document.querySelector("#sort-score").classList.add("on");document.querySelector("#sort-date").classList.remove("on");renderPapers();});
    document.querySelector("#sort-date").addEventListener("click",()=>{SORT="date";document.querySelector("#sort-date").classList.add("on");document.querySelector("#sort-score").classList.remove("on");renderPapers();});

    // sticky tab bar: click → expand + scroll to section
    document.querySelector("#tabs").addEventListener("click",e=>{
      const b=e.target.closest(".tab");if(!b)return;
      const tgt=document.getElementById(b.dataset.target);if(!tgt)return;
      tgt.classList.remove("collapsed");
      tgt.scrollIntoView({behavior:"smooth",block:"start"});
    });
    // scroll-spy: highlight the tab of the section currently in view
    const spy=new IntersectionObserver((ents)=>{
      ents.forEach(en=>{if(en.isIntersecting){const id=en.target.id;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.target===id));}});
    },{rootMargin:"-45% 0px -50% 0px"});
    function attachSpy(){document.querySelectorAll("section.band[id]").forEach(s=>spy.observe(s));}

    function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;");}
    function renderWeekSwitch(){
      const ws=window.__WEEKS__||[];
      const sel=document.querySelector('#week-switch');
      if(!ws.length){sel.style.display='none';return;}
      const mine=window.__WEEK_LABEL__||null;
      sel.innerHTML=ws.map(w=>{
        const isMine=(w.current&&mine===null)||(w.label===mine);
        return `<option value="${escapeAttr(w.href)}"${isMine?' selected':''}>${w.current?'本周 · ':''}${escapeHtml(w.title)}</option>`;
      }).join('');
    }
    document.querySelector('#week-switch').addEventListener('change',e=>{if(e.target.value&&e.target.value!==location.pathname)location.href=e.target.value;});
    renderWeekSwitch();
    loadPapers().catch(e=>{document.querySelector("#summary").textContent=`读取失败：${e}`;});
    loadWeekly().catch(()=>{});
    loadTrending().catch(()=>{});
  </script>
</body>
</html>
