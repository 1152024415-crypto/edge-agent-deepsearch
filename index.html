  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; background: #f7f3ea; color: #202621; }
    main { max-width: 1100px; margin: 0 auto; padding: 18px; }

    .ftag:hover { border-color: #8d3d30; color: #8d3d30; }
    .ftag.active { background: #8d3d30; border-color: #8d3d30; color: #fffaf0; }
    .card { background: #fffdf7; border: 1px solid #cfc6b4; border-radius: 7px; padding: 11px 14px; margin-bottom: 9px; }
    .card-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
    .score { font-weight: 700; color: #8d3d30; font-size: 15px; min-width: 22px; }
    .tier { display: inline-block; padding: 1px 6px; border: 1px solid #8d3d30; color: #8d3d30; font-size: 10px; font-weight: 700; border-radius: 3px; }
    .tier.oss { border-color: #2e7d32; color: #2e7d32; }
    .tier.company { border-color: #5a6b8d; color: #5a6b8d; }
    .tier.school { border-color: #8a6d3b; color: #8a6d3b; }
    .open-badge { display: inline-block; padding: 1px 6px; border: 1px solid #2e7d32; color: #2e7d32; font-size: 10px; font-weight: 700; border-radius: 3px; }
    .date { color: #627066; font-size: 12px; }
    .title { font-weight: 700; font-size: 14px; color: #202621; text-decoration: none; }
    .title:hover { color: #8d3d30; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
    .tag { display: inline-block; padding: 1px 8px; background: #eee7da; border-radius: 10px; font-size: 11px; color: #596258; line-height: 1.5; }
    .field { display: flex; margin-top: 5px; gap: 8px; }
    .label { flex-shrink: 0; width: 64px; color: #627066; font-size: 12px; font-weight: 600; }
    .text { color: #3f463f; font-size: 13px; line-height: 1.5; }

    .card-foot { display: flex; gap: 6px; margin-top: 9px; align-items: center; flex-wrap: wrap; }
    input { padding: 4px 7px; border: 1px solid #cfc6b4; background: #fffaf0; border-radius: 4px; font-size: 12px; color: #202621; }
    input[name="insight_person"] { width: 110px; }
    input[name="wiki_url"] { width: 170px; }
    button { padding: 4px 12px; border: 1px solid #8d3d30; color: #8d3d30; background: #fffaf0; cursor: pointer; border-radius: 4px; font-size: 12px; }
    button:hover { background: #8d3d30; color: #fffaf0; }
    .empty { color: #627066; font-style: italic; padding: 20px; text-align: center; }
    @media (max-width: 640px) {
      .field { flex-direction: column; gap: 1px; }
      .label { width: auto; }
      input[name="insight_person"], input[name="wiki_url"] { width: 100%; }
    }
  </style>

MU + ML Collective（Virginia Smith），arXiv HTML 署名确认。", "source_tier": "学校预印本", "open_source": false, "tags": ["端侧agent", "量化", "编译部署", "小模型"], "insight_person": "", "wiki_url": "", "authors": "Pearse Jim; Steven Kolawole; Opegbemi Matthias Busoye et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T09:42:59.256377+00:00"}, {"id": "flexserve-mobile-llm-serving-2026", "run_id": "run-20260627-real", "title": "FlexServe: A Fast and Secure LLM Serving System for Mobile Devices with Flexible Resource Isolation", "abstract": "面向手机的快速安全 LLM 服务系统，用灵活资源隔离在移动设备上跑 LLM 服务。", "effects": "未报告", "mechanism": "灵活资源隔离机制在移动设备上服务 LLM，兼顾性能与安全。", "paper_url": "https://arxiv.org/abs/2606.23370", "date": "2026-06-22", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确移动设备 LLM 服务（relevance 9）。资源隔离机制有创新（contribution 6）。上海交大 IPADS（并行与分布式系统所），@sjtu.edu.cn 邮箱确认。", "source_tier": "学校预印本", "open_source": false, "tags": ["端侧agent", "推理框架", "安全隐私"], "insight_person": "", "wiki_url": "", "authors": "Yinpeng Wu; Yitong Chen; Lixiang Wang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T09:42:59.256377+00:00"}, {"id": "rope-aware-kvcache-quantization-2026", "run_id": "run-20260627-real", "title": "RoPE-Aware Bit Allocation for KV-Cache Quantization", "abstract": "RoPE 感知的 KV cache 量化位分配，按位置重要性给不同比特，面向端侧推理量化部署。", "effects": "未报告", "mechanism": "利用 RoPE 位置信息指导 KV cache 各维度量化位分配，降低端侧推理显存带宽瓶颈。", "paper_url": "https://arxiv.org/abs/2606.24033", "date": "2026-06-23", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "KV cache 量化面向端侧推理（relevance 8）。RoPE 感知位分配有创新（contribution 6）。HKUST（Jiaya Jia 通讯）+CUHK，合作 Xiaomi MiMo，arXiv HTML 署名确认。", "source_tier": "学校预印本", "open_source": false, "tags": ["KV cache", "量化", "端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Jiaya Jia et al. (HKUST)", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T09:42:59.256377+00:00"}]};</script>
    <script>
    let ALL = [];
    let ACTIVE_TAGS = new Set();

    async function loadPapers() {
      const data = window.__PAPERS__;
      ALL = data.papers || [];
      renderFilterBar();
      renderPapers();
      document.querySelector("#summary").textContent =
        `${ALL.length} 条内容 · 按标签筛选 · 来自服务器最新调研结果`;
    }

    function allTags() {
      const set = new Set();
      ALL.forEach((p) => (p.tags || []).forEach((t) => set.add(t)));
      return [...set].sort();
    }

    function renderFilterBar() {
      const bar = document.querySelector("#filter-bar");
      bar.innerHTML = allTags().map((t) => {
        const active = ACTIVE_TAGS.has(t) ? " active" : "";
        return `<button class="ftag${active}" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</button>`;
      }).join("");
    }

    function visiblePapers() {
      if (ACTIVE_TAGS.size === 0) return ALL;
      return ALL.filter((p) => (p.tags || []).some((t) => ACTIVE_TAGS.has(t)));
    }

    function renderPapers() {
      const list = visiblePapers();
      document.querySelector("#papers").innerHTML = list.length
        ? list.map(renderCard).join("")
        : '<p class="empty">无匹配内容</p>';
    }

    document.querySelector("#filter-bar").addEventListener("click", (event) => {
      const btn = event.target.closest(".ftag");
      if (!btn) return;
      const tag = btn.dataset.tag;
      if (ACTIVE_TAGS.has(tag)) ACTIVE_TAGS.delete(tag); else ACTIVE_TAGS.add(tag);
      renderFilterBar();
      renderPapers();
    });

    function tierClass(tier) {
      return { "官方动态": "", "开源大项目": " oss", "公司项目": " company", "学校顶会": " school", "学校预印本": " school" }[tier] || "";
    }

    function renderCard(p) {
      const tags = (p.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const openBadge = p.open_source ? `<span class="open-badge">开源</span>` : '';
      return `
      <div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-head">
          <span class="score">${p.score}</span>
          <span class="tier${tierClass(p.source_tier)}">${escapeHtml(p.source_tier || '')}</span>
          ${openBadge}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        <div class="tags">${tags}</div>
        <div class="field"><span class="label">这是什么</span><span class="text">${escapeHtml(p.abstract)}</span></div>
        <div class="field"><span class="label">有什么结果</span><span class="text">${escapeHtml(p.effects)}</span></div>
        <div class="field"><span class="label">怎么做到</span><span class="text">${escapeHtml(p.mechanism)}</span></div>
        <div class="score-reason">评分依据：${escapeHtml(p.score_reason || "")}</div>
        <div class="card-foot">
          <input name="insight_person" value="${escapeAttr(p.insight_person || "")}" placeholder="洞察人">
          <input name="wiki_url" value="${escapeAttr(p.wiki_url || "")}" placeholder="wiki 链接">
          <button type="button" data-action="save">保存</button>
        </div>
      </div>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      const card = button.closest(".card");
      await fetch("/api/insights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paper_id: card.dataset.id,
          insight_person: card.querySelector('[name="insight_person"]').value,
          wiki_url: card.querySelector('[name="wiki_url"]').value
        })
      });
      button.textContent = "已保存";
    });

    loadPapers().catch((error) => {
      document.querySelector("#summary").textContent = `读取失败：${error}`;
    });
  </script>
</body>
</html>
