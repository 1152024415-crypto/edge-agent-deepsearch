  <style>
    * { box-sizing: border-box; }

  <script>window.__PAPERS__ = {"papers": [{"id": "mediatek-dgx-spark-local-agents-2026", "run_id": "run-20260627-v5", "title": "Running AI Agents Locally on DGX Spark", "abstract": "联发科介绍如何在NVIDIA DGX Spark上本地运行AI代理，这款桌面级个人AI超算由联发科与NVIDIA联合设计的GB10 Grace Blackwell超级芯片驱动。", "effects": "DGX Spark支持最高1 PFLOP的FP4 AI性能，可流畅运行多个代理并发任务，开发者可从手机平板远程监控代理工作进度，重计算留在本地按需连接云端。", "mechanism": "GB10超级芯片结合联发科CPU性能与功耗效率与NVIDIA加速计算技术，20核CPU与Blackwell GPU共享128GB统一LPDDR5x内存，通过OpenClaw等平台管理代理，支持多节点并行推理。", "paper_url": "https://www.mediatek.com/tek-talk-blogs/running-ai-agents-locally-on-dgx-spark", "date": "2026-06-24", "score": 76, "score_relevance": 25, "score_vendor": 23, "score_contribution": 8, "score_quality": 12, "score_recency": 5, "score_open": 3, "score_reason": "联发科官方技术博客，直接讲述在边缘设备上本地运行AI代理的实践，与端侧agent主题高度契合。DGX Spark为商业产品但提及OpenClaw开源平台，score_open给3分。产品介绍类内容创新度中等。", "source_type": "官方技术博客", "is_major_vendor_official": true, "category": "应用", "keywords": ["联发科", "本地代理", "DGX Spark", "边缘推理", "端侧部署"], "insight_person": "", "wiki_url": "", "authors": "PD Rajput (MediaTek)", "vendors": "MediaTek", "venue": "MediaTek Tek Talk Blog", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:12:21.548277+00:00"}, {"id": "qwen-code-weekly-voice-workflows-2026-06-25", "run_id": "run-20260627-v5", "title": "Qwen Code Weekly: Token Costs at a Glance, Voice Input, Save and Reuse Workflows", "abstract": "通义千问编程代理本周发布五个版本（v0.18.4至v0.19.2），新增语音输入、动态工作流保存复用、Token成本可视化等能力，超140个PR合并。", "effects": "语音输入支持按键和点击两种模式，转录可用qwen3-asr-flash批量或实时WebSocket流式；工作流可保存为斜杠命令跨项目复用；后台代理可在同会话内复活而无需重建上下文。", "mechanism": "语音通过原生麦克风N-API插件采集，批量模式用OpenAI兼容接口转录，实时模式用WebSocket流式PCM传输并显示部分文本；工作流保存为JS脚本到.qwen/workflows目录，支持项目级和用户级；旧转录按cleanupPeriodDays自动过期。", "paper_url": "https://qwenlm.github.io/qwen-code-docs/en/blog/weekly-update-2026-06-25/", "date": "2026-06-25", "score": 70, "score_relevance": 15, "score_vendor": 22, "score_contribution": 8, "score_quality": 12, "score_recency": 5, "score_open": 8, "scor 信任门控。", "effects": "在Jetson真实异构测试床（两个机械臂节点和一个枢纽）上，内存减少2.7倍、上行链路减少2.4倍、注入攻击成功率从0.75降到0，任务准确率从0.528提升到0.605。能耗节省36到40个百分点。", "mechanism": "核心思想是让预算充当策展人：每条记忆条目按价值减去危害的每字节净分评分。KEEP决策在RAM和能耗预算下驱逐低价值字节；SHARE决策仅当价值超过上行链路成本时发送洞察；TRUST决策按来源门控对端条目。在事件边界驱动的压缩下实现亚线性上下文增长。", "paper_url": "https://arxiv.org/abs/2606.25115", "date": "2026-06-23", "score": 67, "score_relevance": 28, "score_vendor": 5, "score_contribution": 13, "score_quality": 13, "score_recency": 5, "score_open": 3, "score_reason": "高度相关：直接针对端侧LLM代理的持续学习和记忆管理，在真实Jetson测试床上验证。创新度高：首次提出净价值每字节的记忆治理统一框架，同时解决内存能耗上行链路和注入安全。作者机构未在arXiv元数据中明确标注，score_vendor保守给5分。论文提及代码将在接受后发布，score_open给3分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "算法", "keywords": ["端侧代理", "记忆管理", "持续学习", "安全隐私", "能耗优化"], "insight_person": "", "wiki_url": "", "authors": "Beining Wu; Zihao Ding; Jun Huang; Yanxiao Zhao", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:12:21.548277+00:00"}, {"id": "scenic-edge-iot-command-generation-2026", "run_id": "run-20260627-v5", "title": "SCENIC: Semantic-Conditioned Edge-Aware Neural Framework for Structured IoT Command Generation", "abstract": "提出SCENIC端到端框架，面向边缘IoT设备的结构化命令生成任务，覆盖模型架构选择、数据生成、三元组损失微调、剪枝量化到部署导出的完整流程，使用亚0.2B规模Transformer骨干。", "effects": "最强密集解码器在Smart Home Instruct-Bench上达到99.0%的EM@1；剪枝INT8编码器-解码器导出保留91.0%的EM@1和99.0%的EM@5，模型大小减少25.38%；TensorRT在NVIDIA 2:4稀疏编码器上实现1.8倍编码器加速。", "mechanism": "将边缘IoT命令生成建模为多对一结构化输出任务，多条自然语言指令映射到同一规范命令串。采用三元组对比监督微调，对亚0.2B骨干进行剪枝和INT8量化，部署时编码器-解码器架构在高稀疏下保留更强性能。代码和实验制品开源。", "paper_url": "https://arxiv.org/abs/2606.22296", "date": "2026-06-21", "score": 63, "score_relevance": 22, "score_vendor": 5, "score_contribution": 11, "score_quality": 12, "score_recency": 5, "score_open": 8, "score_reason": "相关度较高：直接面向边缘IoT设备的命令生成，使用亚0.2B超小模型，与端侧agent的轻量化部署方向契合。创新度中等偏上：完整端到端流程含剪枝量化和硬件加速评测。代码和实验制品已开源（CC BY 4.0），score_open给8分。作者机构未明确标注，score_vendor保守给5分。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "应用", "keywords": ["边缘IoT", "命令生成", "模型压缩", "量化", "智能家居"], "insight_person": "", "wiki_url": "", "authors": "Luke Ztz Hu; Hongbing Lang; Songping Mai", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:12:21.548277+00:00"}, {"id": "swarmx-tencent-agentic-scheduling-2026", "run_id": "run-20260627-v5", "title": "SwarmX: Agentic Scheduling for Low-Latency Agentic Systems", "abstract": "腾讯提出SwarmX，面向低延迟代理式应用的调度系统，通过调度感知的神经预测器捕捉提示词和设备运行时特征，为路由器和缩放器提供尾延迟感知决策，已在近千块GPU和百万核CPU的生产环境部署。", "effects": "在多代理代码生成、深度研究和多模态代理工作流上，尾延迟相比最优调度器降低最高61.5%，在相同SLO下吞吐量达到2倍。128块GPU测试床和大规模生产环境双重验证。", "mechanism": "SwarmX使用调度感知神经预测器捕获提示词、设备、运行时和目标模型特征，将分布预测暴露给路由器和缩放器做尾感知决策，集成到调度器-代理框架中与现有调度和模型服务基础设施对接。", "paper_url": "https://arxiv.org/abs/2606.21401", "date": "2026-06-19", "score": 59, "score_relevance": 15, "score_vendor": 16, "score_contribution": 12, "score_quality": 12, "score_recency": 4, "score_open": 0, "score_reason": "腾讯公司项目，arXiv论文PDF中作者邮箱为tencent.com（elonsu和sarlmolchen），affiliation证据明确。相关度中等：代理调度系统为云端基础设施，非纯端侧部署，但代理式系统编排对端侧多代理架构有间接参考。生产级部署创新度和质量较高。未提及开源。", "source_type": "学术论文", "is_major_vendor_official": false, "category": "框架", "keywords": ["代理调度", "低延迟", "腾讯", "多代理系统", "生产部署"], "insight_person": "", "wiki_url": "", "authors": "Yeqi Huang; Yanwei Ye; Guomin Chen; Wenhao Su; Bin Gong; Jialian Li; Zhan Lu; Yangshen Deng; Xuan Sun; Le Xu; Luo Mai", "vendors": "Tencent", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-06-27T03:12:21.548277+00:00"}]};</script>
    <script>
    async function loadPapers() {
      const data = window.__PAPERS__;
      const all = data.papers || [];
      // 按 source_type 分两组；tab 内保持 API 返回顺序（storage 已按 is_major_vendor_official DESC, score DESC 排）
      const academic = all.filter((p) => p.source_type === "学术论文");
      const official = all.filter((p) => p.source_type === "官方技术博客" || p.source_type === "官方产品发布");
      const groups = [
        { id: "academic", papers: academic },
        { id: "official", papers: official }
      ];
      const defaultIdx = groups.findIndex((g) => g.papers.length > 0);
      const activeIdx = defaultIdx === -1 ? 0 : defaultIdx;

      document.querySelector("#count-academic").textContent = String(academic.length);
      document.querySelector("#count-official").textContent = String(official.length);
      document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === activeIdx));

      document.querySelector("#papers").innerHTML = groups.map((g, i) =>
        `<div class="cat-panel${i === activeIdx ? " active" : ""}" data-panel="${g.id}" role="tabpanel">${
          g.papers.map(renderCard).join("") || '<p class="empty">本周无此方向内容</p>'
        }</div>`
      ).join("");

      document.querySelector("#summary").textContent = `${all.length} 条内容 · 官方大厂优先 · 来自服务器最新调研结果`;
    }

    document.querySelector("#tabs").addEventListener("click", (event) => {
      const btn = event.target.closest(".tab");
      if (!btn) return;
      const id = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === id));
      document.querySelectorAll(".cat-panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === id));
    });

    function renderCard(p) {
      const kws = (p.keywords || []).map((k) => `<span class="kw">${escapeHtml(k)}</span>`).join("");
      const vendorsRaw = (p.vendors || '').trim();
      const official = vendorsRaw ? `<span class="vendor-tag">${escapeHtml(vendorsRaw)}</span>` : (p.is_major_vendor_official ? `<span class="vendor-badge">官方大厂</span>` : '');
      const openBadge = (p.score_open || 0) > 0 ? `<span class="open-badge">开源</span>` : '';
      return `
      <div class="card" data-id="${escapeAttr(p.id)}">
        <div class="card-head">
          <span class="score">${p.score}</span>
          ${official}
          ${openBadge}
          <span class="date">${p.date}</span>
          <a class="title" href="paper/${escapeAttr(p.id)}.html">${escapeHtml(p.title)}</a>
        </div>
        <div class="keywords">${kws}</div>
        <div class="field"><span class="label">论文摘要</span><span class="text">${escapeHtml(p.abstract)}</span></div>
        <div class="field"><span class="label">论文效果</span><span class="text">${escapeHtml(p.effects)}</span></div>
        <div class="field"><span class="label">工作原理</span><span class="text">${escapeHtml(p.mechanism)}</span></div>
        <div class="score-reason">评分依据：${escapeHtml(p.score_reason || "")}</div>
        <div class="score-dims">契合${p.score_relevance ?? ''}·厂商${p.score_vendor ?? ''}·贡献${p.score_contribution ?? ''}·质量${p.score_quality ?? ''}·时效${p.score_recency ?? ''}·开源${p.score_open ?? ''}</div>
        <div class="card-foot">
          <input name="insight_person" value="${escapeAttr(p.insight_person || "")}" placeholder="洞察人">
          <input name="wiki_url" value="${escapeAttr(p.wiki_url || "")}" placeholder="wiki 链接">
          <button type="button" data-action="save">保存</button>
        </div>
      </div>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      const card = button.closest(".card");
      await fetch("/api/insights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paper_id: card.dataset.id,
          insight_person: card.querySelector('[name="insight_person"]').value,
          wiki_url: card.querySelector('[name="wiki_url"]').value
        })
      });
      button.textContent = "已保存";
    });

    loadPapers().catch((error) => {
      document.querySelector("#summary").textContent = `读取失败：${error}`;
    });
