<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RADAR · 端侧 AI Agent 信号</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#eef1f3; --panel:#ffffff; --ink:#0b1a24; --muted:#5a6b78; --faint:#8a99a6;
      --rule:#d4dae0; --hair:#e3e8ec;
      --amber:#c2410c; --green:#15803d; --blue:#1d4ed8; --purple:#6d28d9; --slate:#64748b;
      --fx:#c2410c; --app:#15803d; --hw:#1d4ed8; --model:#6d28d9;
    }
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;font-size:14px;line-height:1.5}
    main{max-width:1100px;margin:0 auto;padding:20px 22px 80px}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

    /* scope header */
    .scope{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px 0;margin-bottom:14px;overflow:hidden}
    .scope-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;letter-spacing:2px;color:var(--ink)}
    h1 .sub{font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0;margin-left:8px}
    .scope-stats{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
    .scope-stats b{color:var(--ink);font-weight:600}
    .sweep{height:2px;margin:12px -16px 0;background:linear-gradient(90deg,transparent 0%,var(--hair) 20%,var(--hair) 80%,transparent 100%);position:relative;overflow:hidden}
    .sweep::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:sweep 3.2s linear infinite}
    @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    @media(prefers-reduced-motion:reduce){.sweep::after{animation:none;opacity:.5}}
    .controls{display:flex;gap:10px;align-items:center;padding:10px 0 12px;flex-wrap:wrap}
    .search{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--rule);border-radius:4px;background:#fbfcfd;font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--ink)}
    .search:focus{outline:none;border-color:var(--ink)}
    .sort{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);display:flex;gap:4px;align-items:center}
    .sort button{border:1px solid var(--rule);background:#fbfcfd;color:var(--muted);font-family:inherit;font-size:11px;padding:3px 8px;border-radius:3px;cursor:pointer}
    .sort button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

    /* weekly highlights */
    .weekly{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:6px;padding:14px 16px;margin-bottom:16px}
    .weekly-title{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600}
    .weekly-ov{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:8px}
    .weekly-hl{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--hair)}
    .weekly-hl:first-of-type{border-top:none}
    .weekly-num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);font-weight:600;min-width:16px}
    .weekly-topic{font-weight:600;font-size:13px;color:var(--ink);text-decoration:none}
    .weekly-topic:hover{color:var(--amber)}
    .weekly-why{color:var(--muted);font-size:12px;line-height:1.45}
    /* filter */
    .filter{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-bottom:16px}
    .dim-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:5px}
    .dim-group:last-child{margin-bottom:0}
    .dim-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);min-width:34px;text-transform:uppercase;letter-spacing:.5px}
    .ftag{padding:2px 8px;border:1px solid var(--rule);background:#fbfcfd;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;border-radius:3px;cursor:pointer;line-height:1.5}
    .ftag:hover{border-color:var(--ink);color:var(--ink)}
    .ftag.active[data-dim=方向]{background:var(--fx);color:#fff;border-color:var(--fx)}
    .ftag.active[data-dim=应用]{background:var(--app);color:#fff;border-color:var(--app)}
    .ftag.active[data-dim=硬件]{background:var(--hw);color:#fff;border-color:var(--hw)}
    .ftag.active[data-dim=模型]{background:var(--model);color:#fff;border-color:var(--model)}

    /* tier bands */
    section.band{margin-bottom:20px;scroll-margin-top:54px}
    /* sticky section tabs */
    .tabs{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 8px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
    .tab{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 11px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);color:var(--muted);cursor:pointer;line-height:1.5}
    .tab b{color:var(--ink);font-weight:600;margin-left:5px}
    .tab:hover{border-color:var(--ink);color:var(--ink)}
    .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .tab.active b{color:#fff}
    .band-head{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 0 4px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
    .band-head:hover .band-title{color:var(--amber)}
    .fold{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);transition:transform .15s;display:inline-block;width:10px}
    .band.collapsed .fold{transform:rotate(-90deg)}
    .band.collapsed .band-body{display:none}
    .band-body{}
    .band-bar{width:3px;height:14px;border-radius:1px}
    .band-title{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
    .band-count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
    .band-meta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);margin-left:auto}

    /* signal row */
    .row{display:flex;align-items:baseline;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--hair);border-radius:5px;margin-bottom:6px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .06s}
    .row:hover{border-color:var(--rule);transform:translateX(2px)}
    .row.hi{border-left:3px solid var(--amber);padding-left:10px}
    .sig{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px;flex-shrink:0}
    .sig-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink)}
    .sig-n.hi{color:var(--amber)}
    .sig-bars{display:flex;gap:1.5px;align-items:flex-end;height:9px}
    .sig-bars i{width:3px;height:9px;background:var(--hair);border-radius:1px}
    .sig-bars i.on{background:var(--ink)}
    .sig-bars i.on.hi{background:var(--amber)}
    .tier{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);flex-shrink:0}
    .date{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);flex-shrink:0}
    .open{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--green);font-weight:600;flex-shrink:0}
    .ttl{font-weight:600;font-size:13.5px;flex:1;min-width:160px}
    .row:hover .ttl{color:var(--amber)}
    .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
    .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 6px;border-radius:2px;line-height:1.5}
    .tag[data-dim=方向]{color:var(--fx);background:#fbeae3}
    .tag[data-dim=应用]{color:var(--app);background:#e3f0e8}
    .tag[data-dim=硬件]{color:var(--hw);background:#e3ecf8}
    .tag[data-dim=模型]{color:var(--model);background:#eee6f7}
    .abs{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}
    .empty{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:13px;padding:30px;text-align:center}

    /* detail overlay (rendered from inlined data — no server fetch, so a stale
       cached index never 404s when clicking a paper) */
    .overlay{position:fixed;inset:0;background:rgba(11,26,36,.45);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
    .overlay.hidden{display:none}
    .card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;max-width:720px;width:100%;padding:20px 22px;box-shadow:0 8px 30px rgba(11,26,36,.18)}
    .card-close{float:right;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:2px 9px;background:#fbfcfd}
    .card-close:hover{color:var(--ink);border-color:var(--ink)}
    .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin:4px 0 10px}
    .card h2{margin:0 0 8px;font-size:17px;font-weight:700;line-height:1.35}
    .card .abs{margin:10px 0;color:var(--ink);font-size:13px}
    .card .field{margin:8px 0;font-size:12.5px;line-height:1.55}
    .card .field b{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
    .card .src{display:inline-block;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--amber);text-decoration:none;border:1px solid var(--amber);border-radius:4px;padding:5px 10px}
    .card .src:hover{background:var(--amber);color:#fff}
    @media(max-width:640px){.row{flex-wrap:wrap}.ttl{min-width:100%}}
  </style>
</head>

": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01590", "run_id": "run-20260703-real4", "title": "Hawk: Harnessing Hardware-Aware Knowledge for High-Performance NPU Kernel Generation", "abstract": "Hawk 是免训练框架,用硬件感知知识合成、瓶颈感知检索与效果驱动蒸馏,让 LLM 为 NPU 自动生成可高性能执行的内核。", "effects": "在真实 NPU 工作负载上生成准确率从 49.4% 提升到 80.0%,执行速度最高 2.2 倍于 SOTA。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01590", "date": "2026-07-02", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "面向 NPU 内核生成,端侧硬件栈;免训练框架与三模块设计创新度高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:蒸馏", "方向:记忆", "方向:评测基准", "硬件:NPU"], "insight_person": "", "wiki_url": "", "authors": "Junyi Wen, Ruiyan Zhuang, Yongjia Xu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02277", "run_id": "run-20260703-real4", "title": "NEUROSYMLAND: Neuro-Symbolic Landing-Site Assessment for Robust and Edge-Deployable UAV Autonomy", "abstract": "无人机着陆点评估系统,把轻量感知与符号安全推理结合,从机载视觉构建概率语义场景图并按地形平坦度/障碍/空间一致性评估候选着陆区。", "effects": "72 个仿真场景中 61 次成功评估,优于 4 个基线(37-57);100 次硬件在环试验,符号推理仅占端到端延迟小部分。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02277", "date": "2026-07-02", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确 edge-deployable/edge-constrained UAV 硬件;神经符号着陆评估,有硬件在环实测。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent", "硬件:GPU", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Weixian Qian, Tianyi Yang, Sebastian Schroder et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01602", "run_id": "run-20260703-real4", "title": "ProWAFT: A ROMA-LPD Instance for Workload-Aware and Dynamic Fault Tolerance in FPGA-Based CNN Accelerators", "abstract": "ProWAFT 是 FPGA 上 e_reason": "明确面向边缘的推理大模型 serving,负载感知早退有实用新意。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "模型:DeepSeek", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Zhiqing Tang, Size Li, Hanshuai Cui et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00170", "run_id": "run-20260703-real4", "title": "Scaling Up Thermodynamic AI Models", "abstract": "把高温Gibbs采样Ising系统的时均行为可训练化，提出纯反向传播算法训练深度卷积网络用于Ising机硬件的热力学推理，并建立推理成本-精度-自相关时间理论。", "effects": "在CIFAR-10/100上分别达94.9%/76.0%精度，实验验证推理成本与精度可控折损，给出最优推理调度算法。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00170", "date": "2026-06-30", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "热力学AI面向低功耗边缘推理硬件，端侧属性强；可训练算法与成本理论创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Andrew G. Moore", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31145", "run_id": "run-20260703-real4", "title": "SeKV: Resolution-Adaptive KV Cache with Hierarchical Semantic Memory for Long-Context LLM Inference", "abstract": "提出SeKV分辨率自适应语义KV缓存，用熵引导语义段跨GPU-CPU分层存储，GPU上存轻量摘要做粗路由、CPU上存低秩SVD基按需重建token级细节，训练zoom-in机制选择性展开。", "effects": "四个基准上比最强语义压缩基线平均提升5.9%，128K上下文下GPU内存比全KV缓存减少53.3%，可训参数少于0.05%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31145", "date": "2026-06-30", "score": 16, "score_relevance": 8, "score_contribution": 8, "score_reason": "KV缓存分层压缩面向长上下文LLM，可惠及端侧GPU内存受限场景；SVD基重建创新高。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:KV cache", "方向:记忆", "方向:评测基准", "硬件:GPU", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Amirhossein Abaskohi, Giuseppe Carenini, Peter West et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29580", "run_id": "run-20260703-real4", "title": "MAM-AI: An On-Device Medical Retrieval-Augmented Generation System for Nurses and Midwives in Zanzibar", "abstract": "MAM-AI 是面向桑给巴尔护士助产士的端侧医疗问答助手,完全在普通 Android 设备上离线运行:300M 嵌入检索 + 4B int4 生成器,带引用回答。", "effects": "300M 嵌入检索排第三逼近云端;4B 生成器忠实度约为前沿模型两倍,重设计提示把回避率从 33% 降到 3%;4B 难以兼顾有用与安全。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29580", "date": "2026-06-28", "score": 16, "score_relevance": 9, "score_contribution": 7, "score_reason": "明确 on-device Android 离线;完整部署系统+分层评估,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:评测基准", "方向:端侧agent", "硬件:手机", "模型:Gemma", "应用:RAG"], "insight_person": "", "wiki_url": "", "authors": "Yi Ren", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01757", "run_id": "run-20260703-real4", "title": "DL-VINS-Factory: A Modular Framework for Learned Visual Front-Ends in Visual-Inertial SLAM", "abstract": "DL-VINS-Factory 是模块化框架,把学习特征提取器(ALIKED/RaCo/SuperPoint/XFeat)与光流或 LightGlue 匹配集成进视觉惯性 SLAM,在嵌入式平台实时运行。", "effects": "EuRoC ATE 单目降 5%、双目闭环降 7%;NTU-VIRAL 闭环 ATE 降 12%;Botanic Garden SuperPoint+LK 降 29%、RaCo+LK 降 38%;Jetson AGX Orin 上单目 29-47 FPS、双目 18-33 FPS;AnyLoc 比 BRIEF+DBoW2 多 2-7 倍有效闭环。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01757", "date": "2026-07-02", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 Jetson AGX Orin 嵌入式实时 VI-SLAM;模块化基准,实测充分但方法组合为主。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:端侧agent", "硬件:Jetson"], "insight_person": "", "wiki_url": "", "authors": "Shoon Kit Lim, Melissa Jia Ying Chong, Ting Yang Ling", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01794", "run_id": "run-20260703-real4", "title": "Lightweight Safe Reinforcement Learning for End-to-End UAV Navigation", "abstract": "面向 UAV 导航的安全约束感知控制一体化框架,用轻量网络(非对称+深度可分离卷积)编码稀疏观测,在层级控制下用拉格朗日 safe PPO 求解。", "effects": "不同障碍密度和飞行速度下成功率、安全性、效率均优于已有 RL 基线;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01794", "date": "2026-07-02", "score": 15, "score_relevance": 9, "score_contribution": 6, "score_reason": "明确 lightweight onboard 部署;轻量网络+安全约束层级控制,常见方法组合。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏"], "insight_person": "", "wiki_url": "", "authors": "Shenghui Zhang, YuXuan Gao, Songwei Zhao et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01394", "run_id": "run-20260703-real4", "title": "The Wiola Architecture for Efficient Small Language Models", "abstract": "提出从零原创的Wiola小语言模型架构，含螺旋旋转位置编码、门控跨层注意力、自适应token合并、双流前馈和带偏置RMSNorm五个新组件，发布120M到1.5B四档。", "effects": "提供完整数学推导、复杂度分析与对比，四档模型全部兼容HuggingFace，22个架构单元测试通过。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01394", "date": "2026-07-01", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "原创SLM架构、最大1.5B适配端侧；五组件新颖但缺端侧实测效果对比。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "模型:Llama", "模型:Mistral", "模型:GPT"], "insight_person": "", "wiki_url": "", "authors": "Aryuemaan Kumar Chowdhury, Afreen Shaik, Yaparla Bhargavi et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31490", "run_id": "run-20260703-real4", "title": "Dynamic Ultrasound Beamforming Using Left-to-Right Arithmetic Adders on FPGA", "abstract": "用左到右(MSDF)算术加法器树替代传统并行加法树做超声 DAS 波束成形 FPGA 实现,支持运行时动态精度,无需等全精度完成即可输出高质量图像。", "effects": "Xilinx Zynq XC7Z010 上比最小传统树少 2.5x LUT,满足时序,动态功耗降 23%;等面积复制最高 15 并行实例达 67 FPS,吞吐高 80%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31490", "date": "2026-06-30", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "明确小型 FPGA 实时成像;MSDF 加法器树+动态精度,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Muhammad Usman, Shujaat Khan, Dorit Merhof", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31456", "run_id": "run-20260703-real4", "title": "Zero-Shot Quantization for Object Detectors using Off-the-Shelf Generative Models", "abstract": "GoodQ 用现成生成模型为边缘端目标检测器构造零样本量化训练集,通过信息密集提示、分布感知选择和教师引导降噪,在无原始训练数据时低比特量化。", "effects": "在 W4A4 低比特零样本量化达 SOTA,并扩展到 W3A3 极端位宽。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31456", "date": "2026-06-30", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "明确边缘端目标检测器量化,端侧技术栈;生成模型+三挑战应对有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Hyunho Lee, Kyomin Hwang, Hyeonjin Kim et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30919", "run_id": "run-20260703-real4", "title": "Budget-Adaptive Routing: Skipping the Weak When the Strong Answers Anyway", "abstract": "提出预算自适应路由,在端云协作里按卸载预算在弱跳过估计器和弱条件放置间选择,弱跳过估计器从原始像素提路由信号比弱检测器轻 29 倍。", "effects": "PASCAL VOC 上追踪两种固定放置的精度上包络,每帧延迟最多降 19.1ms(约 30%),部分操作点比强模型还高 1.7pp mAP。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30919", "date": "2026-06-29", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "端云协作路由,明确边缘检测场景,弱跳过估计器有新意。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端云协同", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Wei Geng, Nitinder Mohan, Jörg Ott", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30554", "run_id": "run-20260703-real4", "title": "SubEdge: A Subscriber-Centric Edge Computing Subsystem in 6G Networks for AI", "abstract": "SubEdge 是 6G 网络中面向订阅者的边缘计算子系统,为每个订阅者绑定推理容器、边缘节点与服务授权,并在移动时同步迁移算力实例与路由策略。", "effects": "95 分位延迟从 22.9ms 降到 12.2ms,6 次移动事件零丢包;30fps 端到端推理帧送达 99.92%;最多 50 订阅者同时迁移 1560 次操作 100% 成功。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30554", "date": "2026-06-29", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "明确 edge computing 6G;按订阅者算力迁移+computing context,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Abdirazak Ali Asir Rage, Riccardo Pozza, Rahim Tafazolli", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29575", "run_id": "run-20260703-real4", "title": "TF-MoE: Time-Frequency Mixture-of-Experts for Efficient Speech Separation", "abstract": "TF-MoE 是稀疏混合专家语音分离框架,在时频两维交替动态选专家,基于 mel 分割 Conformer 骨干,在低算力下增强容量几乎不增推理成本。", "effects": "Libri2Mix 上同 4.1 GMACs/s 算力下比 BSRNN 高 +3.8 dB SDR。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29575", "date": "2026-06-28", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "明确面向边缘设备的语音分离,时频 MoE 设计有新意。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:MoE", "方向:端侧agent", "应用:语音"], "insight_person": "", "wiki_url": "", "authors": "Qinzhe Hu, Chenda Li, Wangyou Zhang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29581", "run_id": "run-20260703-real4", "title": "The Joint Effect of Quantization and Sampling Temperature on LLM Safety Alignment: A Factorial Analysis", "abstract": "用因子实验研究量化与采样温度对LLM安全对齐的联合影响，覆盖9个指令模型、3精度322k响应由六模型安全集成判定。", "effects": "标准INT4/INT8量化对7/9模型安全中性，温度升高使脆弱模型决策不稳（DFR达53.0%），二者不构成双倍惩罚；提出部署应报告多样本稳定性。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29581", "date": "2026-06-28", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "量化部署安全面向端侧低比特部署，端侧属性强；首个量化-温度因子安全分析有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:评测基准", "应用:语音"], "insight_person": "", "wiki_url": "", "authors": "Hari Prasad, Ritam Pal", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29052", "run_id": "run-20260703-real4", "title": "Importance-Aware Resource Allocation for Collaborative Task-Oriented Semantic Communication", "abstract": "提出iCoTASC多设备语义通信框架，用归因重要性指导每维嵌入选择，用数据驱动效用函数建模量化递减收益，离线预计算每发射端效用查找表，在线查表+低复杂度细化实现时变信道下实时调度。", "effects": "支持实时信道自适应语义资源分配，无需重训任务推理模型，改善通信-精度折损。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29052", "date": "2026-06-27", "score": 15, "score_relevance": 8, "score_contribution": 7, "score_reason": "多设备语义通信无线资源调度面向端侧边缘协同，端侧属性强；离线表+在线查表设计有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化"], "insight_person": "", "wiki_url": "", "authors": "Kaiyi Lei, Yuanzhe Peng, Letian Zhang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02298", "run_id": "run-20260703-real4", "title": "Real-Time Visual Intelligence on Low-Cost UAVs: A Modular Approach for Tracking, Scanning, and Navigation", "abstract": "在DJI Tello低成本无人机上搭一套模块化智能系统，集成人脸检测、人脸识别和单目深度估计，配Web界面实现实时控制和视频监控。", "effects": "在真实环境下完成人员跟踪、室内扫描和虚拟传感器循线，验证了轻量神经模型在受限硬件上实时部署的可行性。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02298", "date": "2026-07-02", "score": 14, "score_relevance": 9, "score_contribution": 5, "score_reason": "明确端侧UAV+轻量模型实时部署，端侧属性强；工程集成度高但创新偏常见。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Andrei-Marian Ungureanu, Stelian Spînu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01876", "run_id": "run-20260703-real4", "title": "SAB-LVLM: Significance-Aware Binarization for Large Vision-Language Models", "abstract": "SAB-LVLM 针对大型视觉语言模型做显著性感知二值化,用空间显著性图区分单模态与跨模态激活权重,在约 1-bit 压缩下优于已有二值化 PTQ 方法。", "effects": "约 1-bit 压缩约束下优于现有 binary PTQ 方法;未报告具体精度数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01876", "date": "2026-07-02", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "二值化(量化)面向资源受限设备;跨层跨模态显著性图+交替更新,创新较高。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:记忆", "方向:多模态"], "insight_person": "", "wiki_url": "", "authors": "Qi Lyu, Jiahua Dong, Baichen Liu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01127", "run_id": "run-20260703-real4", "title": "$\\text{Log}_\\text{b}$Quant: Quantizing Language Models in Logarithmic Space", "abstract": "提出Log_bQuant对数空间量化方法，用可调基对数编码适配常见参数分布，在4bit精度下相比非对称线性量化取得更优表现。", "effects": "4bit下多个基准优于张量级非对称线性量化，并实现中等加速与高内存节省，适合消费级GPU私有部署。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01127", "date": "2026-07-01", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "面向消费级GPU/边缘设备的LLM量化，端侧属性强；对数码本有创新但属常见量化路线。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:记忆", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Jeremias Bohn, Tizian Dippold, Mahdi Koubaa et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00687", "run_id": "run-20260703-real4", "title": "LUMA: Benchmarking Segmentation via a Lightweight Universal Mask Adapter", "abstract": "提出LUMA轻量通用mask适配器，把任意主干当黑盒特征提取器，用查询经廉价交叉注意力读取特征，固定该头后统一评测20个主干与11种预训练。", "effects": "在ADE20K/Cityscapes上以更低成本匹配SOTA高效ViT分割器EoMT；发现纯ViT在各分辨率都占吞吐帕累托前沿，预训练目标比架构更决定质量。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00687", "date": "2026-07-01", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "轻量分割头可适配多种主干，端侧视觉技术栈；统一基准与发现预训练为主杠杆有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Tobias Christian Nauen, Anosh Billimoria, Federico Raue et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01520", "run_id": "run-20260703-real4", "title": "The risk of KV cache compression", "abstract": "从理论角度刻画KV缓存压缩的minimax风险，用缓存的内在可压缩性来判定何时可精确压缩，并据此给出因果掩码下的设计原则与实用算法。", "effects": "在LongBench定向实验上取得有前景表现，提供了有理论保证的KV缓存压缩途径。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01520", "date": "2026-07-01", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "KV缓存压缩服务长上下文推理，可惠及端侧；minimax理论刻画创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache"], "insight_person": "", "wiki_url": "", "authors": "Lukas Haverbeck, Carmen Amo Alonso, Andres Felipe Posada-Moreno et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31519", "run_id": "run-20260703-real4", "title": "RaBitQCache: Rotated Binary Quantization for KVCache in Long Context LLM Inference", "abstract": "提出RaBitQCache长上下文稀疏注意力框架，用随机旋转二值量化和高吞吐二值-INT4运算估计注意力权重，作为无偏代理分数支持自适应Top-p检索，并做硬件感知异步流水线。", "effects": "显著加速推理、降低内存IO，生成质量保持，优于SOTA基线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31519", "date": "2026-06-30", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "KV缓存二值量化加速长上下文推理，可惠及端侧；无偏估计与误差界有创新。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:量化", "方向:KV cache", "方向:剪枝稀疏", "方向:稀疏注意力", "方向:记忆", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Wenhao Li, Jinhao Dong, Hailin Zhang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29982", "run_id": "run-20260703-real4", "title": "Beyond Uniform Experts: Cost-Aware Expert Execution for Efficient Multi-Device MoE Inference", "abstract": "CAEE 是硬件引导的运行时框架,用轻量校准成本模型估计硬件开销,选择剪掉低重要高成本专家并用低开销补偿重分配,避免额外数据移动。", "effects": "在 671B DeepSeek-R1 上端到端推理延迟降 8-18%,覆盖专家卸载和多设备端上执行,精度下降小于 1%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29982", "date": "2026-06-29", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "多设备 MoE 推理含端上执行,成本感知剪枝有新意。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:记忆", "方向:MoE", "方向:端云协同", "方向:评测基准", "方向:端侧agent", "模型:DeepSeek"], "insight_person": "", "wiki_url": "", "authors": "Hui Zang, Pengfei Xia, Hong Liu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30062", "run_id": "run-20260703-real4", "title": "Little Brains, Big Feats: Exploring Compact Language Models", "abstract": "研究小型语言模型在 RAG 系统生成阶段的表现,用开源与专有数据集跨多领域多题型基准测试,发现小模型 RAG 可在无 GPU 设备上直接端侧运行。", "effects": "小模型 RAG 可在无 GPU 设备上合理时间端侧运行;未报告具体精度数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30062", "date": "2026-06-29", "score": 14, "score_relevance": 9, "score_contribution": 5, "score_reason": "明确 on-device 无 GPU;基准评测为主,创新中等。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准", "方向:端侧agent", "硬件:GPU", "应用:RAG"], "insight_person": "", "wiki_url": "", "authors": "Dari Baturova, Elena Bruches, Ivan Chernov et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29824", "run_id": "run-20260703-real4", "title": "Neural Procedural Memory: Empowering LLM Agents with Implicit Activation Steering", "abstract": "提出神经过程记忆NPM，免训练框架用历史对比经验蒸馏出激活空间中的引导向量，直接激活任务相关神经机制代替显式文本指令，与显式工作流互补提升鲁棒性。", "effects": "在四个agent基准上与显式文本指令基线相当，隐式引导+显式工作流互补更鲁棒，表示分析显示引导向量编码一致任务逻辑。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29824", "date": "2026-06-29", "score": 14, "score_relevance": 7, "score_contribution": 7, "score_reason": "agent记忆面向轻量部署，端侧技术栈；隐式激活引导免训练有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:记忆", "方向:评测基准", "方向:端侧agent", "应用:RAG"], "insight_person": "", "wiki_url": "", "authors": "Chengfeng Zhao, Yuqiao Tan, Shizhu He et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29910", "run_id": "run-20260703-real4", "title": "Sphere-VIO: Fast and Robust Visual-Inertial Odometry via Unified Spherical Representation for Heterogeneous Multi-Camera Systems", "abstract": "Sphere-VIO 是面向异构多相机系统的轻量滤波 VIO,用统一球面全景模型支持所有标准相机模型,加并行加速深度引导半直接跟踪和多相机 ESKF 后端。", "effects": "在公开基准和自制全向数据集上准确率、鲁棒性、效率、跨相机通用性权衡最优;具体数值未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29910", "date": "2026-06-29", "score": 14, "score_relevance": 8, "score_contribution": 6, "score_reason": "资源受限设备的视觉惯性里程计,明确端侧机器人感知。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Yueteng Yang, Yusen Xie, Hao Wei et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30265", "run_id": "run-20260703-real4", "title": "When Is a Draft Accepted? A Theory of Acceptance in Speculative Decoding", "abstract": "为推测解码的贪心、放松接受和树形候选等确定性局部接受事件建立理论，刻画拒绝域为目标分布的下水平集，给出KL散度精确证书和基于margin的锐界。", "effects": "在Qwen3模型上验证放松与树形准则显著扩大认证接受区，尤其在目标分布margin低的解码步。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30265", "date": "2026-06-29", "score": 14, "score_relevance": 6, "score_contribution": 8, "score_reason": "推测解码理论可服务端侧推理加速；确定性接受事件的理论刻画创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Aaryam Sharma", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02199", "run_id": "run-20260703-real4", "title": "Fourier Preconditioning for Neural Feature Learning", "abstract": "研究H-Score特征学习网络对输入基旋转的敏感性，提出用FFT做数据无关的低成本预条件器，把预测性依赖集中到少数主模式以降低有限宽度截断误差。", "effects": "在八个多变量数据集上FFT预条件在资源受限场景最多降低50% NMSE，并提出与实测增益相关的谱熵指标。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02199", "date": "2026-07-02", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "信号处理特征学习，强调资源受限场景，属端侧技术栈；理论与方法有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗"], "insight_person": "", "wiki_url": "", "authors": "Preston Pitzer, Anish Pradhan, Harpreet S. Dhillon", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02010", "run_id": "run-20260703-real4", "title": "InduceKV: Fixed-Footprint Continual Adaptation of Multimodal LLMs via Inducing KV Memories", "abstract": "InduceKV 是基于检索的固定内存占用持续适应方法,把每个训练前缀存为可直接拼到 self-attention 缓存的 KV 记忆,在固定预算下持续学习多模态 LLM。", "effects": "任务增量指令调优、持续 VQA、域增量、终身多模态指令调优上,匹配内存预算下一致优于 PEFT/MoE/replay/prompt-retrieval。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02010", "date": "2026-07-02", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "KV cache/固定部署 footprint,端侧技术栈非显式端侧;诱导集双层选择新机制。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:多模态", "方向:MoE"], "insight_person": "", "wiki_url": "", "authors": "Qianyu Chen, Ziteng Feng, Canran Xiao et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01893", "run_id": "run-20260703-real4", "title": "Spec-AUF: Accept-Until-Fail Training under Train-Inference Misalignment for Masked Block Drafters", "abstract": "针对推测解码中块级drafter训练全块损失与推理只保留接受前缀的失配问题，提出AUF方法，把交叉熵监督只保留到drafter首次预测失败处，无需辅助目标或改推理流程。", "effects": "在Qwen3-8B上把DFlash平均发出长度从2.40提到2.61，Domino双分支头从2.56提到2.68，六个基准全面提升。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01893", "date": "2026-07-02", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "推测解码加速LLM推理，可服务端侧推理加速；目标函数失配分析有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Tianjian Yang, Meng Li", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01804", "run_id": "run-20260703-real4", "title": "VLA-Corrector: Lightweight Detect-and-Correct Inference for Adaptive Action Horizon", "abstract": "VLA-Corrector 给动作分块的 VLA 策略加了个轻量潜空间视觉监视器,检测到视觉偏差就截断旧动作并在线梯度引导重规划,实现自适应动作时长。", "effects": "无需改骨干权重即可接入不同 VLA,缓解长时接触密集任务中的误差累积;具体成功率数值未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01804", "date": "2026-07-02", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "轻量化的端侧机器人闭环纠正框架,但创新属组合式。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Yi Pan, Miao Pan, Qi Lu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01773", "run_id": "run-20260703-real4", "title": "Verifiable Knowledge Expansion through Retrieval-Grounded Formal Concept Analysis", "abstract": "提出检索增强小语言模型框架，用形式概念分析作为符号验证循环，对SLM提出的本体蕴含进行检索验证或返回反例，让知识扩展过程可审查。", "effects": "在罕见共济失调数据上关系F1为0.29-0.52、闭包蕴含F1为0.22-0.30，增大种子集常能提升蕴含F1，但正样本对识别仍困难。", "m g Kim, Minjae Park, Eui-Young Chung et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01125", "run_id": "run-20260703-real4", "title": "ZO-Act: Efficient Zeroth-Order Fine-Tuning via One-Shot Activation-Informed Low-Rank Subspaces", "abstract": "ZO-Act 是激活感知的零阶微调方法,把扰动限制在由输入激活导出的固定低秩子空间,只用前向损失优化轻量系数矩阵,并支持 INT4 量化 LLM 微调。", "effects": "Llama-3-8B、OPT-13B、INT4 Llama-3-8B 上语言理解/问答/常识推理一致优于强 ZO 微调基线;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01125", "date": "2026-07-01", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "零阶微调+INT4 量化技术栈;激活导出低秩子空间降方差,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:记忆", "方向:评测基准", "模型:Llama", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xun Dong, Yibo Xu, Naigang Wang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31315", "run_id": "run-20260703-real4", "title": "BlockPilot: Instance-Adaptive Policy Learning for Diffusion-based Speculative Decoding", "abstract": "BlockPilot 针对扩散式投机解码,发现最优块大小随样本变化且集中在训练块大小附近,提出用轻量策略从 prefill 表示一次预测最优块大小。", "effects": "Qwen3-4B T=1 下接受长度 5.92,4.20x 加速。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31315", "date": "2026-06-30", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "投机解码技术栈非显式端侧;实例自适应块大小策略,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:投机解码"], "insight_person": "", "wiki_url": "", "authors": "Hao Zhang, Yiming Hu, Yong Wang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.32016", "run_id": "run-20260703-real4", "title": "FedLAB: Traceable Semantic Codebooks for Federated Multimodal Graph Foundation Learning", "abstract": "提出FedLAB联邦多模态图基础学习框架，把多模态图知识组织成类型化层级语义码本（模态证据、节点语义、拓扑上下文），联邦语义重心预训练保持原始内容本地。", "effects": "在10个基准6个下游任务上比SOTA最多提升7.53%，并保留原生语义追溯接口。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.32016", "date": "2026-06-30", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "联邦多模态图学习，端侧分布式场景；可追溯语义码本有创新但偏云端图基础模型。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "方向:联邦学习", "方向:安全隐私", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Zekai Chen, Kairui Yang, Xuaner Chen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31073", "run_id": "run-20260703-real4", "title": "MultiUAV-Plat: An LLM-Oriented Platform, Benchmark and Framework for Multi-UAV Collaborative Task Planning", "abstract": "MultiUAV-Plat 是面向 LLM agent 的多无人机协同任务规划仿真平台和基准,含 75 任务会话、1500 自然语言任务,并提 Agent4Drone 框架。", "effects": "Agent4Drone 任务通过率 57.9%、平均检查通过率 74.6%、全局通过率 72.0%,失败率从 32.4% 降到 12.9%,远超 ReAct。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31073", "date": "2026-06-30", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "多无人机 LLM 规划,端侧机器人协同场景相关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Sheng Zhang, Qinglin Li, Yuechao Zang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31717", "run_id": "run-20260703-real4", "title": "Nonlinearity-Aware LoRA: Structured Gate Adaptation under Low-Rank Constraints", "abstract": "针对门控FFN中LoRA会改变非线性选择权重导致的selection misalignment，提出NA-LoRA，用导数时间重要性mask和激活特定步长缩放把容量分配到响应性强的gate通道。", "effects": "在语言模型微调与视觉语言迁移基准上稳定优于vanilla LoRA，与强PEFT变种竞争或更优，仅训练时增加机制、推理零开销。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31717", "date": "2026-06-30", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "PEFT微调方法，可惠及端侧微调；非线性选择失配分析与gate导向机制有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Shuai Yuan, Sudong Cai, Bingzhi Chen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31260", "run_id": "run-20260703-real4", "title": "Plan Right, Then Plan Tight: Symbolic RL for Efficient Embodied Reasoning", "abstract": "用 BDDL 规格作为数据构造、计划验证与奖励设计的共享接口,配以轻量符号引擎给具身规划器提供毫秒级密集反馈,并提出 GroupAdapt 难度感知长度调度。", "effects": "8B 规划器在 BEHAVIOR-1000 Strict-Pass 达 97.3,比 Qwen3-8B 提升 25.9%,超最强大模型基线 3.5%,响应长度压缩 79%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31260", "date": "2026-06-30", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "8B 具身规划器+符号验证,可端侧部署;BDDL 接口与 GroupAdapt 创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:机器人", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xiangli Shi, Xiaomeng Zhu, Ye Tian et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30701", "run_id": "run-20260703-real4", "title": "An AI-Based Solution for Secure Service Provisioning in IoT", "abstract": "用深度强化学习在 IoT 环境中选择最合适的智能对象提供服务,并用联邦学习构建分布式行为指纹模型监控设备行为、计算可靠性评分。", "effects": "可在资源受限 IoT 设备上有效部署,具备可扩展的安全增强能力。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30701", "date": "2026-06-29", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "资源受限 IoT 端侧安全,明确端侧;DRL+FL 框架较完整但方法常见。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Marco Arazzi, Mert Cihangiroglu, Serena Nicolazzo et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30389", "run_id": "run-20260703-real4", "title": "Predict, Reuse, and Repair: Accelerating Dynamic Sparse Attention for Long-Context LLM Decoding", "abstract": "PRR 是动态稀疏注意力的 speculate-reuse-repair 运行时,用 EMA 预测器在选块进行时投机计算注意力,再用 FlashAttention 修复内核补齐漏块。", "effects": "长上下文基准上每 token 解码延迟最高降 40%,下游任务精度保持。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30389", "date": "2026-06-29", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "高效推理/KV 注意力技术栈非显式端侧;投机-复用-修复运行时,创新较高。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:剪枝稀疏", "方向:高效注意力", "方向:稀疏注意力", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Tianyu Wang, Gourav Rattihalli, Aditya Dhakal et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29563", "run_id": "run-20260703-real4", "title": "Coverage-Driven KV Cache Eviction for Efficient and Improved Inference of LLM", "abstract": "K-VEC 是覆盖感知的 KV cache 驱逐策略,优先保留 token 覆盖率,引入跨头与跨层覆盖模块,理论证明覆盖率影响互信息从而影响预测精度。", "effects": "16 个 LongBench 子集上同驱逐率与内存约束下最高 +10.35 点。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29563", "date": "2026-06-28", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "KV cache 技术栈非显式端侧;覆盖率感知+跨头跨层,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:剪枝稀疏", "方向:记忆", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Shuvendu Roy, Mengyao Zhai, Hossein Hajimirsadeghi et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29579", "run_id": "run-20260703-real4", "title": "ScAle: Attention Head Scaling as a Minimal Adapter for Spatial Reasoning in Vision Language Models", "abstract": "ScAle 在冻结骨干上仅学约 1K 标量系数调制末 token 的注意力与 MLP 激活,作为空间推理任务的超轻量适配器,替代 LoRA 等大参数 PEFT。", "effects": "在 SpatialEval 上相对精度最高提升 134.1%,仅用 1K 可训练参数,保留非空间 VQA 精度。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29579", "date": "2026-06-28", "score": 13, "score_relevance": 6, "score_contribution": 7, "score_reason": "1K 参数超轻量适配器,适合端侧微调;激活重加权思路简洁新颖。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Rahul Chowdhury, Timothy A Rupprecht, Xuan Shen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29337", "run_id": "run-20260703-real4", "title": "W4A4 Quantization for Inference on Wan2.2-I2V-A14B", "abstract": "ICME 2026低比特量化挑战赛提交，对Wan2.2-I2V-A14B做W4A4推理，结合MixQ式混合精度处理稀疏激活异常、SmoothQuant式通道平滑和块级HiF4打包，双分支GEMM保留异常列高精度。", "effects": "官方VBench I2V指标多数质量轴与FP16差距2-3.5%，运动平滑度提升，优于原生HiFloat4基线（约5%退化）。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29337", "date": "2026-06-28", "score": 13, "score_relevance": 7, "score_contribution": 6, "score_reason": "视频生成大模型W4A4量化，可降端侧部署门槛；混合量化策略有创新但属赛事工程整合。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:剪枝稀疏"], "insight_person": "", "wiki_url": "", "authors": "Yidong Chen, Chengyu Shi, Jiahao Liu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.27634", "run_id": "run-20260703-real4", "title": "Continual Learning for Sequential Personalization of Small Language Models: A Stability Monitoring Analysis", "abstract": "研究小语言模型在边缘笔记本上做 LoRA 序列化个性化时的持续学习稳定性,通过 checkpoint 级协议监控任务性能、遗忘与参考集漂移。", "effects": "未报告具体数字;轻量参考集分布诊断可揭示任务指标掩盖的有害适应。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.27634", "date": "2026-06-26", "score": 13, "score_relevance": 8, "score_contribution": 5, "score_reason": "明确 edge 笔记本部署 SLM;稳定性监控分析为主,创新中等。", "source_tier": "学校预印本", "ope il": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00485", "run_id": "run-20260703-real4", "title": "Efficient Multilingual Reasoning Transfer via Progressive Code-Switching", "abstract": "提出PCS渐进式语码转换框架，仅用轻量翻译把英文推理步骤逐步转入目标语言，先SFT初始化语码切换再用步级语言一致性课程RL逐步提升目标语比例。", "effects": "在多种基准和五种类型差异大的语言上大幅缩小目标语与英文推理差距，语言一致性提升且保持竞争力准确率。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00485", "date": "2026-07-01", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "LLM多语言推理迁移，端侧相关性弱；渐进课程设计有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Zhijun Wang, Junxiao Liu, Hao Zhou et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01299", "run_id": "run-20260703-real4", "title": "HYPIC: Accelerating Hybrid-Attention LLM Serving with Position-Independent Caching", "abstract": "提出Hypic，首个支持位置无关缓存的混合注意力LLM服务系统，用段累积转移算子缓存线性注意力段状态、用边界接缝窗口重算恢复跨段回看，并并行化缓存未命中prefill。", "effects": "在四个混合注意力模型五个负载上平均TTFT降2.45x，峰值吞吐最多提升2.0x，精度与全重算差距在3.3点内。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01299", "date": "2026-07-01", "score": 12, "score_relevance": 4, "score_contribution": 8, "score_reason": "云端LLM服务系统，非端侧；首个PIC+混合注意力结合，代数原语创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:高效注意力", "方向:评测基准", "方向:云端serving", "应用:RAG", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Yifei Liu, Juntong Wu, Yang Liu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00760", "run_id": "run-20260703-real4", "title": "MosaicKV: Serving Long-Context LLM with Dynamic Two-D KV Cache Compression", "abstract": "MosaicKV 是长上下文 LLM 的动态二维 KV 缓存压缩系统,按段选择压缩策略,并用闲置 GPU/CPU 资源管理压缩缓存加速注意力。", "effects": "H800 上注意力最多快
