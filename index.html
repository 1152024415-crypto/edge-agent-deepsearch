t Long-Horizon LLM-Based Agent Serving with Lookahead Context Engineering", "abstract": "SmoothAgent 发现 agent 上下文变换是段可分解的,提出 lookahead 编程模型让框架异步预执行变换并预生成 KV 缓存,服务端调度器控制干扰。", "effects": "消除变换开销,TTFT 最高降低 11.9x。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00151", "date": "2026-06-30", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "KV cache/LLM serving 技术栈非显式端侧;段分解+lookahead 预取,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:端云协同", "方向:云端serving", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Zaifeng Pan, Qianxu Wang, Zhengding Hu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00173", "run_id": "run-20260703-real4", "title": "TallyTrain: Communication-Efficient Federated Distillation", "abstract": "TallyTrain 是联邦蒸馏协议,只传每个 peer 的 argmax 类索引把通信压到 ceil(log2 C) 比特,稀疏参数合并得带宽桥变体。", "effects": "在标准基准上以最多三个数量级更少通信匹配或超过软标签蒸馏;带宽桥变体帕累托占优 FedAvg/FedProx/FedDF。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00173", "date": "2026-06-30", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "联邦学习通信压缩,端侧联邦场景相关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:蒸馏", "方向:联邦学习", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Radhakrishna Achanta, Will Reed", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30805", "run_id": "run-20260703-real4", "title": "CryoZip: An Efficient Cryogenic Compressor for Quantum Error Correction Syndromes", "abstract": "提出CryoZip跨栈低温压缩框架，与轻量低温QEC预解码器协同，用滑窗压缩稀疏症候向量以减少4K到室温的症候传输，在22nm FDSOI@4K下实现评估。", "effects": "在多种QEC码上达48x压缩、比SOTA高1.8x，4-26x节能；配QEC预解码器后带宽降超14238x、计入接口开销节能42x。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30805", "date": "2026-06-29", "score": 12, "score_relevance": 4, "score_contribution": 8, "score_reason": "量子纠错低温硬件压缩，非端侧AI；跨栈压缩与4K硬件实测创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:高效注意力", "方向:能耗功耗", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Guanchen Tao, Alexander Knapen, Jacob Mack et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30215", "run_id": "run-20260703-real4", "title": "Efficient RGB-T Object Detection via Sparse Cross-Modality Fusion", "abstract": "提出稀疏跨模态融合的两阶段 RGB-T 检测框架:先用轻量单模态阶段产生高召回 RoIs,再对稀疏候选做融合精细,把算力集中到前景。", "effects": "参数更少成本更低,性能具竞争力,对高分辨率图像可扩展;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30215", "date": "2026-06-29", "score": 12, "score_relevance": 6, "score_contribution": 6, "score_reason": "高效检测非显式端侧;稀疏融合两阶段,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:能耗功耗"], "insight_person": "", "wiki_url": "", "authors": "Chao Tian, Zikun Zhou, Chao Yang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29809", "run_id": "run-20260703-real4", "title": "How Far Can You Get Without a GPU? A Systematic Benchmark of Lightweight Hallucination Detection Across Question Answering, Dialogue, and Summarisation", "abstract": "系统基准五种轻量 CPU 可行的幻觉检测方法(ROUGE-L、语义相似度、BERTScore、NLI、集成)在 HaluEval 问答/对话/摘要上的表现。", "effects": "QA 上集成最佳 F1=0.792、AUC-ROC=0.873;对话 NLI 领先 AUC-ROC=0.713;摘要五方法退化到 0.469-0.574 近随机。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29809", "date": "2026-06-29", "score": 12, "score_relevance": 7, "score_contribution": 5, "score_reason": "明确 CPU 笔记本可行;基准评测为主,创新中等。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Kriti Faujdar, Smit Kadvani", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.28679", "run_id": "run-20260703-real4", "title": "Capability Gates Are Not Authorization: Confused-Deputy Failures in LLM Agent Frameworks", "abstract": "审计LangChain/LangGraph、LlamaIndex和Stripe Agent Toolkit是否对每次模型发出的工具调用按具体参数值重新授权，发现三者默认只做能力门控无确定性fail-closed逐调用授权。", "effects": "提出ScopeGate五阶段PDP/PEP，0/48静态绕过、0/29未授权尝试、0/10良性误拒，Latam-GPT支付agent 10/10遏制。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.28679", "date": "2026-06-27", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "LLM agent框架安全，端侧相关性弱；逐调用授权审计与ScopeGate有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "模型:GPT", "应用:语音"], "insight_person": "", "wiki_url": "", "authors": "David Mellafe Zuvic", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.27732", "run_id": "run-20260703-real4", "title": "Bifocal Diffusion Language Models: Asymmetric Bidirectional Context for Parallel Generation", "abstract": "Bifocal dLLM 用非对称双向上下文解决扩散语言模型的困境:因果注意力保左上下文和 KV 缓存,轻量反向 Mamba 侧车供压缩右上下文。", "effects": "Qwen3-1.7B 续训 60B token 后,比双向 dLLM 吞吐高 2.4-12.9x、比 AR 基线快 1.9-2.9x,多数基准超因果基线,平均超双向 dLLM。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.27732", "date": "2026-06-26", "score": 12, "score_relevance": 5, "score_contribution": 7, "score_reason": "高效并行解码带 KV 缓存,端侧可迁移但属通用语言模型研究。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Yuhang Chen, Xianfeng Wu, Jinhao Duan et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02303", "run_id": "run-20260703-real4", "title": "A Hippocampus for Linear Attention: An Exact Memory for What the Recurrent State Forgets", "abstract": "给线性注意力模型加了个海马体式的精确 KV 缓存,补上循环状态会遗忘早期事实的毛病,属于半参数化测试时记忆。", "effects": "340M 参数下 Wikitext 困惑度从 27.32 降到 22.92(-16.1%),低于全注意力 Transformer++ 的 26.88;RULER 32k 针中草堆检索更鲁棒。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02303", "date": "2026-07-02", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "高效注意力记忆机制,但面向通用语言模型训练,非端侧部署。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:高效注意力", "方向:记忆"], "insight_person": "", "wiki_url": "", "authors": "Wanyun Cui", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02182", "run_id": "run-20260703-real4", "title": "Bayesian Sparse Low-Rank Adaptation for Large Language Model Uncertainty Estimation", "abstract": "提出 DALorRA,一种变分贝叶斯稀疏 LoRA 框架,通过对秩维度做随机掩码实现 LLM 微调的 uncertainty 量化与校准。", "effects": "未报告具体数字;实验显示在不损推理精度下改善校准。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02182", "date": "2026-07-02", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "LoRA 微调技术栈,非显式端侧;将不确定性量化移到 LoRA 秩级,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Jijie Zhang, Zhe Ren, Quan Zhang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01831", "run_id": "run-20260703-real4", "title": "Lynx: Progressive Speculative Quantization for accelerating KV Transfer in Long-Context Inference", "abstract": "Lynx 把 KV 缓存按高位/低位拆成两路流,先传高位锚点流即可开始解码,剩余精度流并发传输再验证,降低长上下文推理首 token 延迟。", "effects": "TTFT 与 4-bit 量化相当但精度匹配 BF16;比 8-bit 量化 TTFT 提升最高 1.43 倍,精度比 SOTA 提升最高 5.1%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01831", "date": "2026-07-02", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "数据中心长上下文推理服务,非端侧;渐进式 KV 传输思路创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:KV cache", "应用:RAG", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Wenchen Han, Gingfung Matthew Yeung, Marco Barletta et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01792", "run_id": "run-20260703-real4", "title": "PARTREP: Learning What to Repeat for Decoder-only LLMs", "abstract": "PartRep 只选择信息量最大的 prompt token 重复一次,而非整段重复,以小幅代价缓解因果注意力信息不对称、提升解码器 LLM 推理。", "effects": "在 8 个基准、3 个模型族上保留大部分全重复增益,仅用 59.4% KV 缓存和 79.0% prefill FLOPs。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01792", "date": "2026-07-02", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "KV 缓存与 prefill 成本优化,可服务于资源受限部署;选择性重复方法较新颖。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Andikawati P Widjaja, Yongjun Kim, Hyounghun Kim et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02504", "run_id": "run-20260703-real4", "title": "Reasoning LLM Improves Speaker Recognition in Long-form TV Dramas", "abstract": "用大推理模型自动聚合多模态证据,给长篇电视剧里每句台词找到对应角色的说话人识别方法。", "effects": "构建 532K 标注对白数据集,DramaSR-LRM 显著超过已有基线,在短句上提升尤为明显。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02504", "date": "2026-07-02", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "云端大推理模型+多模态工具调用,非端侧;贡献在大规模基准与新方法。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:工具调用", "方向:多模态", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Yuxuan Li, Lingxi Xie, Xinyue Huo et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01775", "run_id": "run-20260703-real4", "title": "Set Diffusion: Interpolating Token Orderings Between Autoregression and Diffusion for Fast and Flexible Decoding", "abstract": "提出 set diffusion 语言模型,用集合因果扩散架构支持每步推理后更新 KV 缓存,token 可任意顺序集合解码,比块扩散更灵活更快。", "effects": "在数学推理、摘要、无条件生成上比已有扩散语言模型速度-质量更优,填充能力强于块扩散。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01775", "date": "2026-07-02", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "高效解码新范式,但属通用语言模型研究,端侧关联弱。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Marianne Arriola, Volodymyr Kuleshov", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02043", "run_id": "run-20260703-real4", "title": "Towards Load-Aware Prefill Deflection for Disaggregated LLM Serving", "abstract": "针对分离式LLM服务中prefill节点饱和、decode节点闲置的问题，提出主动prefill偏转调度器，让decode节点以分块prefill方式承接溢出请求以消除跨节点KV传输。", "effects": "在vLLM上基于DeepSeek-V2-Lite实测，P95 TTFT最多降低81%，SLO达成率最多提升79%，路由开销亚毫秒级。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02043", "date": "2026-07-02", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "云端A100集群LLM服务调度，非端侧；调度算法有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:评测基准", "方向:云端serving", "硬件:GPU", "模型:DeepSeek"], "insight_person": "", "wiki_url": "", "authors": "Shrikara Arun, Anjaly Parayil, Srikant Bharadwaj et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01474", "run_id": "run-20260703-real4", "title": "Class-Grouped Normalized Momentum and Faster Hyperparameter Exploration to Tackle Class Imbalance in Federated Learning", "abstract": "FedCGNM 在联邦学习客户端按类分组维护归一化动量,均衡多数/少数类梯度,并用 X 臂老虎机 FedHOO 高效优化重采样率,应对类不平衡。", "effects": "在四个公开长尾基准和芯片缺陷数据集上稳定优于基线,FedHOO 在小规模联邦中进一步增益。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01474", "date": "2026-07-01", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "联邦学习可服务端侧分布式;分组归一化动量+bandit 调参有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:安全隐私", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Haemin Park, Diego Klabjan, Martin W. Braun et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00466", "run_id": "run-20260703-real4", "title": "ELDR: Expert-Locality-Aware Decode Routing for PD-Disaggregated MoE Serving", "abstract": "ELDR 是 PD 分离式 MoE 服务中的专家局部性感知解码路由器,从 prefill 专家激活构建签名,用平衡 K-means 划分签名空间并按局部性带路由。", "effects": "最多 40 GPU 部署,三种 MoE 模型两负载上中位 TPOT 降低 5.9-13.9%,模型输出不变。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00466", "date": "2026-07-01", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "云端 vLLM 服务,非端侧;专家局部性感知路由+KV 粒度签名缓存,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:MoE", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Sangjin Choi, Sukmin Cho, Yifan Xiong et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01111", "run_id": "run-20260703-real4", "title": "FAR: Failure-Aware Retry for Test-Time Recovery and Continual Policy Improvement", "abstract": "FAR 让机器人在测试时从失败中学习:用失败-对比偏好适配把策略推离失败行为,辅以轻量动作扰动,并将成功恢复轨迹回训持续改进。", "effects": "仿真上平均成功率提升 17.6%,真实世界提升 11.7%;在 reset 与时间步预算下数据效率显著提高。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01111", "date": "2026-07-01", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "机器人策略,可端侧部署;失败偏好适配+持续改进框架较常见。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Haoran Hao, Shahram Najam Syed, Jeffrey Ichnowski et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31742", "run_id": "run-20260703-real4", "title": "FedXDS: Leveraging Model Attribution Methods to counteract Data Heterogeneity in Federated Learning", "abstract": "FedXDS 用可解释 AI 的特征归因识别哪些数据元素该在联邦客户端间选择性共享以缓解异质性,并加度量隐私保护。", "effects": "在不同客户端数和异质性设置下准确率和收敛速度持续优于现有方法,对成员推理和特征反转攻击鲁棒。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31742", "date": "2026-06-30", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "联邦学习数据共享,端侧联邦相关但非纯端侧。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:联邦学习", "方向:安全隐私"], "insight_person": "", "wiki_url": "", "authors": "Maximilian Andreas Hoefler, Karsten Mueller, Wojciech Samek", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31413", "run_id": "run-20260703-real4", "title": "Learning to Select, Not Relearn: Hard-Routed Mixtures of Reasoning LoRAs", "abstract": "Hard-Routed MoR-LoRA 用硬 top-1 路由组合冻结的推理 LoRA 专家,只训轻量共享路由和小注意力 LoRA,直通估计器支持梯度训练。", "effects": "在五个基准、多模型规模上保持专家行为,可训参数远少于软路由混合基线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31413", "date": "2026-06-30", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "LoRA 高效组合,端侧可迁移但非端侧特定。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:MoE", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Seyed Alireza Molavi, Zhan Su, Yan Hu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31648", "run_id": "run-20260703-real4", "title": "Think in English, Answer in Korean: Efficient Adaptation of Multilingual Tool-Using Agents", "abstract": "LuckyStar 111B 基于 Command A 后训练,用多语言 SFT、可验证奖励 RL、语言一致性奖励与 4-bit 量化,高效适配韩英企业工具 agent,支持单 GPU 部署。", "effects": "提升数学推理、函数调用、NL2SQL 性能,保留韩英指令遵循质量;4-bit 量化支持单 GPU 服务。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31648", "date": "2026-06-30", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "4-bit 单 GPU 服务有端侧部署意味;111B 仍偏服务侧,创新为适配配方。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:记忆", "方向:工具调用", "硬件:GPU", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Utsav Garg, Sungjin Hong, Jason Jung et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30293", "run_id": "run-20260703-real4", "title": "CSAR: Containerized System Architecture for Robotics", "abstract": "CSAR 是面向机器人团队的容器化系统架构,用 LXC/LXD 系统容器加 ROS 2 通信和三层边缘基础设施,组织硬件亲和的持久执行环境。", "effects": "在学术机器人实验室真实部署,边缘卸载 3D SLAM 和 GPU 语义映射用例表明简化集成、提升共享资源利用率。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30293", "date": "2026-06-29", "score": 11, "score_relevance": 6, "score_contribution": 5, "score_reason": "边缘-云机器人基础设施框架,工程价值高但创新偏集成。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端云协同", "方向:评测基准", "方向:端侧agent", "硬件:GPU", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Ambrosio-Cestero, Gregorio, Galindo Andrades et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29952", "run_id": "run-20260703-real4", "title": "Exploiting Local Flatness for Efficient Out-of-Distribution Detection", "abstract": "Fold 是轻量 OOD 检测器,利用特征 Hessian 与部分特征归一化提升 ID-OOD 可分性,AutoFold 用自监督伪 OOD 调参,无需外部数据。", "effects": "OOD 基准上平均 AUROC +1.63%、FPR95 -2.30%,计算成本与一次前向相当。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29952", "date": "2026-06-29", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "高效推理相关非显式端侧;特征 Hessian 轻量 OOD,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Seonghwan Park, Hyunji Jung, Dongyeop Lee et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30632", "run_id": "run-20260703-real4", "title": "GROW$^2$: Grounding Which and Where for Robot Tool Use", "abstract": "GROW2 用物体部件作为抽象,把开放世界工具使用的 grounding 分成语义(VLM 选物选件)与几何(基础模型定位 3D 区域)两层,避免端到端重训练。", "effects": "在 affordance 基准上超 SOTA;实现开类别零样本泛化,仿真与真实工具使用均优于基线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30632", "date": "2026-06-29", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "机器人工具使用,可端侧;层次 grounding 思路新颖但方法组合常见。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:多模态", "方向:评测基准", "应用:机器人", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Yuhong Deng, Yuyao Liu, David Hsu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30560", "run_id": "run-20260703-real4", "title": "TraceLab: Characterizing Coding Agent Workloads for LLM Serving", "abstract": "采集并发布约4300个编码agent会话、35万LLM步骤和43万工具调用的trace，分析编码agent工作负载特征：长自主循环、长上下文短输出、重尾工具调用、高但不完美的前缀缓存命中率。", "effects": "指出降低工具调用开销、append长度感知prefill、语义感知工具延迟预测和KV缓存管理等优化机会，并发布数据集与流水线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30560", "date": "2026-06-29", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "LLM服务负载分析，非端侧；首批真实编码agent trace数据集有创新。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:KV cache", "方向:工具调用", "方向:评测基准", "方向:端侧agent", "应用:代码", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Kan Zhu, Mathew Jacob, Chenxi Ma et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29483", "run_id": "run-20260703-real4", "title": "Fog Computing and Large Language Models: A vision for the mutual beneficiaries", "abstract": "探讨雾计算与 LLM 互惠:雾为 LLM 提供近端部署所需,LLM 为雾应用提供代码生成能力,综述量化/剪枝/LoRA 等优化与未来方向。", "effects": "未报告(综述/愿景论文)。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29483", "date": "2026-06-28", "score": 11, "score_relevance": 7, "score_contribution": 4, "score_reason": "雾计算近端 LLM,明确端侧主题;属愿景综述,创新低。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:剪枝稀疏", "方向:记忆", "方向:安全隐私", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Satish Narayana Srirama", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.28835", "run_id": "run-20260703-real4", "title": "Fisher-Routed Mixture of Experts for Federated Class-Incremental Learning", "abstract": "FedFMX 用 Fisher 路由专家评分与自适应专家选择,在联邦类增量学习中按样本路由到兼顾获取与保留的专家子集,并给出收敛性证明。", "effects": "在多个基准上优于 SOTA;理论收敛率 O(T^-1)。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.28835", "date": "2026-06-27", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "联邦类增量学习,可服务端侧分布式;Fisher 路由 MoE 有创新但属联邦方法。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE", "方向:联邦学习", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Wenhao Yuan, Chenchen Lin, Jian Chen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.27622", "run_id": "run-20260703-real4", "title": "FoggyTrust: Robust Federated Learning with Hierarchical Trust Networks", "abstract": "FOGGYTRUST 是 FLTrust 的层次化扩展,把信任计算下放到雾节点,局部同质组内做信任聚合,再结合 FedAdam/SCAFFOLD 全局优化,应对全局异质数据。", "effects": "在异质场景上增益最强,CIFAR-10 上对 Krum/Trim 攻击比 FLTrust 提升超 50%;野生动物 safari 数据集验证。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.27622", "date": "2026-06-26", "score": 11, "score_relevance": 5, "score_contribution": 6, "score_reason": "雾节点联邦学习,边缘分布式;层次信任网络有创新但属联邦鲁棒性。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Emmanuel Rassou, Tomas Gonzalez", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.28565", "run_id": "run-20260703-real4", "title": "KernelSight-LM: A Kernel-Level LLM Inference Simulator", "abstract": "KernelSight-LM 是细粒度 LLM 推理模拟器,把每个服务步骤分解为 roofline kernel 模型+学习效率项+通信模型+主机开销,经离散事件调度器组合,产出 kernel 级延迟分解。", "effects": "跨代预测 kernel 延迟误差 12.1%(roofline 22.0% 的 1.8x 改进);目标实测 3.8%(7.3x 改进);端到端 p50 误差 TTFT/TPOT/吞吐 跨代 15.4%/12.8%/3.0%、目标 14.3%/6.2%/2.7%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.28565", "date": "2026-06-26", "score": 11, "score_relevance": 4, "score_contribution": 7, "score_reason": "推理模拟器面向云端 serving;kernel 级分解+两级预测,创新较高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Xiteng Yao, Taeho Kim, Hengzhi Pei et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01366", "run_id": "run-20260703-real4", "title": "Auto-FL-Research: Agentic Search for Federated Learning Algorithms", "abstract": "Auto-FL-Research 是受约束编码 agent 工作流,用于自动搜索联邦学习算法配方(聚合规则、客户端调度、本地目标、模型变体)。", "effects": "5 个 FLamby 医疗任务中 4 个、LEAF 6 个配置中 5 个获种子重复支持增益;部分增益实为固定面调参或单次 Artifact。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01366", "date": "2026-07-01", "score": 10, "score_relevance": 4, "score_contribution": 6, "score_reason": "联邦学习非显式端侧;agent 自动搜索 FL 配方,新意但结果混杂。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Holger R. Roth, Ziyue Xu, Chester Chen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01077", "run_id": "run-20260703-real4", "title": "Message Passing Enables Efficient Reasoning", "abstract": "MPLM 让多线程 LLM 推理通过轻量 send/receive 原语直接通信,避免冗余上下文共享并支持提前终止,以消息传递替代顺序 CoT。", "effects": "数独上渐近上下文远小于串行 CoT 与 fork-join;微调单模型解 25x25 数独;3-SAT 上提前终止提升效率。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01077", "date": "2026-07-01", "score": 10, "score_relevance": 3, "score_contribution": 7, "score_reason": "并行推理扩展,云端多线程;消息传递范式与可抢占性有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xuecheng Liu, Daman Arora, Gokul Swamy et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31144", "run_id": "run-20260703-real4", "title": "A Modular Vision-Language-Action Robotics Framework for Indoor Environments", "abstract": "为 CMU VLA 挑战设计的模块化室内机器人框架,并行跑语义体素地图感知管线与语言命令分类管线,把查询接地到地图上下文生成 VLM 提示。", "effects": "未报告具体数字;在 500 秒探索限制下完成挑战。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31144", "date": "2026-06-30", "score": 10, "score_relevance": 5, "score_contribution": 5, "score_reason": "机器人 VLA 非显式端侧;集成系统为主,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "方向:端侧agent", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Anindya Jana, Snehasis Banerjee, Arup Sadhu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30499", "run_id": "run-20260703-real4", "title": "Discovering Collaboration from Novelty: Random Network Distillation for Clustered Federated Learning", "abstract": "用随机网络蒸馏做轻量联邦聚类,每个客户端训紧凑 RND 预测器,用预测误差作新颖性信号估计客户端相似性,联邦前发现分组。", "effects": "解耦聚类与学习,无需共享原始数据或重复评估主模型,适合自治大规模分布式系统;具体精度数值未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30499", "date": "2026-06-29", "score": 10, "score_relevance": 5, "score_contribution": 5, "score_reason": "联邦学习聚类,端侧联邦相关但创新一般。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:联邦学习", "方向:评测基准", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Davide Domini, Gianluca Aguzzi, Ivana Dusparic et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30391", "run_id": "run-20260703-real4", "title": "Energy-Aware Scheduling for Serverless LLM Serving on Shared GPUs", "abstract": "提出Festina Profiling导向功率感知控制平面，联合协调请求放置、SM分区和GPU工作点，全局调度用离线profile查表做SLO安全能耗感知放置，本地调度按相态自适应批与算力。", "effects": "对比四个SOTA LLM服务系统和一个DVFS增强系统，能耗最多降低56%，SLO达成率差距在2%以内。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30391", "date": "2026-06-29", "score": 10, "score_relevance": 3, "score_contribution": 7, "score_reason": "云端共享GPU能耗调度，非端侧；能耗优先联合调度有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗", "方向:云端serving", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Tianyu Wang, Gourav Rattihalli, Aditya Dhakal et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29986", "run_id": "run-20260703-real4", "title": "HBM Is Not All You Need: Efficient Disaggregated LLM Serving across Memory-heterogeneous Accelerators", "abstract": "HMA-Serve 在内存异构加速器间做分离 LLM 服务:GDDR 加速器跑 prefill、HBM GPU 跑 decode,通过分相位量化、计算-传输流水线与延迟反量化降本提效。", "effects": "在四个 Qwen3 模型与三条生产 trace 上,goodput 最高 3.2 倍、每美元 goodput 4.8 倍于内存同质方法,生成质量无可测损失。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29986", "date": "2026-06-29", "score": 10, "score_relevance": 3, "score_contribution": 7, "score_reason": "数据中心跨厂商分离服务,云端;跨厂商 KV 格式与三技巧有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:KV cache", "方向:记忆", "方向:评测基准", "方向:云端serving", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Zhixiang Wei, Yun Wang, James Yen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29778", "run_id": "run-20260703-real4", "title": "Mandol: An Agglomerative Agent Memory System for Long-Term Conversations", "abstract": "Mandol 把碎片化记忆统一为记忆原生架构:层次语义图+SemanticMap/Graph 融合 KV/向量/图,检索时无需 LLM 介入,带查询自适应路由与 token 预算控制。", "effects": "在 LoCoMo 与 LongMemEval 上总体精度最佳;10 QPS 下检索 5.4 倍、插入 4.8 倍加速,消费级硬件低延迟。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29778", "date": "2026-06-29", "score": 10, "score_relevance": 4, "score_contribution": 6, "score_reason": "agent 记忆系统,消费级硬件可跑;统一架构与免 LLM 检索有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent", "应用:RAG"], "insight_person": "", "wiki_url": "", "authors": "Yuhan Zhang, Zhiyuan Guo, Ziheng Zeng et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.28450", "run_id": "run-20260703-real4", "title": "LLM agents security duality: a comprehensive survey of self-security and empowered cybersecurity", "abstract": "综述LLM agent安全的两面：对agent自身的威胁与缓解，以及agent在攻防网络安全生命周期中的作用，提出威胁源分类法和首个对齐攻防全周期的agent赋能框架。", "effects": "系统梳理内外攻击面、缓解与评估框架，指出自安全与赋能安全的正反馈协同，给出未来方向。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.28450", "date": "2026-06-26", "score": 10, "score_relevance": 4, "score_contribution": 6, "score_reason": "LLM agent安全综述，端侧相关性弱；首个攻防全周期赋能框架有创新但属综述。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Yiwei Xu, Yong Zhuang, Xuanming Liu et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01617", "run_id": "run-20260703-real4", "title": "3DLS: A 3D Logic-Stacked Architecture for Disaggregated LLM Serving", "abstract": "3DLS 是逻辑-逻辑 3D 堆叠芯片架构,把 KV 缓存传输走垂直互连、解码侧张量并行集合走横向互连,分离流量类避免争用。", "effects": "相比平面基线吞吐达 1.49x、端到端延迟降 60.2%;相比优先级管理基线吞吐 1.17x、延迟降 31.4%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01617", "date": "2026-07-02", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "云端芯片级 LLM serving 硬件架构,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:云端serving", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Jaehun Lee, In-Jun Jung, Joo-Young Kim", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02496", "run_id": "run-20260703-real4", "title": "Controllable Sim Agents with Behavior Latents", "abstract": "提出CNeVA框架，用闭式变分更新学习每个交通智能体的高斯行为潜变量，让仿真智能体既像真实驾驶又能沿速度、安全等可解释维度被引导控制。", "effects": "在Waymo Open Motion Dataset上真实度与高分模仿模型相当，且能单调地调控速度、加速度、安全性和地图合规性，揭示需配合物理合理性护栏以防奖励作弊。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02496", "date": "2026-07-02", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "自动驾驶交通仿真，属云端训练范式，与端侧AI弱相关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Juanwu Lu, Junyu Zhu, Ziran Wang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02266", "run_id": "run-20260703-real4", "title": "HERMES: A Multi-Granularity Labeling Substrate for Pre-training Data Mixtures", "abstract": "提出一种层次化数据标注基底 HERMES,用残差向量量化给预训练语料打粗到细的标签,支持按粒度调控数据配比。", "effects": "在 1B/25B 预训练上,某粒度下规则使 16 任务能力均值提升 +0.0253;更细粒度下优势消失。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02266", "date": "2026-07-02", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "预训练数据配比,云端训练侧;创新在层次标签基底但属数据工程。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:云端serving", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Ziyun Qiao, Yue Min, Ruining Chen et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02214", "run_id": "run-20260703-real4", "title": "Unlocking Speech-Text Compositional Powers: Instruction-Following Speech Language Models without Instruction Tuning", "abstract": "提出 SpeechCombine,不用指令微调,只做一轮语音预训练再加权合并文本 LLM 的指令微调权重,就能让语音语言模型跟指令。", "effects": "保留原文本 LLM 知识并迁移到语音域,避免依赖海量语音数据;具体精度数值未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02214", "date": "2026-07-02", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "语音 LLM 训练范式创新,但属云端训练方法,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:语音"], "insight_person": "", "wiki_url": "", "authors": "Congrui Du, Yang Zhang, Kaizhi Qian et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01208", "run_id": "run-20260703-real4", "title": "Distill to Detect: Exposing Stealth Biases in LLMs through Cartridge Distillation", "abstract": "D2D 把可疑模型与基座模型的分布偏移蒸馏进一个 KV-cache 前缀适配器,放大隐藏偏好便于检测 LLM 供应链植入的隐式偏见。", "effects": "成功放大隐藏偏见使其可被可靠检测,覆盖多种偏见类型;给出 Fisher 加权投影理论解释。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01208", "date": "2026-07-01", "score": 9, "score_relevance": 2, "score_contribution": 7, "score_reason": "LLM 安全审计,云端模型检测;把适配器容量瓶颈转为检测工具有新意。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:蒸馏"], "insight_person": "", "wiki_url": "", "authors": "Shayan Talaei, Abhinav Chinta, Devvrit Khatri et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01283", "run_id": "run-20260703-real4", "title": "Scaling Laws for Grid-Based Approximate Nearest Neighbor Search in High Dimensions", "abstract": "系统刻画多探针网格 ANN 搜索随数据量 N 和维度 d 的扩展规律,发现网格法在维度上具有恒定扩展指数。", "effects": "在 GloVe 上网格法维度扩展恒定而其他方法退化;查询近似 N 线性、索引成本低;并提供代码。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01283", "date": "2026-07-01", "score": 9, "score_relevance": 4, "score_contribution": 5, "score_reason": "ANN 检索可服务端侧检索;扩展规律刻画有价值但创新中等。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Matthew J Liu, Wei Hang Zheng, Vidhan Purohit et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00394", "run_id": "run-20260703-real4", "title": "When Classic Cache Policies Fail: Learning-Augmented Replacement for Semantic Retrieval Buffers", "abstract": "把 LLM agent 检索缓冲形式化为带切换成本的在线语义缓存替换问题,提出学习增强框架 SOLAR,基于遗憾累积和贝叶斯在线学习决定修改时机与内容。", "effects": "经典 LRU/LFU 一致差于 FIFO;SOLAR 竞争比 ≤3,在紧张缓存下相对 FIFO 提升 5-75%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00394", "date": "2026-07-01", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "LLM agent 语义缓存,云端 agent;形式化与学习增强策略有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Yushi Sun, Bowen Cao, Wai Lam", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00275", "run_id": "run-20260703-real4", "title": "Entropy-Regularized Probabilistic Gates for Sparse Model Discovery in Scarce-Data Federated Learning", "abstract": "在联邦学习中用熵正则化概率门控维持稀疏优化的不确定性,防止过早收敛到稀疏支撑,提升小样本高维场景的泛化与稀疏恢复。", "effects": "合成与真实基准上一致优于 Fed-IHT 和 FedAvg 剪枝;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00275", "date": "2026-06-30", "score": 9, "score_relevance": 4, "score_contribution": 5, "score_reason": "联邦学习稀疏,非显式端侧;熵正则化门控,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:联邦学习", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Krishna Harsha Kovelakuntla Huthasana, Alireza Olama, Andreas Lundell", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31093", "run_id": "run-20260703-real4", "title": "Omni-Flow: A Unified Workflow Orchestration and Distributed KV Cache Sharing Framework for Multimodal Inference", "abstract": "Omni-Flow 是多模态推理的分布式调度框架,三层抽象(控制流/数据流/计算流)统一编排异构单元、跨角色 KV 缓存共享与多模态前缀复用。", "effects": "支持全模态对话(LongCat-Next)与复杂图像生成(HunyuanImage-3)等异构场景,统一编程模型。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31093", "date": "2026-06-30", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "分布式多模态推理服务,云端;三层抽象有系统创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:KV cache", "方向:记忆", "方向:多模态", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Bin Xiao, Jingfu Dong, Changran Wang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31046", "run_id": "run-20260703-real4", "title": "OpenLife: Toward Open-World Artificial Life with Autonomous LLM Agents", "abstract": "提出开放世界人工生命范式OpenLife，用无状态LLM围绕记忆、感知、评估和预算代谢等异步进程组成社会，让持久性成为规范，用开放词汇LLM判断而非标量奖励评价经验。", "effects": "六个agent在开放世界运行约12周，出现从反应到自发活动、个体分化、社会结构和首次自赚外部收入等生命式动态。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31046", "date": "2026-06-30", "score": 9, "score_relevance": 2, "score_contribution": 7, "score_reason": "LLM agent人工生命研究，与端侧AI无关；范式与平台创新高。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:工具调用", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Atsushi Masumori, Itsuki Doi, Norihiro Maruyama et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00053", "run_id": "run-20260703-real4", "title": "SWE-Router: Routing in Multi-turn Agentic Software Engineering Tasks", "abstract": "SWE-Router 是基于价值的时序路由方法,让廉价模型先跑几步探索再读部分轨迹决定是否升级到昂贵模型,并给出贝叶斯最优性定理。", "effects": "多组弱强 LLM 对上大幅提升 SWE 任务成本效率,保留强模型大部分性能;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00053", "date": "2026-06-30", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "云端 agent 路由,与端侧无关;轨迹条件路由+贝叶斯最优定理,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "应用:代码"], "insight_person": "", "wiki_url": "", "authors": "Seongho Son, Sangwoong Yoon, Jiahua Tang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30749", "run_id": "run-20260703-real4", "title": "From Grasps to Dexterity: Large-Scale Grasp Pretraining for Dexterous Manipulation", "abstract": "研究大规模抓取数据集能否用于铰接工具使用的功能性灵巧操作,用 355k 轨迹抓取预训练低层控制器再下游微调,并提出 DexCraft 仿真基准。", "effects": "真实世界全任务成功率比 DP3 高 33.3 个百分点;仿真与真实均优于端到端扩散策略基线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30749", "date": "2026-06-29", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "机器人灵巧操作,与端侧无关;抓取预训练迁移到工具使用,中等创新。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:工具调用", "方向:评测基准", "应用:机器人"], "insight_person": "", "wiki_url": "", "authors": "Ying Yuan, Xinyu Liu, Sriram Krishna et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29322", "run_id": "run-20260703-real4", "title": "SP-CACW: Convergence-Aware Client Weighting for Selfish Personalized Learning", "abstract": "SP-CACW 是收敛感知的客户端加权框架,为目标客户端最小化收敛误差上界,在偏置与方差间权衡并可对有害 peer 赋零权重。", "effects": "MNIST/CIFAR-100/LEAF Shakespeare 上与个性化/聚类基线相当或更优;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29322", "date": "2026-06-28", "score": 9, "score_relevance": 4, "score_contribution": 5, "score_reason": "联邦/个性化学习非显式端侧;收敛感知加权,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:评测基准", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Yaron Kiselman, Kfir Y. Levy", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29094", "run_id": "run-20260703-real4", "title": "DiLaServe: High SLO Attainment Serving for Diffusion Language Models", "abstract": "DiLaServe 是扩散语言模型的集群级 serving 系统,用置信阈值调整做截止感知调度和自适应负载控制,并建模近似 KV 缓存的步级异质成本。", "effects": "多基准和真实 trace 上 SLO 达成率高 56.6 个百分点,端到端请求延迟降 46%,精度降小于 1%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29094", "date": "2026-06-27", "score": 9, "score_relevance": 3, "score_contribution": 6, "score_reason": "云端扩散语言模型 serving,非端侧。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Tzu-Tao Chang, Benjamin Yuanyang Hong, Kiet Pham et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01916", "run_id": "run-20260703-real4", "title": "ContextSniper: AntTrail's Token-Efficient Code Memory for Repository-Level Program Repair", "abstract": "ContextSniper 是仓库级程序修复的省 token 代码记忆层,用混合检索排序和意图感知上下文门过滤长输出,返回紧凑证据包。", "effects": "在 SWE-bench Lite 上 OpenClaw 总 token 降 51.5%、成本降 36.4%;Claude Code token 降 38.9%、成本降 27.3%,解决率略降。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01916", "date": "2026-07-02", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "省 token 的 agent 记忆层,属云端编码 agent,非端侧。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Chiwang Luk, Matin Mohammad Najafi, Zhifeng Jia et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01579", "run_id": "run-20260703-real4", "title": "OmniPilot: An Uncertainty-Aware LLM Inference Advisor for Heterogeneous GPU Clusters", "abstract": "OmniPilot 是异构 GPU 集群上的 LLM 推理启动顾问,用保形校准分位数成本模型加 OOD 弃权层预测配置成本并排序。", "effects": "460 次基准上吞吐预测 MAPE 6.2%、top-1 准确率 95%、效用遗憾 0.003;OOD 弃权层成功标记全部 5 个低置信点。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01579", "date": "2026-07-02", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "云端 GPU 集群配置顾问,非端侧。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:KV cache", "方向:评测基准", "方向:云端serving", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "D. Balamurugan, Thomas W. Bush", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01678", "run_id": "run-20260703-real4", "title": "SCAPE: Accurate and Efficient LLM Training with Extreme Sparse Communication", "abstract": "SCAPE 利用 AdamS 一阶矩稳定性做激进梯度稀疏化,在 LLM 分布式训练中减少通信开销而不损失质量。", "effects": "GPT-345M 与 Llama-500M 在 90%/99% 稀疏下保持稳定;Llama-500M 端到端训练时间最多降 43.3%;Llama-1.8B 每步最高 3.26 倍加速。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01678", "date": "2026-07-02", "score": 8, "score_relevance": 2, "score_contribution": 6, "score_reason": "分布式训练通信优化,纯云端训练;一阶矩稀疏化方法较有创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:量化", "方向:剪枝稀疏", "方向:评测基准", "模型:Llama", "模型:GPT"], "insight_person": "", "wiki_url": "", "authors": "Mingkai Zheng, Junlin Chen, Haotian Xie et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02447", "run_id": "run-20260703-real4", "title": "Understanding the Robustness of Distributed Self-Supervised Learning Frameworks Against Non-IID Data", "abstract": "对分布式自监督学习(D-SSL)在非独立同分布数据下的鲁棒性做理论分析,证明掩码图像建模(MIM)比对比学习更抗异构,并提出 MAR loss 改进。", "effects": "未报告具体数字;跨架构和分布式设置实验验证理论。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02447", "date": "2026-07-02", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "分布式/联邦训练理论,非显式端侧;理论分析+MAR loss 改进,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Xuanyu Chen, Nan Yang, Shuai Wang et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01089", "run_id": "run-20260703-real4", "title": "Group-invariant Coresets for Data-efficient Active Learning", "abstract": "GRINCO 是群不变主动学习 coreset 框架,在变换群诱导的商空间里做获取,选择轨道而非原始样本,并用轨道平均损失训练。", "effects": "在旋转冗余图像基准上提升轨道覆盖和标注效率,优于常规 coreset 基线,冗余大时更明显。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01089", "date": "2026-07-01", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "数据高效主动学习方法,非端侧特定。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "L. C. Ayres, J. C. M. Bermudez, S. J. M. de Almeida et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00852", "run_id": "run-20260703-real4", "title": "Recovering Input Text from Hidden States: Study of Gradient-Based Inversion of Decoder-Only Language Models", "abstract": "研究从解码器 LLM 末层隐藏态反演原始输入 token 序列,采用连续嵌入空间优化+末端一次性提交 token 的方法,并分析失败 token 特征。", "effects": "10-token C4 prompt 精确匹配从 66.9% 升到 97.5%(平均相似度 0.994);功能词易失败、内容词近乎完美恢复。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00852", "date": "2026-07-01", "score": 8, "score_relevance": 2, "score_contribution": 6, "score_reason": "隐藏态反演安全研究,云端模型;连续优化框架与失败分析有贡献。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:端侧agent", "模型:GPT"], "insight_person": "", "wiki_url": "", "authors": "Mikołaj Słowikowski, Maciej Witold Majewski", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31664", "run_id": "run-20260703-real4", "title": "Sparsity-Inducing Divergence Losses for Biometric Verification", "abstract": "提出 Q-Margin,一种带概率 margin 的 α-散度损失,把 margin 惩罚直接编码进参考测度,在保持稀疏性的同时提升人脸与说话人验证判别力。", "effects": "IJB-B/IJB-C 与 VoxCeleb 上对标 ArcFace/CosFace 在低 FAR 下一致提升;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31664", "date": "2026-06-30", "score": 8, "score_relevance": 2, "score_contribution": 6, "score_reason": "生物识别损失,与端侧无关;概率 margin α-散度,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:记忆", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Dimitrios Koutsianos, Ladislav Mošner, Yannis Panagakis et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30161", "run_id": "run-20260703-real4", "title": "Federated Learning with Energy-Based Structured Probabilistic Inference", "abstract": "用条件随机场细化联邦学习的客户端聚合权重,定义单客户端单势和客户端对 pairwise 势,建模客户端可靠性和交互。", "effects": "在非 IID 异质性下一致优于成熟联邦学习基线;具体数值未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30161", "date": "2026-06-29", "score": 8, "score_relevance": 4, "score_contribution": 4, "score_reason": "联邦聚合权重方法,创新幅度一般。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗", "方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Dario Fenoglio, Daniil Kirilenko, Martin Gjoreski et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30310", "run_id": "run-20260703-real4", "title": "Highly Data Parallelizable Estimation of the Sliced-Wasserstein Distance Using Cumulative Distribution Functions", "abstract": "基于累积分布函数给出 Sliced-Wasserstein 距离的新估计器,免去排序、可大规模数据并行,并天然兼容联邦学习本地聚合。", "effects": "在高斯混合等 CDF 易处理场景优于分位数估计;联邦下可本地聚合不交换原始样本。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30310", "date": "2026-06-29", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "统计度量理论,联邦兼容;新估计器有理论价值但离端侧远。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习"], "insight_person": "", "wiki_url": "", "authors": "Christophe Vauthier, Quentin Mérigot, Anna Korba", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29775", "run_id": "run-20260703-real4", "title": "SMART-MIG: A Learning Framework for Scalable and Energy-Efficient GPU Scheduling", "abstract": "SMART-MIG 用均场多智能体强化学习做大规模 MIG 重分区,加定制启发式调度,在 GPU 数据中心兼顾能效和延迟。", "effects": "能效-延迟效率比静态分区高 18%,能耗距理论下界仅高 27%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29775", "date": "2026-06-29", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "云端 GPU 调度,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:能耗功耗", "方向:评测基准", "方向:云端serving", "方向:端侧agent", "硬件:GPU"], "insight_person": "", "wiki_url": "", "authors": "Wenqing Yu, Neel Karia, Tanvi Hisaria et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29399", "run_id": "run-20260703-real4", "title": "LLM-Guided Planning for Multi-hop Reasoning over Multimodal Nuclear Regulatory Documents", "abstract": "把核监管文档多跳推理建成规划问题,LLM agent 在无向量文档树上用浏览/读/搜工具,维护动态知识图谱作状态。", "effects": "200 题基准上 81.5% 准确率、RAGAS 忠实度 0.93,超 LightRAG/HippoRAG/GraphRAG 并匹配 RAPTOR;端侧推理增 2.8x 成本无准确率提升。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29399", "date": "2026-06-28", "score": 8, "score_relevance": 3, "score_contribution": 5, "score_reason": "云端文档推理 agent,明确说端侧推理无收益。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:多模态", "方向:评测基准", "方向:端侧agent", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Mingyu Jeon, Bokyeong Kim, Suwan Cho et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.27974", "run_id": "run-20260703-real4", "title": "ProMSA:Progressive Multimodal Search Agents for Knowledge-Based Visual Question Answering", "abstract": "ProMSA 是渐进式多模态搜索 agent,迭代选择图像/文本搜索或停止,受工具调用预算与去重约束,用拒绝采样 SFT+TN-GSPO 序列级 RL 训练。", "effects": "E-VQA 与 InfoSeek 上一致优于强 RAG 与 agent 基线,检索与端到端精度提升;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.27974", "date": "2026-06-26", "score": 8, "score_relevance": 2, "score_contribution": 6, "score_reason": "KB-VQA agent,与端侧无关;渐进式搜索+TN-GSPO,中等创新。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:工具调用", "方向:多模态", "方向:端侧agent", "应用:RAG", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "ZhengXian Wu, Hangrui Xu, Kai Shi et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.02050", "run_id": "run-20260703-real4", "title": "A Memory Efficient Unified Algorithm for Online Learning of Linear Dynamical Systems", "abstract": "提出一种内存自适应的线性动态系统在线预测统一算法,可学习参数量随不稳定性复杂度 k 而非完整隐状态维度增长。", "effects": "在高维系统上同等参数预算下显著优于现有方法;并给出 k 是有效复杂度下界证明。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.02050", "date": "2026-07-02", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "控制理论在线学习,与端侧 AI 几乎无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Yuval Ran-Milo, Angelos Assos, Elad Hazan", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00946", "run_id": "run-20260703-real4", "title": "A Geometric Perspective on Composable Emotion Steering in Text-to-Speech Models", "abstract": "首次比较语音语言模型(SLM)与条件流匹配(CFM)模块作为混合情感 TTS 激活调控位点的几何特性,发现 SLM 有干净低维情感子空间且解耦更好。", "effects": "未报告具体数字;联合调控增强情感强度但损害比例控制与语音质量。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00946", "date": "2026-07-01", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "TTS 情感控制,与端侧无关;首个 SLM/CFM 几何比较,中等创新。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "应用:语音"], "insight_person": "", "wiki_url": "", "authors": "Siyi Wang, James Bailey, Ting Dang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01131", "run_id": "run-20260703-real4", "title": "Autonomous Scientific Discovery via Iterative Meta-Reflection", "abstract": "DiscoPER 是 LLM 驱动的自主科学发现框架,动态生成执行代码探索数据集,通过二阶元反思周期性分析自身积累发现。", "effects": "在 iNatDisco 基准上恢复 9 个已知模式中的 8 个,假设支持率 72.7%,超过因果发现和 LLM 基线。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01131", "date": "2026-07-01", "score": 7, "score_relevance": 1, "score_contribution": 6, "score_reason": "云端自主科研 agent,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:多模态", "方向:评测基准", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Bingchen Zhao, Sara Beery, Oisin Mac Aodha", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00377", "run_id": "run-20260703-real4", "title": "SAOT: Self-Supervised Continual Graph Learning with Structure-Aware Optimal Transport", "abstract": "SAOT 用最优传输捕获并保持图表示的全局节点间对应关系,加跨任务知识蒸馏,做自监督持续图学习。", "effects": "在四个 CGL 基准上超过自监督基线,CoraFull-CL 平均准确率提升达 5%,Products-CL 超 15%。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00377", "date": "2026-07-01", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "图持续学习,与端侧 AI 无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:蒸馏", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Yuting Zhang, Yanbei Liu, Zhitao Xiao et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31831", "run_id": "run-20260703-real4", "title": "An Agentic AI Framework to Accelerate Scientific Discovery in Plant Phenotyping", "abstract": "面向植物表型高通量成像,构建对话式 Co-Scientist Agent 与无头 Compute Agent,在 Frontier 超算上调度视觉分割与性状提取,把数周分析变成秒级交互。", "effects": "将数天到数周的分析流程转为秒级交互循环,端到端溯源可捕获。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31831", "date": "2026-06-30", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "超算 agentic 框架,云端科研;双 agent 安全域设计有工程价值。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:联邦学习", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Renan Souza, Daniel Rosendo, Kelsey Carter et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.32025", "run_id": "run-20260703-real4", "title": "Generative Skill Composition for LLM Agents", "abstract": "SkillComposer 把技能组合形式化为任务条件技能序列预测,用约束自回归解码器一次性联合决定技能子集、数量和顺序。", "effects": "在 SkillsBench 上 GPT-5.2-Codex 和 Gemini-3-Pro 分别比无技能基线高 +23.1、+18.2pp,匹配金标准技能检索上界且 prompt 更省。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.32025", "date": "2026-06-30", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "云端 agent 技能组合,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "模型:GPT", "应用:代码", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Xinyu Zhao, Zhen Tan, Vaishnav Tadiparthi et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.32034", "run_id": "run-20260703-real4", "title": "QVal: Cheaply Evaluating Dense Supervision Signals for Long-Horizon LLM Agents", "abstract": "QVal 是免训练测试床,用强参考策略 Q 值衡量稠密监督信号的 Q 对齐度,在不跑训练的情况下对比 21 种稠密监督方法。", "effects": "简单提示基线一致优于近期稠密监督方法;性能按方法族聚类;结论跨模型规模/环境稳定。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.32034", "date": "2026-06-30", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "LLM agent 训练监督评估,云端;测试床有贡献但属评估工具。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:蒸馏", "方向:评测基准", "方向:云端serving"], "insight_person": "", "wiki_url": "", "authors": "Sergio Hernández-Gutiérrez, Matteo Merler, Ilze Amanda Auzina et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30602", "run_id": "run-20260703-real4", "title": "MESA: Prioritizing Vulnerable Communication Channels for Securing Multi-Agent Systems", "abstract": "Mesa 是无标签框架,用六个图论指标和两个动态探测主动给多 agent 系统的通信边按安全关键性排序。", "effects": "排序与每边攻击成功率强相关(平均 Spearman ρ=+0.60,峰值 +0.73);监控前 10% 边拦截约 3 倍于随机的成功攻击。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30602", "date": "2026-06-29", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "多 agent 安全,与端侧 AI 无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:评测基准", "方向:端侧agent", "模型:Llama", "模型:Qwen", "模型:Gemma"], "insight_person": "", "wiki_url": "", "authors": "Kunyang Li, Kyle Domico, Jonathan Gregory et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29914", "run_id": "run-20260703-real4", "title": "MemDelta: Controlled Baselines and Hidden Confounds in Agent Memory Evaluation", "abstract": "MemDelta 是受控评估协议,在 LongMemEval-S 上一次只变一个组件,拆解 agent 记忆方法增益中混杂的模型/嵌入/检索因素。", "effects": "verbatim RAG 与 GPT-4o-mini 全上下文持平;换嵌入可使准确率波动 6.2pp;agent 自记忆(42%)低于基础检索(47%)。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29914", "date": "2026-06-29", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "agent 记忆评估,云端;受控协议有方法学价值但属评估。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent", "模型:GPT", "应用:RAG"], "insight_person": "", "wiki_url": "", "authors": "Kuan Wang", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29116", "run_id": "run-20260703-real4", "title": "Characterizing Large Language Model Agentic Workflows: A Study on N8n Ecosystem", "abstract": "首次大规模实证分析低代码平台 n8n 上 6000+ 个公开 LLM agentic 工作流,考察任务分布、结构/工具模式、可靠性机制与自主级别。", "effects": "LLM 工作流多嵌入控制逻辑与外部工具;显式可靠性机制(回退/修复/审批门)较少;给出 10 项发现与 5 条研究启示。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.29116", "date": "2026-06-27", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "低代码 LLM 工作流分析,云端;实证规模有贡献但属经验研究。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:端侧agent"], "insight_person": "", "wiki_url": "", "authors": "Yutian Tang, Yuming Zhou, Huaming Chen", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.28781", "run_id": "run-20260703-real4", "title": "HyphaeDB: A Living Knowledge Topology for Agent-First Memory", "abstract": "HyphaeDB 把 HNSW 图拓扑重解释为多 agent 通信结构,agent 是向量空间节点,知识通过邻居结构 gossip 传播并能量衰减,涌现矛盾检测和共识形成。", "effects": "提供 PostgreSQL+pgvector 参考实现并在多 agent 软件工程方法中部署;性能基准数据未报告。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.28781", "date": "2026-06-27", "score": 7, "score_relevance": 2, "score_contribution": 5, "score_reason": "agent 记忆基础设施,与端侧 AI 无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:能耗功耗", "方向:端侧agent", "应用:代码"], "insight_person": "", "wiki_url": "", "authors": "Krishna Halaharvi", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01426", "run_id": "run-20260703-real4", "title": "When Should Service Agents Reconsider? Difficulty-Routed Control in Customer-Service Operations", "abstract": "提出难度路由的客服 agent 服务控制架构,常规会话走低成本基线,有操作冲突的会话升级到冲突感知沟通和写前重新考虑流程。", "effects": "在 τ²-bench 零售任务上对操作冲突请求可靠性稳定提升;路由证据表明强控制指向冲突请求而非泛化。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01426", "date": "2026-07-01", "score": 6, "score_relevance": 2, "score_contribution": 4, "score_reason": "云端客服 agent 控制流,与端侧无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:工具调用", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Qian Chen, Chengyuan Liu, Xin Yu", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.30997", "run_id": "run-20260703-real4", "title": "A Three-Phase Foundation Model for Tax-Aware Personalized Portfolio Management", "abstract": "三阶段深度强化学习个性化投资组合系统:无 ticker 锁定的跨资产编码器、MoE 多目标 actor-critic、以及推理时用 76 参数 LoRA 做个性化。", "effects": "未报告具体金融指标;首次将时序基础模型 Chronos 用于组合管理 RL。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.30997", "date": "2026-06-30", "score": 6, "score_relevance": 1, "score_contribution": 5, "score_reason": "金融 RL,与端侧无关;三阶段+MoE+LoRA 个性化有设计但领域远。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:MoE"], "insight_person": "", "wiki_url": "", "authors": "Ramin Pishehvar", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.31207", "run_id": "run-20260703-real4", "title": "Towards Inclusive Mobility Modeling: Characterizing and Evaluating Elderly Trajectory Patterns in Urban Systems", "abstract": "研究城市出行建模中老年群体代表性不足带来的偏差,用合成轨迹生成案例评估马尔可夫链和 Qwen3-4B QLoRA 微调。", "effects": "全人口训练的马尔可夫模型高估老年步长 4.5%、停留时间 8.9%;老年专属模型误差更低。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2606.31207", "date": "2026-06-30", "score": 6, "score_relevance": 2, "score_contribution": 4, "score_reason": "出行建模公平性研究,与端侧 AI 无关。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:剪枝稀疏", "方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Zhengxuan Wang, Haohan He, Mengying Zhou", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.00627", "run_id": "run-20260703-real4", "title": "AGI Maze as a Benchmark Framework for World-Modeling Agents", "abstract": "AGI Maze 是轻量级框架,用网格迷宫任务评测 LLM agent 是否能学习并使用外部世界状态表示,而非只做局部规则推断。", "effects": "原始 LLM 推理时无法表示迷宫;允许用消息历史做工作记忆的基线在小迷宫上仍不足;未报告具体数字。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.00627", "date": "2026-07-01", "score": 5, "score_relevance": 1, "score_contribution": 4, "score_reason": "LLM agent 基准,与端侧无关;轻量框架但方法基础。", "source_tier": "学校预印本", "open_source": false, "tags": ["方向:记忆", "方向:评测基准", "方向:端侧agent", "应用:长上下文推理"], "insight_person": "", "wiki_url": "", "authors": "Alexey Potapov", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2607.01498", "run_id": "run-20260703-real4", "title": "Towards Learning Representations of Policies in Two-Player Zero-Sum Imperfect-Information Games", "abstract": "研究二人零和非完备信息博弈中策略表示(嵌入)的学习方法,提出构建策略数据集、学习表示、下游任务评估三类方法,在 Kuhn/Leduc 扑克上验证。", "effects": "未报告具体数字;基础方法即能学到有用行为表示。", "mechanism": "未报告", "paper_url": "https://arxiv.org/abs/2607.01498", "date": "2026-07-01", "score": 5, "score_relevance": 1, "score_contribution": 4, "score_reason": "博弈论策略表示,与端侧无关;方法基础,创新有限。", "source_tier": "学校预印本", "open_source": true, "tags": ["方向:评测基准"], "insight_person": "", "wiki_url": "", "authors": "Kevin Wang, Kevin Yang, Arjun Prakash et al.", "vendors": "", "venue": "arXiv", "recommendation": "纳入", "detail": null, "updated_at": "2026-07-03T06:23:30.494976+00:00"}, {"id": "arxiv-2606.29030", "run_id":     <script>
    let ALL=[], ACTIVE=new Set(), Q="", SORT="score";
    const TIER=[["官方动态","--amber"],["开源大项目","--green"],["公司项目","--blue"],["学校顶会","--purple"],["学校预印本","--slate"]];

    async function loadPapers(){
      const data = window.__PAPERS__;
      ALL=data.papers||[];
      renderFilter(); renderPapers();
      attachSpy();
      document.querySelector("#summary").innerHTML=`<b>${ALL.length}</b> signals · 7-day window · <b>${range()}</b>`;
    }
    async function loadWeekly(){
      const w = window.__WEEKLY__;
      const el=document.querySelector("#weekly");
      if(!w||!w.highlights||!w.highlights.length){el.innerHTML="";return;}
      el.innerHTML=`<div class="weekly-title">本周热点 · weekly signals</div>`+
        (w.overview?`<div class="weekly-ov">${escapeHtml(w.overview)}</div>`:"")+
        w.highlights.map((h,i)=>{const href=h.url?escapeAttr(h.url):`/paper/${escapeAttr(h.paper_id)}`;const tgt=h.url?` target="_blank" rel="noopener"`:"";return `<div class="weekly-hl"><span class="weekly-num">${i+1}</span><a class="weekly-topic" href="${href}"${tgt}>${escapeHtml(h.topic)}</a><span class="weekly-why">— ${escapeHtml(h.why)}</span></div>`;}).join("");
    }
    function range(){const d=ALL.map(p=>p.date).sort();return d.length?`${d[0]} → ${d[d.length-1]}`:'';}

    function allTags(){const s=new Set();ALL.forEach(p=>(p.tags||[]).forEach(t=>s.add(t)));return[...s];}
    const dim=t=>t.split(":")[0], val=t=>t.split(":")[1]||t;

    function renderFilter(){
      const bd={};allTags().forEach(t=>{const d=dim(t);(bd[d]=bd[d]||[]).push(t)});
      document.querySelector("#filter").innerHTML=["方向","应用","硬件","模型"].filter(d=>bd[d]).map(d=>
        `<div class="dim-group"><span class="dim-label">${d}</span>`+
        bd[d].map(t=>`<button class="ftag${ACTIVE.has(t)?" active":""}" data-tag="${escapeAttr(t)}" data-dim="${d}">${escapeHtml(val(t))}</button>`).join("")+
        `</div>`).join("");
    }

    function visible(){
      let l=ALL.filter(p=>ACTIVE.size===0||(p.tags||[]).some(t=>ACTIVE.has(t)));
      if(Q){const q=Q.toLowerCase();l=l.filter(p=>(p.title+p.abstract+(p.tags||[]).join()+p.vendors).toLowerCase().includes(q));}
      l.sort((a,b)=>SORT==="score"?b.score-a.score||b.date.localeCompare(a.date):b.date.localeCompare(a.date));
      return l;
    }
    function sigBars(s){const n=Math.min(5,Math.max(1,Math.ceil(s/4)));const hi=s>=14;let r="";for(let i=0;i<5;i++)r+=`<i class="${i<n?'on':''} ${hi?'hi':''}"></i>`;return r;}

    function renderRow(p){
      const hi=p.score>=14;
      const tags=(p.tags||[]).map(t=>`<span class="tag" data-dim="${dim(t)}">${escapeHtml(val(t))}</span>`).join("");
      return`<a class="row${hi?' hi':''}" href="paper/${escapeAttr(p.id)}.html" onclick="openDetail('${escapeAttr(p.id)}');return false;">
        <span class="sig"><span class="sig-n${hi?' hi':''}">${p.score}</span><span class="sig-bars">${sigBars(p.score)}</span></span>
        <span class="tier">${escapeHtml(p.source_tier||'')}</span>
        ${p.open_source?'<span class="open">OSS</span>':''}
        <span class="date">${p.date}</span>
        <span class="ttl">${escapeHtml(p.title)}</span>
        ${tags?`<span class="tags">${tags}</span>`:''}
        <span class="abs">${escapeHtml(p.abstract||'')}</span>
      </a>`;
    }

    function openDetail(id){
      const p=ALL.find(x=>x.id===id);
      const ov=document.querySelector("#overlay");
      if(!p){ov.classList.add("hidden");return;}
      const tags=(p.tags||[]).map(t=>`<span class="tag" data-dim="${dim(t)}">${escapeHtml(val(t))}</span>`).join("");
      const hi=p.score>=14;
      ov.innerHTML=`<div class="card">
        <span class="card-close" onclick="closeDetail()">esc ✕</span>
        <div class="card-meta"><span class="band-bar" style="display:inline-block;width:3px;height:12px;background:var(--ink)"></span><span class="tier">${escapeHtml(p.source_tier||'')}</span>${p.open_source?'<span class="open">OSS</span>':''}<span class="date">${p.date}</span><span>score ${p.score}</span><span>(${p.score_relevance||0}+${p.score_contribution||0})</span></div>
        <h2>${escapeHtml(p.title)}</h2>
        ${tags?`<div class="tags">${tags}</div>`:''}
        <div class="abs">${escapeHtml(p.abstract||'')}</div>
        ${p.effects?`<div class="field"><b>effects</b>${escapeHtml(p.effects)}</div>`:''}
        ${p.mechanism?`<div class="field"><b>mechanism</b>${escapeHtml(p.mechanism)}</div>`:''}
        ${p.score_reason?`<div class="field"><b>评分依据</b>${escapeHtml(p.score_reason)}</div>`:''}
        ${p.authors?`<div class="field"><b>authors</b>${escapeHtml(p.authors)}</div>`:''}
        ${p.vendors?`<div class="field"><b>vendors</b>${escapeHtml(p.vendors)}</div>`:''}
        ${p.venue?`<div class="field"><b>venue</b>${escapeHtml(p.venue)}</div>`:''}
        ${p.paper_url?`<a class="src" href="${escapeAttr(p.paper_url)}" target="_blank" rel="noopener">原文 ↗ ${escapeHtml(p.paper_url.replace(/^https?:\/\//,'').split('/')[0])}</a>`:''}
      </div>`;
      ov.classList.remove("hidden");
      document.body.style.overflow="hidden";
    }
    function closeDetail(){const ov=document.querySelector("#overlay");ov.classList.add("hidden");ov.innerHTML="";document.body.style.overflow="";}
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});

    function renderPapers(){
      const l=visible(),el=document.querySelector("#papers");
      if(!l.length){el.innerHTML='<div class="empty">no signal — 调整筛选或搜索</div>';renderTabs({});return;}
      const g={};l.forEach(p=>{(g[p.source_tier]=g[p.source_tier]||[]).push(p)});
      const COLLAPSE=25;  // sections with more rows than this start collapsed
      el.innerHTML=TIER.filter(([t])=>g[t]).map(([t,c])=>{
        const cl=g[t].length>COLLAPSE?' collapsed':'';
        return `<section class="band${cl}" id="band-${escapeAttr(t)}"><div class="band-head" onclick="this.parentElement.classList.toggle('collapsed')"><span class="fold">▾</span><span class="band-bar" style="background:${c}"></span><span class="band-title">${t}</span><span class="band-count">${g[t].length}</span>${g[t].length>COLLAPSE?'<span class="band-meta">点击展开</span>':''}</div>`+
        `<div class="band-body">`+g[t].map(renderRow).join("")+`</div></section>`;
      }).join("");
      renderTabs(g);
    }

    function renderTabs(g){
      g=g||{};
      const tabs=TIER.filter(([t])=>g[t]).map(([t,c])=>`<button class="tab" data-target="band-${escapeAttr(t)}">${t}<b>${g[t].length}</b></button>`);
      const tn=(window.__TRENDING__&&window.__TRENDING__.items)?window.__TRENDING__.items.length:(window.__TRENDING__||[]).length;
      if(tn) tabs.push(`<button class="tab" data-target="band-trending">GitHub 热榜<b>${tn}</b></button>`);
      document.querySelector("#tabs").innerHTML=tabs.join("");
    }

    function renderTrendingRow(r){
      return`<a class="row" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">
        <span class="sig"><span class="sig-n">${r.rank}</span><span class="sig-bars">${sigBars(parseInt((r.week||'0').replace(/,/g,''))/2000)}</span></span>
        <span class="tier">trending</span>
        <span class="date">+${escapeHtml(r.week||'')}/wk</span>
        <span class="ttl">${escapeHtml(r.repo)}</span>
        <span class="abs">${escapeHtml(r.desc||'')}</span>
        <span class="open">${escapeHtml(r.total||'')}★</span>
      </a>`;
    }
    function renderTrending(list){
      const el=document.querySelector("#trending");
      if(!list||!list.length){el.innerHTML="";return;}
      el.innerHTML=`<section class="band" id="band-trending"><div class="band-head" onclick="this.parentElement.classList.toggle('collapsed')"><span class="fold">▾</span><span class="band-bar" style="background:var(--slate)"></span><span class="band-title">GitHub 热榜 · 本周 Top ${list.length}</span><span class="band-count">${list.length}</span><span class="band-meta">未筛选 · github.com/trending</span></div>`+
        `<div class="band-body">`+list.map(renderTrendingRow).join("")+`</div></section>`;
    }
    async function loadTrending(){
      let data = window.__TRENDING__ || null;
      if(!data){try{const r=await fetch("/api/trending");data=await r.json();}catch(e){return;}}
      renderTrending(data.items||data||[]);
      attachSpy();
    }

    document.querySelector("#filter").addEventListener("click",e=>{const b=e.target.closest(".ftag");if(!b)return;const t=b.dataset.tag;ACTIVE.has(t)?ACTIVE.delete(t):ACTIVE.add(t);renderFilter();renderPapers();});
    document.querySelector("#search").addEventListener("input",e=>{Q=e.target.value.trim();renderPapers();});
    document.querySelector("#sort-score").addEventListener("click",()=>{SORT="score";document.querySelector("#sort-score").classList.add("on");document.querySelector("#sort-date").classList.remove("on");renderPapers();});
    document.querySelector("#sort-date").addEventListener("click",()=>{SORT="date";document.querySelector("#sort-date").classList.add("on");document.querySelector("#sort-score").classList.remove("on");renderPapers();});

    // sticky tab bar: click → expand + scroll to section
    document.querySelector("#tabs").addEventListener("click",e=>{
      const b=e.target.closest(".tab");if(!b)return;
      const tgt=document.getElementById(b.dataset.target);if(!tgt)return;
      tgt.classList.remove("collapsed");
      tgt.scrollIntoView({behavior:"smooth",block:"start"});
    });
    // scroll-spy: highlight the tab of the section currently in view
    const spy=new IntersectionObserver((ents)=>{
      ents.forEach(en=>{if(en.isIntersecting){const id=en.target.id;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.target===id));}});
    },{rootMargin:"-45% 0px -50% 0px"});
    function attachSpy(){document.querySelectorAll("section.band[id]").forEach(s=>spy.observe(s));}

    function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;");}
    loadPapers().catch(e=>{document.querySelector("#summary").textContent=`读取失败：${e}`;});
    loadWeekly().catch(()=>{});
    loadTrending().catch(()=>{});
  </script>
</body>
</html>
